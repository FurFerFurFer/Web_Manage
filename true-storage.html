    // ── connections (ported from ConnectionsPicker in sir-ks02.html) ─────────

    function ConnectionsPicker({storages, storage, onSaveParents, onDetachChild, colorOf}) {
      const [editMode,setEditMode]=useState(false);
      const [editParentIds,setEditParentIds]=useState([...TS.parentIdsOf(storage)]);
      const [editChildIds,setEditChildIds]=useState([]);
      const [q,setQ]=useState("");
      const own=TS.parentIdsOf(storage);
      const parents=storages.filter(s=>own.includes(s.id));
      const children=storages.filter(s=>TS.parentIdsOf(s).includes(storage.id));
      const potentialChildren=storages.filter(s=>s.id!==storage.id&&!own.includes(s.id));
      const filteredOptions=potentialChildren.filter(s=>(s.name||"").toLowerCase().includes(q.toLowerCase()));

      function saveAll(){
        onSaveParents(storage.id,editParentIds);
        editChildIds.forEach(cid=>{
          const child=storages.find(s=>s.id===cid);
          if (child&&!TS.parentIdsOf(child).includes(storage.id)) onSaveParents(cid,[...TS.parentIdsOf(child),storage.id]);
        });
        setEditMode(false);setEditChildIds([]);setQ("");
      }

      if (!editMode) return (
        <div>
          <div className="flex items-center justify-between mb-1">
            <span className="text-xs text-gray-500">Connections</span>
            <button onClick={()=>{setEditMode(true);setEditParentIds([...own]);setEditChildIds([]);}} className="text-xs text-indigo-400 hover:text-indigo-200">edit</button>
          </div>
          <div className="space-y-1">
            {parents.length>0&&(
              <div><div className="text-xs text-gray-600 mb-1">Parents ↑</div>
                <div className="flex flex-wrap gap-1">{parents.map(p=>(
                  <div key={p.id} className="flex items-center gap-1 bg-gray-900 border border-gray-700 rounded pl-2 pr-1 py-1 text-xs">
                    <div className="w-1.5 h-1.5 rounded-full" style={{backgroundColor:colorOf(p.id)}}/>
                    <span>{p.name}</span>
                    <button onClick={()=>onSaveParents(storage.id,own.filter(x=>x!==p.id))} className="ml-1 text-gray-600 hover:text-red-400">⊗</button>
                  </div>
                ))}</div>
              </div>
            )}
            {children.length>0&&(
              <div><div className="text-xs text-gray-600 mb-1 mt-2">Children ↓</div>
                <div className="flex flex-wrap gap-1">{children.map(c=>(
                  <div key={c.id} className="flex items-center gap-1 bg-gray-900 border border-gray-700 rounded pl-2 pr-1 py-1 text-xs">
                    <div className="w-1.5 h-1.5 rounded-full" style={{backgroundColor:colorOf(c.id)}}/>
                    <span>{c.name}</span>
                    <button onClick={()=>onDetachChild(c.id,storage.id)} className="ml-1 text-gray-600 hover:text-red-400">⊗</button>
                  </div>
                ))}</div>
              </div>
            )}
            {!parents.length&&!children.length&&<span className="text-xs text-gray-600">No connections</span>}
          </div>
        </div>
      );

      return (
        <div className="bg-gray-900 border border-gray-700 rounded p-3 mb-2">
          <div className="text-xs font-bold text-gray-300 mb-3">EDIT CONNECTIONS</div>
          <div className="mb-3">
            <div className="text-xs text-gray-400 mb-1">Parents ↑</div>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search storages..."
              className="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1.5 mb-1 text-white placeholder-gray-600 text-xs"/>
            <div className="max-h-24 overflow-y-auto space-y-0.5 mb-1">
              <button onClick={()=>setEditParentIds([])} className={`w-full text-left text-xs px-2 py-1 rounded ${editParentIds.length===0?"bg-gray-600 text-white":"bg-gray-800 text-gray-400 hover:bg-gray-700"}`}>No parents (root)</button>
              {storages.filter(s=>s.id!==storage.id&&(s.name||"").toLowerCase().includes(q.toLowerCase())).map(s=>(
                <button key={s.id} onClick={()=>setEditParentIds(p=>p.includes(s.id)?p.filter(x=>x!==s.id):[...p,s.id])}
                  className={`w-full text-left text-xs px-2 py-1 rounded flex items-center gap-2 ${editParentIds.includes(s.id)?"bg-indigo-800 text-white":"bg-gray-800 text-gray-300 hover:bg-gray-700"}`}>
                  <div className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor:colorOf(s.id)}}/>
                  <span className="truncate">{s.name}</span>
                </button>
              ))}
            </div>
          </div>
          <div className="mb-3">
            <div className="text-xs text-gray-400 mb-1">Add Children ↓ (new only)</div>
            <div className="max-h-24 overflow-y-auto space-y-0.5">
              {filteredOptions.filter(s=>!children.find(c=>c.id===s.id)).map(s=>(
                <button key={s.id} onClick={()=>setEditChildIds(p=>p.includes(s.id)?p.filter(x=>x!==s.id):[...p,s.id])}
                  className={`w-full text-left text-xs px-2 py-1 rounded flex items-center gap-2 ${editChildIds.includes(s.id)?"bg-teal-800 text-white":"bg-gray-800 text-gray-300 hover:bg-gray-700"}`}>
                  <div className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor:colorOf(s.id)}}/>
                  <span className="truncate">{s.name}</span>
                </button>
              ))}
              {filteredOptions.filter(s=>!children.find(c=>c.id===s.id)).length===0&&<div className="text-xs text-gray-600 px-2">No options.</div>}
            </div>
          </div>
          <div className="flex gap-2">
            <button onClick={saveAll} className="flex-1 bg-indigo-700 hover:bg-indigo-600 text-white py-1.5 rounded text-xs font-bold">SAVE</button>
            <button onClick={()=>{setEditMode(false);setQ("");}} className="flex-1 bg-gray-800 text-gray-300 py-1.5 rounded text-xs">CANCEL</button>
          </div>
        </div>
      );
    }

    // ── the one link ─────────────────────────────────────────────────────────
    // Exactly one. Clearing DELETES the key rather than storing '', so a storage
    // with no link and one that never had one are the same state.

    function LinkEditor({link, onSave, onClear}) {
      const [editing,setEditing]=useState(false);
      const [draft,setDraft]=useState({label:link?.label||"",url:link?.url||""});
      React.useEffect(()=>{setDraft({label:link?.label||"",url:link?.url||""});},[link?.label,link?.url]);
      const has=!!(link&&link.url);
      return (
        <div className="mb-4">
          <div className="flex items-center justify-between mb-1">
            <div className="text-xs text-gray-500 tracking-widest">LINK</div>
            {!editing&&(
              <button onClick={()=>{setDraft({label:link?.label||"",url:link?.url||""});setEditing(true);}}
                className="text-xs text-indigo-400 hover:text-indigo-200">{has?"edit":"+ add link"}</button>
            )}
          </div>
          {editing?(
            <div className="bg-gray-900 border border-indigo-800 rounded p-2">
              <div className="flex gap-1 mb-1">
                <input autoFocus value={draft.label} onChange={e=>setDraft(p=>({...p,label:e.target.value}))} placeholder="label (optional)"
                  className="flex-1 min-w-0 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs text-white outline-none"/>
                <input value={draft.url} onChange={e=>setDraft(p=>({...p,url:e.target.value}))} placeholder="url"
                  onKeyDown={e=>{if(e.key==="Enter"&&draft.url.trim()){onSave(draft);setEditing(false);}}}
                  className="flex-1 min-w-0 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs text-white outline-none"/>
              </div>
              <div className="flex gap-1">
                <button onClick={()=>{if(draft.url.trim()){onSave(draft);setEditing(false);}}}
                  className="bg-indigo-700 hover:bg-indigo-600 text-white px-2 py-1 rounded text-xs font-bold">save</button>
                <button onClick={()=>setEditing(false)} className="bg-gray-700 text-gray-300 px-2 py-1 rounded text-xs">cancel</button>
                {has&&<button onClick={()=>{if(onClear()!==false) setEditing(false);}} className="ml-auto text-red-700 hover:text-red-400 text-xs px-2 py-1">clear</button>}
              </div>
            </div>
          ):has?(
            <div className="flex items-center gap-2 bg-gray-900 border border-gray-800 rounded px-2 py-1.5">
              <span className="text-xs">🔗</span>
              <a href={link.url} target="_blank" rel="noopener noreferrer"
                className="text-xs text-indigo-300 hover:text-indigo-100 truncate flex-1 min-w-0">{link.label||link.url}</a>
            </div>
          ):(
            <div className="text-xs text-gray-600 italic">No link attached.</div>
          )}
        </div>
      );
    }

    // ── explanation (draft + SAVE, as AnchorExplanationEditor does) ──────────

    function ExplanationEditor({explanation,onSave}) {
      const [draft,setDraft]=React.useState(explanation||"");
      const [saved,setSaved]=React.useState(false);
      // Follow the stored value if another tab changes it, but leave `saved`
      // alone — this effect fires on our own save too, and clearing the flag
      // there would flip the button back from SAVED the instant it was set.
      // Switching storages cannot leave a stale SAVED because StorageDetail is
      // keyed by storage id and remounts this whole editor.
      React.useEffect(()=>{setDraft(explanation||"");},[explanation]);
      const dirty=draft!==(explanation||"");
      return (
        <div className="mb-6">
          <div className="text-xs text-gray-500 mb-2 tracking-widest">EXPLANATION</div>
          <textarea value={draft} onChange={e=>{setDraft(e.target.value);setSaved(false);}} rows={5}
            placeholder="What is this storage, and why does it matter?"
            className="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 text-white placeholder-gray-600 text-sm outline-none focus:border-gray-500"
            style={{resize:"vertical",minHeight:"7.5rem"}}/>
          <div className="flex items-center gap-2 mt-2">
            <button onClick={()=>{onSave(draft);setSaved(true);}}
              className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-1 rounded text-xs font-bold">
              {saved&&!dirty?"SAVED":"SAVE"}
            </button>
            {dirty&&<span className="text-xs text-amber-400">unsaved</span>}
          </div>
        </div>
      );
    }

    // ── tag picker ───────────────────────────────────────────────────────────
    // Adapted from SourceDumpModal in documentations.html: the dump tree fully
    // expanded, leaves listing their MM sections. Picking one returns the pair.

    function TagPicker({dumps, mms, taken, onPick, onClose}) {
      useEffect(() => {
        const onKey = e => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      const childrenOf = id => dumps.filter(d => (d.parentId||null) === id);
      const roots = childrenOf(null);
      const anyLinks = dumps.some(d => dumpIsLeaf(dumps,d) && (d.mmLinks||[]).length);
      const isTaken = (dumpId,mmId) => taken.some(t => t.dumpId===dumpId && t.mmId===mmId);

      // `seen` is per-path, as buildTree does it. A parentId cycle is not
      // reachable from a root today — parentId is singular, so a dump inside one
      // is nobody's descendant — but this walks the same shape every other
      // traversal here guards, and a future re-parenting feature would make it
      // reachable. Guarding costs a Set copy; not guarding costs the page.
      const renderEntry = (d, depth, seen) => {
        if (seen.has(d.id)) return null;
        seen = new Set(seen).add(d.id);
        const leaf = dumpIsLeaf(dumps,d);
        return (
          <div key={d.id} style={{marginLeft: depth ? 14 : 0}} className="border-l border-gray-800 pl-2 mt-1">
            <div className="flex items-center gap-1 text-xs text-gray-300">
              <span>{leaf ? '📄' : '📁'}</span>
              <span className="font-bold">{d.title || 'Untitled'}</span>
            </div>
            {leaf && (d.mmLinks||[]).length===0 && (
              <div className="ml-4 text-[10px] text-gray-600 italic">no MMs linked</div>
            )}
            {leaf && (d.mmLinks||[]).map(l => {
              const mm = mmById(mms, l.mmId);
              const already = isTaken(d.id, l.mmId);
              return (
                <button key={l.id} disabled={already}
                  data-tag-option={`${d.id}:${l.mmId}`}
                  onClick={()=>onPick({dumpId:d.id, mmId:l.mmId})}
                  className={`ml-4 mt-1 block w-full truncate rounded px-1 py-0.5 text-left text-xs ${already?"text-gray-600 cursor-not-allowed":"text-cyan-300 hover:bg-gray-800"}`}>
                  ⛁ MM · {mm ? mm.name : 'Unknown MM'}{already&&<span className="text-gray-600"> · tagged</span>}
                </button>
              );
            })}
            {childrenOf(d.id).map(c => renderEntry(c, depth+1, seen))}
          </div>
        );
      };

      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60" onClick={onClose}>
          <div className="max-h-[80vh] w-[520px] max-w-[92vw] overflow-y-auto rounded-lg border border-gray-700 bg-gray-900 p-4"
            onClick={e=>e.stopPropagation()}>
            <div className="mb-2 flex items-center justify-between">
              <span className="text-xs font-bold tracking-widest text-gray-300">TAG A SOURCE DUMP MM</span>
              <button onClick={onClose} className="text-gray-500 hover:text-gray-200">✕</button>
            </div>
            {roots.length === 0 && (
              <div className="py-6 text-center text-xs text-gray-500">
                No source dumps yet. Add them in KS02 → KS03 → SOURCE DUMP.
              </div>
            )}
            {roots.length > 0 && !anyLinks && (
              <div className="pb-2 text-[10px] text-gray-500 italic">
                Dumps exist but no leaf entry has an MM linked yet — link one in KS02 first.
              </div>
            )}
            {roots.map(d => renderEntry(d, 0, new Set()))}
          </div>
        </div>
      );
    }

    // ── tagged-source rows ───────────────────────────────────────────────────
    // Reference only. One click expands the detail in place, a second click
    // closes it, and the expanded panel's TITLE navigates to that dump in KS02.
    // Everything inside the panel is read-only: sir-ks02.html owns sourceDumps.

    function TagRow({tag, dumps, mms, open, onToggle, onRemove}) {
      const dump = dumpById(dumps, tag.dumpId);
      const mm = mmById(mms, tag.mmId);
      const link = linkFor(dump, tag.mmId);
      // A dump deleted in KS02, or an MM link removed from it, leaves this tag
      // dangling. Say so and keep the row removable — never delete the user's
      // tag as a side effect of a delete somewhere else.
      const gone = !dump || !link;
      const blocks = link ? getSCTextBlocks(link) : [];
      const urls = (link && Array.isArray(link.links)) ? link.links : [];
      return (
        <div className="mb-1 rounded border border-gray-800 bg-gray-900" data-tag-id={tag.id}>
          <div className="flex items-center gap-2 px-3 py-2">
            <button onClick={onToggle} data-tag-toggle={tag.id}
              className="flex-1 min-w-0 text-left flex items-center gap-2">
              <span className="text-xs text-gray-600 shrink-0">{open?"▼":"▶"}</span>
              <span className="text-xs shrink-0">⛁</span>
              {gone?(
                <span className="text-xs text-gray-500 italic truncate">source removed</span>
              ):(
                <span className="text-xs text-gray-200 truncate">
                  {dump.title||"Untitled"} <span className="text-gray-600">·</span> <span className="text-gray-400">{mm?mm.name:"unknown MM"}</span>
                </span>
              )}
            </button>
            <button onClick={onRemove} data-tag-remove={tag.id} className="text-red-800 hover:text-red-500 text-xs shrink-0">✕</button>
          </div>
          {open&&(
            <div className="border-t border-gray-800 px-3 py-2">
              {gone?(
                <div className="text-xs text-gray-600 italic">
                  The source dump or its MM link no longer exists in KS02. Remove this tag with ✕, or restore the dump.
                </div>
              ):(
                <>
                  <a href={dumpHref(tag.dumpId, tag.mmId)} data-tag-title={tag.id}
                    className="block text-xs text-indigo-400 hover:text-indigo-200 font-bold tracking-widest underline decoration-dotted mb-2">
                    {dump.title||"Untitled"}
                  </a>
                  <div className="text-[10px] uppercase tracking-wider text-gray-500 mb-2">MM · {mm?mm.name:"unknown MM"}</div>
                  {!blocks.length&&!urls.length&&(
                    <div className="text-xs text-gray-600 italic">Nothing recorded under this MM yet.</div>
                  )}
                  {blocks.map(b=>(
                    <div key={b.id} className="bg-gray-800 rounded p-2 mb-1 select-text">
                      <div className="text-xs font-bold text-gray-200 mb-0.5 truncate">{b.title||"text"}</div>
                      <div className="text-xs text-gray-300 whitespace-pre-wrap">{b.explanation}</div>
                    </div>
                  ))}
                  {urls.map(u=>(
                    <div key={u.id} className="flex items-center gap-2 bg-gray-800 rounded px-2 py-1 mb-1">
                      <a href={u.url} target="_blank" rel="noopener noreferrer"
                        className="text-xs text-indigo-300 hover:text-indigo-100 truncate flex-1 min-w-0">{u.label||u.url}</a>
                    </div>
                  ))}
                  <div className="text-[10px] text-gray-600 mt-2">Read-only here — edit this on the SOURCE DUMP tab, or in KS02.</div>
                </>
              )}
            </div>
          )}
        </div>
      );
    }

    // ── detail ───────────────────────────────────────────────────────────────

    function StorageDetail({storage, storages, dumps, mms, colorOf,
      onBack, onRename, onDelete, onSaveParents, onDetachChild,
      onSaveLink, onClearLink, onSaveExplanation, onAddTag, onRemoveTag}) {
      const [confirmDelete,setConfirmDelete]=useState(null);
      const [editingName,setEditingName]=useState(false);
      const [nameDraft,setNameDraft]=useState("");
      const [openTagId,setOpenTagId]=useState(null);
      const [picking,setPicking]=useState(false);
      const tags=TS.tagsOf(storage);

      return (
        <div className="p-4 max-w-2xl mx-auto overflow-y-auto pb-20 h-screen-nav">
          <div className="flex items-center justify-between mb-3">
            <button onClick={onBack} className="text-gray-500 hover:text-white text-xs">← back</button>
            <button onClick={()=>setConfirmDelete(true)} className="text-red-700 hover:text-red-400 text-xs">delete</button>
          </div>
          <ConfirmDialog
            open={!!confirmDelete}
            title="Delete storage?"
            message={`Delete "${storage.name}" and everything saved on it? Its children stay, detached. This cannot be undone.`}
            onConfirm={()=>{setConfirmDelete(null);onDelete(storage.id);}}
            onCancel={()=>setConfirmDelete(null)}
          />

          <div className="flex items-center gap-2 mb-4">
            <div className="w-3 h-3 rounded-full shrink-0" style={{backgroundColor:colorOf(storage.id)}}/>
            {editingName?(
              <input autoFocus
                className="font-bold text-lg bg-transparent border-b border-current outline-none min-w-0 w-40"
                value={nameDraft}
                onChange={e=>setNameDraft(e.target.value)}
                onBlur={()=>{onRename(storage.id,nameDraft);setEditingName(false);}}
                onKeyDown={e=>{
                  if(e.key==="Enter"){onRename(storage.id,nameDraft);setEditingName(false);}
                  if(e.key==="Escape"){setEditingName(false);}
                }}
              />
            ):(
              <span className="font-bold text-lg cursor-text" title="Double-click to rename"
                onDoubleClick={()=>{setNameDraft(storage.name);setEditingName(true);}}
              >{storage.name}</span>
            )}
            {storage.createdAt&&<span className="text-xs text-gray-600 ml-1">{storage.createdAt}</span>}
          </div>

          <LinkEditor link={storage.link} onSave={l=>onSaveLink(storage.id,l)} onClear={()=>onClearLink(storage.id)}/>

          <div className="mb-4">
            <ConnectionsPicker storages={storages} storage={storage} onSaveParents={onSaveParents} onDetachChild={onDetachChild} colorOf={colorOf}/>
          </div>

          <div className="mb-6">
            <div className="flex items-center justify-between mb-2">
              <div className="text-xs text-gray-500 tracking-widest">SOURCE DUMP TAGS</div>
              <button onClick={()=>setPicking(true)} data-add-tag
                className="bg-indigo-700 hover:bg-indigo-600 text-white px-2 py-1 rounded text-xs font-bold">+ tag</button>
            </div>
            {!tags.length&&<div className="text-xs text-gray-600 italic">No source dump tagged yet.</div>}
            {tags.map(t=>(
              <TagRow key={t.id} tag={t} dumps={dumps} mms={mms}
                open={openTagId===t.id}
                onToggle={()=>setOpenTagId(p=>p===t.id?null:t.id)}
                onRemove={()=>{if(openTagId===t.id)setOpenTagId(null);onRemoveTag(storage.id,t.id);}}/>
            ))}
            {picking&&(
              <TagPicker dumps={dumps} mms={mms} taken={TS.tagPairs(storage)}
                onPick={pair=>{onAddTag(storage.id,pair.dumpId,pair.mmId);setPicking(false);}}
                onClose={()=>setPicking(false)}/>
            )}
          </div>

          <ExplanationEditor explanation={storage.explanation||""} onSave={txt=>onSaveExplanation(storage.id,txt)}/>
        </div>
      );
    }

    // ── add-storage modal ────────────────────────────────────────────────────

    function AddStorageModal({storages, colorOf, onAdd, onCancel}) {
      const [name,setName]=useState("");
      const [parentIds,setParentIds]=useState([]);
      const [q,setQ]=useState("");
      const filtered=storages.filter(s=>(s.name||"").toLowerCase().includes(q.toLowerCase()));
      return (
        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
          <div className="bg-gray-900 border border-gray-700 rounded-lg p-5 w-full max-w-sm">
            <div className="font-bold tracking-widest text-xs text-indigo-300 mb-3">NEW STORAGE</div>
            <input autoFocus value={name} onChange={e=>setName(e.target.value)} placeholder="Storage name…"
              onKeyDown={e=>{if(e.key==="Enter"&&name.trim())onAdd(name,parentIds);}}
              className="w-full bg-gray-800 border border-gray-700 rounded px-3 py-2 mb-3 text-white placeholder-gray-600 text-xs outline-none"/>
            <div className="text-xs text-gray-400 mb-1">Parents ↑ (optional)</div>
            {storages.length>0&&(
              <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search storages..."
                className="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1.5 mb-1 text-white placeholder-gray-600 text-xs outline-none"/>
            )}
            <div className="max-h-32 overflow-y-auto space-y-0.5 mb-3">
              {!storages.length&&<div className="text-xs text-gray-600 px-2 py-1">Nothing to nest under yet.</div>}
              {filtered.map(s=>(
                <button key={s.id} onClick={()=>setParentIds(p=>p.includes(s.id)?p.filter(x=>x!==s.id):[...p,s.id])}
                  className={`w-full text-left text-xs px-2 py-1 rounded flex items-center gap-2 ${parentIds.includes(s.id)?"bg-indigo-800 text-white":"bg-gray-800 text-gray-300 hover:bg-gray-700"}`}>
                  <div className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor:colorOf(s.id)}}/>
                  <span className="truncate">{s.name}</span>
                </button>
              ))}
            </div>
            <div className="flex gap-2">
              <button onClick={()=>{if(name.trim())onAdd(name,parentIds);}} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded font-bold text-xs">ADD</button>
              <button onClick={onCancel} className="flex-1 bg-gray-800 text-gray-300 py-2 rounded text-xs">CANCEL</button>
            </div>
          </div>
        </div>
      );
    }

    // ── app ──────────────────────────────────────────────────────────────────

    /* The ONE view table for this page. The header, the phone bar at the
       bottom of App, and the hash reader below all map it, so a view added
       here appears in all three places or in none. SOURCE DUMP is second so the
       first two tabs read exactly like KS03's own MULTIVERSE · SOURCE DUMP. */
    const VIEWS = [["multiverse","MULTIVERSE"],["sourcedump","SOURCE DUMP"],["tree","SRCH"]];
    const viewFromHash = () => {
      const h = window.location.hash.slice(1);
      return VIEWS.some(([v]) => v === h) ? h : "multiverse";
    };

    function App() {
      // Same contract as documentations.html: decided once at mount, and never
      // re-decided, so a refused bootstrap cannot flip to "ready" without the
      // user actually fixing the database and reloading.
      const [slotReady]=useState(()=>_bootstrapSlotIfSafe());
      const [activeSlotId,setActiveSlotId]=useState(null);
      const [storages,setStorages]=useState([]);
      const [manualPos,setManualPos]=useState({});
      // Mirrors of keys sir-ks02.html owns. `mms` is never written from here.
      // `dumps` is what this page RENDERS (visibleDumps); the SOURCE DUMP tab
      // edits the stored key through _mutateSourceDumps and then adopts the
      // stored result here — never the other way round.
      const [dumps,setDumps]=useState([]);
      const [mms,setMms]=useState([]);
      const [view,setView]=useState(viewFromHash);
      // The SOURCE DUMP tab's breadcrumb and its brief card ring. Held here,
      // as KS02 holds them in its App, so opening a storage from a chip and
      // coming back keeps the place.
      const [dumpPath,setDumpPath]=useState([]);
      const [focusDumpMm,setFocusDumpMm]=useState(null);
      const [selectedId,setSelectedId]=useState(null);
      const [focusId,setFocusId]=useState(null);
      const [treeFocusId,setTreeFocusId]=useState(null);
      const [adding,setAdding]=useState(false);
      const loadedRef=useRef(false);

      const colorOf=useCallback(id=>{
        const s=storages.find(x=>x.id===id);
        if (s&&s.customColor) return s.customColor;
        const i=storages.findIndex(x=>x.id===id);
        return i>=0?PALETTE[i%PALETTE.length]:"#6b7280";
      },[storages]);

      // A documented twin of mmColor in sir-ks02.html, so an MM's dot is the
      // same colour on both copies of the SOURCE DUMP page. Data colour, like
      // PALETTE itself: theme-invariant.
      const mmColor=useCallback(id=>{
        const mm=mms.find(m=>m.id===id);
        if (mm&&mm.customColor) return mm.customColor;
        const i=mms.findIndex(m=>m.id===id);
        return i>=0?PALETTE[i%PALETTE.length]:"#6b7280";
      },[mms]);

      const current=useMemo(()=>storages.find(s=>s.id===selectedId)||null,[storages,selectedId]);

      // on mount: adopt the active slot
      useEffect(()=>{
        if (!slotReady) return;
        const db=_getTrackDB(), slots=db.slots||[];
        const slot=slots.find(s=>s.id===db.activeSlotId)||slots[0];
        if (!slot) return;
        setActiveSlotId(slot.id);
        setStorages(slot.trueStorages||[]);
        setManualPos(slot.trueStoragePos||{});
        const visible=visibleDumps(slot.sourceDumps);
        setDumps(visible);
        setMms(slot.mms||[]);
        loadedRef.current=true;
        try {
          const q=new URLSearchParams(location.search);
          // ?storage=<id> deep link, the counterpart of documentations.html's
          // ?page= and progress.html's ?date=. An id naming nothing opens nothing.
          const want=q.get('storage');
          if (want&&(slot.trueStorages||[]).some(s=>s.id===want)) {
            setSelectedId(want);
            setFocusId(want);
            setTreeFocusId(want);
          }
          // ?dump=<id>[&mm=<id>] opens the SOURCE DUMP tab on that dump — the
          // counterpart of KS02's own ?dump= link, and where Back lands after an
          // MM name was followed into KS02 (sourceDumpHref). Dump ids are
          // numbers when KS02 minted them and strings when this page did, and a
          // query string is always text, so compare as text. An id naming
          // nothing opens the tab at Home, with no error.
          const wantDump=q.get('dump');
          if (wantDump!=null) {
            setView('sourcedump');
            const target=visible.find(d=>String(d.id)===String(wantDump));
            if (target) {
              setDumpPath(SD.pathTo(target.id,visible));
              const wantMm=q.get('mm');
              const link=wantMm==null?null:(Array.isArray(target.mmLinks)?target.mmLinks:[])
                .find(l=>l&&String(l.mmId)===String(wantMm));
              if (link) setFocusDumpMm(link.mmId);
            }
          }
        } catch {}
      },[slotReady]);

      // The ring is a hint, not a mode: drop it once it has been seen — the
      // same 2.5s KS02 gives its own.
      useEffect(()=>{
        if (focusDumpMm==null) return;
        const t=setTimeout(()=>setFocusDumpMm(null),2500);
        return ()=>clearTimeout(t);
      },[focusDumpMm]);

      // A workspace switched in another tab: the breadcrumb names the OLD
      // slot's dumps, so the new one starts at Home. Only on a change between
      // two real slots — the mount sets the first id in the same batch as a
      // ?dump= path, and resetting then would undo the deep link.
      const shownSlotRef=useRef(null);
      useEffect(()=>{
        const prev=shownSlotRef.current;
        shownSlotRef.current=activeSlotId;
        if (prev&&activeSlotId&&prev!==activeSlotId) { setDumpPath([]); setFocusDumpMm(null); }
      },[activeSlotId]);

      // autosave: ONLY the two keys this page owns, merged into a fresh read.
      // loadedRef stops the empty initial state being written over stored data
      // before the mount effect has run.
      useEffect(()=>{
        if (!activeSlotId||!loadedRef.current) return;
        // Skip a write that would store what is already stored — mounting and
        // every cross-tab refresh would otherwise re-save identical bytes, mark
        // track_db_pending, and arm a sync upload for nothing.
        const db=_getTrackDB();
        const cur=(db.slots||[]).find(s=>s.id===activeSlotId);
        if (cur
          && JSON.stringify(cur.trueStorages||[])===JSON.stringify(storages)
          && JSON.stringify(cur.trueStoragePos||{})===JSON.stringify(manualPos)) return;
        _writeSlotKeys(activeSlotId,{trueStorages:storages,trueStoragePos:manualPos});
      },[storages,manualPos,activeSlotId]);

      // cross-tab / remote freshness, matching index, progress, KS02 and
      // documentations. Every value is compared before it is applied, so a write
      // from another page that touches nothing here causes no re-render and, in
      // turn, no needless save or sync upload.
      useEffect(()=>{
        const refresh=()=>{
          const db=_getTrackDB(), slots=db.slots||[];
          const slot=slots.find(s=>s.id===db.activeSlotId)||slots[0];
          if (!slot) return;
          const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
          const fresh=(set,val)=>set(prev=>same(prev,val)?prev:val);
          // Move slot identity with the data snapshot, or an autosave could
          // write A's stale fields into B after a switch in another tab.
          setActiveSlotId(prev=>prev===slot.id?prev:slot.id);
          fresh(setStorages,slot.trueStorages||[]);
          fresh(setManualPos,slot.trueStoragePos||{});
          fresh(setDumps,visibleDumps(slot.sourceDumps));
          fresh(setMms,slot.mms||[]);
        };
        const onStorage=e=>{ if (!e.key||e.key==='track_db') refresh(); };
        const onVis=()=>{ if (!document.hidden) refresh(); };
        window.addEventListener('storage',onStorage);
        document.addEventListener('visibilitychange',onVis);
        return ()=>{
          window.removeEventListener('storage',onStorage);
          document.removeEventListener('visibilitychange',onVis);
        };
      },[]);

      useEffect(()=>{
        const onHash=()=>setView(viewFromHash());
        window.addEventListener('hashchange',onHash);
        return ()=>window.removeEventListener('hashchange',onHash);
      },[]);

      // ── mutations (every one spreads: a storage may carry keys a later
      //    version added, and normalizeSlot deliberately preserves them) ──────

      function addStorage(name,parentIds){
        const s={
          id:genId(),
          name:name.trim(),
          createdAt:localToday(),
          parentIds:[...(parentIds||[])],
          explanation:"",
          tags:[]
        };
        setStorages(p=>[...p,s]);
        setAdding(false);
        setSelectedId(s.id);
      }
      function duplicateStorage(id){
        setStorages(p=>{
          const s=p.find(x=>x.id===id); if(!s) return p;
          return [...p,{
            ...s,
            id:genId(),
            name:(s.name||"")+" copy",
            createdAt:localToday(),
            tags:TS.tagsOf(s).map(t=>({...t,id:genId()}))
          }];
        });
      }
      function renameStorage(id,name){
        if(!name.trim())return;
        setStorages(p=>p.map(s=>s.id===id?{...s,name:name.trim()}:s));
      }
      function deleteStorage(id){
        setStorages(p=>p
          .filter(s=>s.id!==id)
          .map(s=>TS.parentIdsOf(s).includes(id)?{...s,parentIds:TS.parentIdsOf(s).filter(x=>x!==id)}:s));
        setManualPos(p=>{ if(!(id in p)) return p; const n={...p}; delete n[id]; return n; });
        setSelectedId(prev=>prev===id?null:prev);
      }
      function saveParents(id,parentIds){
        setStorages(p=>p.map(s=>s.id===id?{...s,parentIds:[...parentIds]}:s));
      }
      function detachChild(childId,parentId){
        setStorages(p=>p.map(s=>s.id===childId?{...s,parentIds:TS.parentIdsOf(s).filter(x=>x!==parentId)}:s));
      }
      function setColor(id,color){
        setStorages(p=>p.map(s=>s.id===id?{...s,customColor:color}:s));
      }
      function saveLink(id,draft){
        const url=(draft.url||"").trim(); if(!url) return;
        const label=(draft.label||"").trim();
        setStorages(p=>p.map(s=>s.id===id?{...s,link:label?{label,url}:{url}}:s));
      }
      // Delete the key rather than store an empty one, so "no link" is one
      // state whether or not a link was ever attached.
      // Returns false when declined, so the call site can leave the editor open
      // instead of closing it on a change that never happened.
      function clearLink(id){
        if(!window.confirm('Remove the link from this storage?')) return false;
        setStorages(p=>p.map(s=>{
          if(s.id!==id) return s;
          const n={...s}; delete n.link; return n;
        }));
      }
      function saveExplanation(id,text){
        setStorages(p=>p.map(s=>s.id===id?{...s,explanation:text}:s));
      }
      // Both tag writers go through true-storage-core.js, so a tag made here and
      // a tag made from KS02 have exactly one shape.
      function addTag(storageId,dumpId,mmId){
        setStorages(p=>TS.withTag(p,storageId,dumpId,mmId,genId()));
      }
      function removeTag(storageId,tagId){
        if(!window.confirm('Remove this source tag?\n\nThe source dump itself is not deleted.')) return;
        setStorages(p=>TS.withoutTag(p,storageId,tagId));
      }
      // Sibling reorder, ported from SRCH including its guard: only records that
      // are actually siblings may swap places. Without that check a drag across
      // branches would still splice the flat array, changing an order the user
      // cannot see and never asked for. Order in `trueStorages` IS the order both
      // views render, so there is no separate order field to keep in step.
      function arrange(draggedId,targetId,before){
        setStorages(p=>{
          const byId=Object.fromEntries(p.map(s=>[s.id,s]));
          const a=byId[draggedId], b=byId[targetId];
          if(!a||!b)return p;
          // Compare only parents that still exist; a dangling parent id would
          // otherwise make two roots look like non-siblings.
          const pa=TS.parentIdsOf(a).filter(id=>byId[id]);
          const pb=TS.parentIdsOf(b).filter(id=>byId[id]);
          const siblings=(pa.length===0&&pb.length===0)||pa.some(id=>pb.includes(id));
          if(!siblings)return p;
          const arr=[...p];
          const [moved]=arr.splice(arr.findIndex(s=>s.id===draggedId),1);
          const to=arr.findIndex(s=>s.id===targetId);
          if(to<0)return p;
          arr.splice(before?to:to+1,0,moved);
          return arr;
        });
      }

      // ── SOURCE DUMP edits. `sourceDumps` is KS02's key: each edit is ONE
      //    fresh read-modify-write of it (_mutateSourceDumps), through the
      //    shared writers in source-dump-core.js — never this page's React
      //    copy, never the autosave. Ids come from genId(): strings, which can
      //    never collide with KS02's numeric nid() counter. A new title's
      //    createdAt is the LOCAL day. ────────────────────────────────────

      // Adopt what was stored, as this page renders it. Returns the stored list,
      // or null when nothing was written (a refusal leaves the screen as it was).
      function editDumps(fn){
        const next=_mutateSourceDumps(activeSlotId,fn);
        if (next) setDumps(visibleDumps(next));
        return next;
      }
      // Adding a title under a dump with MM sections MOVES them down to the new
      // child, so a storage tag naming the parent has to follow them
      // (TrackTrueStorage.repointDump) or it reads "source removed" while the
      // content is merely one level down. That tag lives in THIS page's own
      // key, so it moves through this page's state and autosave — and only once
      // the dump write has landed: a refused write leaves the sections, and so
      // the tags, where they were.
      function addDumpEntry(title,parentId){
        const newId=genId();
        let moved=false;
        const next=editDumps(d=>{
          moved=SD.inheritsLinks(d,parentId);
          return SD.withEntry(d,{id:newId,title,parentId,createdAt:localToday()});
        });
        if (next&&moved) setStorages(p=>TS.repointDump(p,parentId,newId));
      }
      // The dump and its descendants. Storage tags naming it are deliberately
      // left alone: they read "source removed" and stay removable by hand.
      function deleteDumpEntry(dumpId){editDumps(d=>SD.withoutEntry(d,dumpId));}
      function renameDumpEntry(dumpId,title){editDumps(d=>SD.withTitle(d,dumpId,title));}
      function addDumpMMLink(dumpId,mmId){const id=genId();editDumps(d=>SD.withMMLink(d,dumpId,mmId,id));}
      function removeDumpMMLink(dumpId,linkId){editDumps(d=>SD.withoutMMLink(d,dumpId,linkId));}
      function addDumpURLLink(dumpId,linkId,urlLink){const id=genId();editDumps(d=>SD.withURLLink(d,dumpId,linkId,urlLink,id));}
      function removeDumpURLLink(dumpId,linkId,urlId){editDumps(d=>SD.withoutURLLink(d,dumpId,linkId,urlId));}
      function addDumpTextBlock(dumpId,linkId,block){const id=genId();editDumps(d=>SD.withTextBlock(d,dumpId,linkId,block,id));}
      function removeDumpTextBlock(dumpId,linkId,blockId){editDumps(d=>SD.withoutTextBlock(d,dumpId,linkId,blockId));}
      function transferDumpTextBlock(dumpId,fromLinkId,blockId,toMmId){const id=genId();editDumps(d=>SD.transferTextBlock(d,dumpId,fromLinkId,blockId,toMmId,id));}
      function transferDumpURLLink(dumpId,fromLinkId,urlId,toMmId){const id=genId();editDumps(d=>SD.transferURLLink(d,dumpId,fromLinkId,urlId,toMmId,id));}

      // The leaf card's storage chips — this page's OWN key, so plain state.
      // Removing by (dump, MM) pair, because a chip has no tag id in hand; the
      // prompt is KS02's untagStorage text, and it lives in the handler because
      // every path through it deletes.
      function untagPair(storageId,dumpId,mmId){
        if(!window.confirm('Remove this storage tag?\n\nThe storage itself is not deleted.')) return;
        setStorages(p=>TS.withoutPair(p,storageId,dumpId,mmId));
      }

      // Following an MM name into KS02. Rewrite the CURRENT history entry to
      // this tab's own address for where the user stands, then let the link's
      // navigation push KS02 — so Back returns to this dump, with that MM's
      // card ringed, instead of to the canvas.
      function leaveForMM(dumpId,mmId){
        try { history.replaceState(history.state,'',sourceDumpHref(dumpId,mmId)); } catch {}
      }

      const openStorage=id=>{setSelectedId(id);};

      if (!slotReady) {
        return (
          <div className="min-h-screen bg-gray-950 text-gray-100 font-mono text-sm flex items-center justify-center p-6">
            <div className="max-w-md text-center">
              <div className="text-sm font-bold text-amber-300 mb-2">No workspace available yet</div>
              <div className="text-xs text-gray-400 mb-4">
                Either this browser's stored data could not be read, or older Progress/KS02 data is
                waiting to be migrated. Open <a href="progress.html" className="text-cyan-300 underline">Progress</a> or
                <a href="sir-ks02.html" className="text-cyan-300 underline mx-1">KS02</a>
                first, or start from the <a href="index.html" className="text-cyan-300 underline">Home</a> page.
              </div>
              <a href="index.html" className="text-xs text-gray-600 hover:text-gray-300">← TRACK</a>
            </div>
          </div>
        );
      }

      // VIEWS is the one view table, declared above App so the hash reader can
      // use it too; the header below and the phone bar both map it.
      const goToView = v => { setView(v); setSelectedId(null); };

      return (
        <div className="min-h-screen bg-gray-950 text-gray-100 font-mono text-sm select-none">
          <div className="flex items-center justify-between px-3 py-3 bg-gray-900 border-b border-gray-800">
            <a href="index.html" className="text-gray-600 hover:text-gray-300 transition-colors text-xs">← TRACK</a>
            <div className="flex gap-1">
              {VIEWS.map(([v,l])=>(
                <button key={v} onClick={()=>goToView(v)}
                  className={`px-2 py-1 rounded text-xs font-bold transition ${view===v?"bg-white text-gray-950":"text-gray-400 hover:text-white"}`}>{l}</button>
              ))}
            </div>
            <div className="theme-toggle-host" data-theme-toggle-host></div>
            <div className="flex items-center gap-2">
              <a href="sir-ks02.html#ks03" className="text-gray-600 hover:text-gray-300 text-xs">KS02 →</a>
              <button onClick={()=>setAdding(true)} className="bg-indigo-700 hover:bg-indigo-600 text-white px-2 py-1 rounded text-xs font-bold">+Storage</button>
            </div>
          </div>

          {current?(
            // Keyed by storage id: opening a different storage must not inherit
            // the previous one's open tag row, rename draft, or SAVED flag.
            <StorageDetail
              key={current.id}
              storage={current} storages={storages} dumps={dumps} mms={mms} colorOf={colorOf}
              onBack={()=>setSelectedId(null)}
              onRename={renameStorage}
              onDelete={deleteStorage}
              onSaveParents={saveParents}
              onDetachChild={detachChild}
              onSaveLink={saveLink}
              onClearLink={clearLink}
              onSaveExplanation={saveExplanation}
              onAddTag={addTag}
              onRemoveTag={removeTag}/>
          ):view==="multiverse"?(
            <div className="flex flex-col h-screen-nav">
              <StorageCanvas
                storages={storages} manualPos={manualPos} setManualPos={setManualPos}
                onOpen={openStorage} colorOf={colorOf} onFill={setColor}
                onDuplicate={duplicateStorage} focusId={focusId}/>
            </div>
          ):view==="sourcedump"?(
            // The copy of KS02's KS03 → SOURCE DUMP page — see the TWIN comment
            // above SourceDumpView. Same data: `dumps` is the stored key, and
            // every edit is a fresh read-modify-write of it.
            <div className="flex flex-col h-screen-nav">
              <SourceDumpView sourceDumps={dumps} mms={mms} mmColor={mmColor}
                dumpPath={dumpPath} setDumpPath={setDumpPath}
                onAddEntry={addDumpEntry} onDeleteEntry={deleteDumpEntry} onRename={renameDumpEntry}
                onAddMMLink={addDumpMMLink} onRemoveMMLink={removeDumpMMLink}
                onAddURLLink={addDumpURLLink} onRemoveURLLink={removeDumpURLLink}
                onAddTextBlock={addDumpTextBlock} onRemoveTextBlock={removeDumpTextBlock}
                onTransferTextBlock={transferDumpTextBlock} onTransferURLLink={transferDumpURLLink}
                onLeaveForMM={leaveForMM}
                trueStorages={storages} onTagStorage={addTag} onUntagStorage={untagPair}
                onOpenStorage={openStorage}
                focusMmId={focusDumpMm}/>
            </div>
          ):(
            <div className="overflow-y-auto h-screen-nav">
              <StorageTreeView storages={storages} colorOf={colorOf} onOpen={openStorage}
                onArrange={arrange} focusId={treeFocusId} onClearFocus={()=>setTreeFocusId(null)}/>
            </div>
          )}

          {/* PHONE NAV — one of four (progress.html, documentations.html and
              sir-ks02.html carry the others). The shared half is .track-tabbar
              in styles.css; this <nav> is the documented twin, and it is a twin
              because each page is its own inline-Babel React app with no module
              system.

              data-tabbar="true-storage" is load-bearing: this page and
              sir-ks02.html both carry the `ks02-page` body class, so the VALUE
              is the only thing that tells the two bars apart — without it a
              missing bar here would pass a test against that page's markup. */}
          <nav className="track-tabbar" data-tabbar="true-storage" aria-label="Sections">
            {VIEWS.map(([v,l])=>(
              <button key={v} type="button" className="track-tabbar-btn"
                data-tabbar-tab={v}
                aria-current={!current && view===v ? 'page' : undefined}
                onClick={()=>goToView(v)}>{l}</button>
            ))}
            <a className="track-tabbar-btn track-tabbar-home" data-tabbar-tab="home"
              href="index.html" aria-label="Track home">⌂</a>
          </nav>

          {adding&&(
            <AddStorageModal storages={storages} colorOf={colorOf}
              onAdd={addStorage} onCancel={()=>setAdding(false)}/>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
  <script src="scripts/notes-core.js?v=3"></script>
  <script src="scripts/notes-widget.js?v=5"></script>
</body>
</html>
