<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>True Storage</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232e6349%22/%3E%3Cg fill=%22none%22 stroke=%22white%22 stroke-width=%221.7%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2211%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227.6%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%224.4%22/%3E%3C/g%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%221.7%22 fill=%22white%22/%3E%3C/svg%3E">
  <script src="scripts/theme.js?v=1"></script>
  <script src="scripts/viewport.js?v=2"></script>
  <script src="scripts/storage-guard.js?v=2"></script>
  <script src="scripts/schema.js?v=9"></script>
  <script src="scripts/graph-layout.js?v=1"></script>
  <script src="scripts/true-storage-core.js?v=3"></script>
  <script src="scripts/source-dump-core.js?v=1"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="scripts/firebase-sync.js?v=2"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <link rel="stylesheet" href="styles/styles.css?v=17">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { gray: { 950: '#0e1210' } } } }
    };
  </script>
</head>
<body class="app-page ks02-page">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useRef, useEffect, useCallback } = React;

    const TS = window.TrackTrueStorage;
    // The one definition of how a source dump is edited, shared with KS02.
    const SD = window.TrackSourceDump;

    // Same palettes as KS03, so a storage node and an MM node read as the same
    // kind of object on screen.
    const PALETTE = ["#6366f1","#ec4899","#f59e0b","#10b981","#3b82f6","#8b5cf6","#14b8a6","#f97316","#06b6d4","#a3e635"];
    const FILL_COLORS = [
      "#ef4444","#f97316","#f59e0b","#eab308","#84cc16",
      "#22c55e","#10b981","#14b8a6","#06b6d4","#3b82f6",
      "#6366f1","#8b5cf6","#a855f7","#ec4899","#f43f5e",
      "#ffffff","#94a3b8","#64748b","#334155","#0f172a"
    ];

    // ── unified DB helpers ───────────────────────────────────────────────────
    // One parse-and-validate boundary for every page — storage-guard.js. Never a
    // bare JSON.parse: it does not throw on 'null', '42' or '[…]', so a
    // hand-rolled try/catch around it is not a check.

    function _getTrackDB() { return TrackStorage.loadDB(); }
    function _activeSlot() {
      const db=_getTrackDB(), slots=db.slots||[], id=db.activeSlotId;
      return slots.find(s=>s.id===id) || slots[0] || null;
    }
    function _readP(key, fallback) {
      const s=_activeSlot(); return (s && s[key]!==undefined) ? s[key] : fallback;
    }
    // Merge ONLY the keys this page owns into a fresh read of the stored slot —
    // the same contract as _writeP in progress.html, _writeSlotKeys in
    // sir-ks02.html and _writeSlotKey in documentations.html. A slot id that is
    // no longer present was deleted elsewhere: write nothing rather than fold
    // this workspace's data into another slot.
    function _writeSlotKeys(slotId, patch) {
      const db=_getTrackDB(), slots=db.slots||[];
      if (!slots.some(s=>s.id===slotId)) return false;
      db.slots=slots.map(s=>s.id===slotId?{...s,...patch}:s);
      return TrackStorage.saveDB(db);
    }
    // `sourceDumps` belongs to sir-ks02.html, which saves it from its React
    // state. The SOURCE DUMP tab edits it too, and only in the one shape
    // AGENTS.md allows for a key a page does not own: a FRESH read-modify-write
    // of that key alone — never the autosave below, and never from this page's
    // React copy. KS02 writes `trueStorages` the same way (_mutateSlotKey), and
    // documentations.html writes calendarNotes and deadlines the same way.
    //
    // `fn` is handed the RAW stored list, not the filtered copy this page
    // renders, so an edit can never drop a record the page does not draw (a
    // dump naming itself as its parent). It returns the next list, or the same
    // one to mean "no change" — then nothing is written and no sync upload is
    // armed.
    //
    // Returns the stored list, or null when nothing was written: a slot
    // deleted in another tab, a no-op, or a save that the quota guard or an
    // unreadable database refused. A refusal is never shown as if it landed.
    function _mutateSourceDumps(slotId, fn) {
      const db=_getTrackDB(), slots=db.slots||[];
      const cur=slots.find(s=>s.id===slotId);
      if (!cur) return null;
      const before=Array.isArray(cur.sourceDumps)?cur.sourceDumps:[];
      const next=fn(before);
      if (next===before||!Array.isArray(next)) return null;
      db.slots=slots.map(s=>s.id===slotId?{...s,sourceDumps:next}:s);
      return TrackStorage.saveDB(db)?next:null;
    }

    // ── local calendar dates (never toISOString — that is a UTC day) ─────────

    function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    const localToday = () => toDateStr(new Date());

    // One id shape across the project — TrackStorage.newId in storage-guard.js.
    // String ids can never collide with the numeric nid() counter that mints
    // sir-ks02.html's mms and sourceDumps, which matters because a tag holds one
    // id of each kind.
    const genId = () => window.TrackStorage && window.TrackStorage.newId
      ? window.TrackStorage.newId()
      : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

    // ── slot bootstrap ───────────────────────────────────────────────────────
    // Only auto-create on a genuinely empty install. If unmigrated legacy
    // Progress/KS02 data exists, creating db.slots here would make their
    // migration IIFEs (guarded by `if (db.slots) return`) skip it and orphan it.

    function _hasLegacyData() {
      const db=_getTrackDB();
      if (db.ks02 || db.progress) return true;
      return ['ks02_slots','progress_goals','progress_sa_actions','progress_sa_entries']
        .some(k => { try { return !!localStorage.getItem(k); } catch { return false; } });
    }
    function _bootstrapSlotIfSafe() {
      // An unreadable track_db reads as {} here, indistinguishable from a fresh
      // install. TrackStorage.saveDB refuses the write regardless; returning
      // false is what stops this page then claiming a workspace never stored.
      if (TrackStorage.dbBlocked()) return false;
      const db=_getTrackDB();
      if ((db.slots||[]).length) return true;
      if (_hasLegacyData()) return false;
      const s=TrackSchema.createEmptySlot({name:'Default'});
      return TrackStorage.saveDB({slots:[s],activeSlotId:s.id});
    }

    // ── source-dump reading ───────────────────────────────────────────────────
    // sir-ks02.html owns `sourceDumps`. The tag rows below only read it; the
    // SOURCE DUMP tab edits it, through _mutateSourceDumps alone.

    const dumpIsLeaf = (dumps, d) => !dumps.some(o => o.parentId === d.id);
    const dumpById   = (dumps, id) => dumps.find(d => d.id === id) || null;
    const mmById     = (mms, id) => mms.find(m => m.id === id) || null;
    const linkFor    = (dump, mmId) => (dump && Array.isArray(dump.mmLinks))
      ? (dump.mmLinks.find(l => l.mmId === mmId) || null) : null;

    // The list this page RENDERS: KS02's filter, once. A dump naming itself as
    // its parent is hidden on both pages; a write never filters (see
    // _mutateSourceDumps), so hiding it here cannot delete it.
    const visibleDumps = list => (Array.isArray(list) ? list : []).filter(d => d && d.parentId !== d.id);

    // An mmLink written before textBlocks existed carries its prose in `text`.
    // One definition, in source-dump-core.js; the name is KS02's, so the SOURCE
    // DUMP copy below reads exactly like the page it copies.
    function getSCTextBlocks(link) { return SD.textBlocksOf(link); }

    // The link back into KS02. sir-ks02.html honours ?dump= and &mm= and opens
    // KS03 → SOURCE DUMP on that leaf.
    const dumpHref = (dumpId, mmId) =>
      `sir-ks02.html?dump=${encodeURIComponent(dumpId)}&mm=${encodeURIComponent(mmId)}#ks03`;

    // An MM's name on the SOURCE DUMP tab leads INTO KS02: ?mm=<id> with no
    // ?dump= opens that MM's detail on its S&C tab — what clicking the same
    // name on KS02's own SOURCE DUMP page does.
    const ks02MMHref = mmId => `sir-ks02.html?mm=${encodeURIComponent(mmId)}#ks03`;

    // This page's own address for a place on the SOURCE DUMP tab: honoured on
    // mount, and written into the history entry just before an MM link is
    // followed, so the Back button returns here — on that dump, with that card
    // ringed — rather than to the canvas.
    const sourceDumpHref = (dumpId, mmId) =>
      'true-storage.html' +
      (dumpId != null ? `?dump=${encodeURIComponent(dumpId)}` +
        (mmId != null ? `&mm=${encodeURIComponent(mmId)}` : '') : '') +
      '#sourcedump';

    // ── shared UI ────────────────────────────────────────────────────────────

    function ConfirmDialog({open,title,message,confirmLabel="CONFIRM",cancelLabel="CANCEL",onConfirm,onCancel}) {
      React.useEffect(()=>{
        if(!open)return;
        const onKey=e=>{if(e.key==="Escape")onCancel&&onCancel();};
        document.addEventListener("keydown",onKey);
        return()=>document.removeEventListener("keydown",onKey);
      },[open,onCancel]);
      if(!open)return null;
      return (
        <div className="fixed inset-0 z-[100] bg-black/70 flex items-center justify-center p-4" onClick={onCancel}>
          <div className="w-full max-w-sm bg-gray-950 border border-red-800 rounded shadow-2xl p-4" onClick={e=>e.stopPropagation()}>
            <div className="text-sm font-bold text-white mb-1">{title}</div>
            {message&&<div className="text-xs text-gray-400 mb-4">{message}</div>}
            <div className="flex gap-2">
              <button onClick={onConfirm} className="flex-1 bg-red-700 hover:bg-red-600 text-white py-2 rounded text-xs font-bold">{confirmLabel}</button>
              <button onClick={onCancel} className="flex-1 bg-gray-800 hover:bg-gray-700 text-gray-300 py-2 rounded text-xs">{cancelLabel}</button>
            </div>
          </div>
        </div>
      );
    }

    // The radial canvas layout lives once, in graph-layout.js — the same module
    // KS03's multiverse uses. Storages and MMs carry the same two fields it reads
    // (`id`, `parentIds`), so the geometry, and the cycle guard, are shared.
    function computeLayerLayout(nodes, layerRadii) {
      return TrackGraphLayout.computeLayerLayout(nodes, layerRadii);
    }

    function applyRepulsion(pos, minDist, iterations) {
      return TrackGraphLayout.applyRepulsion(pos, minDist, iterations);
    }

    // ── MULTIVERSE ───────────────────────────────────────────────────────────
    // Ported from MultiverseCanvas in sir-ks02.html. Everything type-driven is
    // gone — storages have no Anchor/T1/T2, so every node is one radius and one
    // ring. Drag, pan, wheel zoom, pinch zoom, fill colour, duplicate and
    // rearrange all behave exactly as KS03's canvas does.
    //
    // Node ids are read back off `data-sid` in the touch path, and dataset
    // values are strings — which is safe here only because a storage id IS a
    // string (TrackStorage.newId). Never do this with an mm id.

    function StorageCanvas({storages,manualPos,setManualPos,onOpen,colorOf,onFill,onDuplicate,focusId}) {
      const svgRef=useRef(null);
      const dragNode=useRef(null);
      const dragOffset=useRef({x:0,y:0});
      const didDrag=useRef(false);
      const vtRef=useRef({x:0,y:0,scale:1});
      const panRef=useRef({active:false,startX:0,startY:0,startVtX:0,startVtY:0});
      const pinchRef=useRef({active:false,startDist:0,startScale:1,startVtX:0,startVtY:0,cx:0,cy:0});
      const nodePosRef=useRef({});
      const onOpenRef=useRef(onOpen);
      onOpenRef.current=onOpen;
      const [vt,setVt_]=useState({x:0,y:0,scale:1});
      const [fillState,setFillState]=useState("off"); // "off" | "picking" | "on"
      const [fillColor,setFillColor]=useState(null);
      const fillStateRef=useRef("off");
      const clickTimerRef=useRef(null);
      const clickCountRef=useRef(0);
      const [ctxMenu,setCtxMenu]=useState(null);
      function setVt(next){const val=typeof next==="function"?next(vtRef.current):next;vtRef.current=val;setVt_(val);}
      useEffect(()=>{fillStateRef.current=fillState;},[fillState]);
      useEffect(()=>{if(!ctxMenu)return;function dismiss(){setCtxMenu(null);}document.addEventListener("click",dismiss);return()=>document.removeEventListener("click",dismiss);},[!!ctxMenu]);
      useEffect(()=>{
        if(svgRef.current)svgRef.current.style.cursor=fillState==="on"?"crosshair":"grab";
      },[fillState]);
      const autoPos=useMemo(()=>computeLayerLayout(storages),[storages]);
      const nodePos=useMemo(()=>({...autoPos,...manualPos}),[autoPos,manualPos]);
      nodePosRef.current=nodePos;
      useEffect(()=>{
        if(!focusId)return;
        const pos=({...autoPos,...manualPos})[focusId];if(!pos)return;
        const svg=svgRef.current;if(!svg)return;
        requestAnimationFrame(()=>{
          const rect=svg.getBoundingClientRect();if(!rect.width)return;
          setVt({x:rect.width/2-pos.x,y:rect.height/2-pos.y,scale:1});
        });
      },[focusId]);
      const edges=useMemo(()=>{
        const seen=new Set(),res=[];
        storages.forEach(s=>TS.parentIdsOf(s).forEach(pid=>{const k=[pid,s.id].join("→");if(!seen.has(k)){seen.add(k);res.push([pid,s.id]);}}));
        return res;
      },[storages]);
      useEffect(()=>{
        const svg=svgRef.current;if (!svg) return;
        function onWheel(e){
          e.preventDefault();
          const rect=svg.getBoundingClientRect();
          const mx=e.clientX-rect.left,my=e.clientY-rect.top;
          const v=vtRef.current,factor=e.deltaY<0?1.12:0.89;
          const ns=Math.min(Math.max(v.scale*factor,0.12),4);
          setVt({scale:ns,x:mx-(mx-v.x)*(ns/v.scale),y:my-(my-v.y)*(ns/v.scale)});
        }
        svg.addEventListener("wheel",onWheel,{passive:false});
        return()=>svg.removeEventListener("wheel",onWheel);
      },[]);
      useEffect(()=>{
        function onMove(e){
          const rect=svgRef.current?.getBoundingClientRect();if (!rect) return;
          if (dragNode.current){
            didDrag.current=true;
            const v=vtRef.current,cx=(e.clientX-rect.left-v.x)/v.scale,cy=(e.clientY-rect.top-v.y)/v.scale;
            setManualPos(p=>({...p,[dragNode.current]:{x:cx-dragOffset.current.x,y:cy-dragOffset.current.y}}));
          } else if (panRef.current.active){
            setVt({...vtRef.current,x:panRef.current.startVtX+(e.clientX-panRef.current.startX),y:panRef.current.startVtY+(e.clientY-panRef.current.startY)});
          }
        }
        function onUp(){
          dragNode.current=null;
          if (panRef.current.active){panRef.current.active=false;if(svgRef.current)svgRef.current.style.cursor=fillStateRef.current==="on"?"crosshair":"grab";}
        }
        function onTouchStart(e){
          const svg=svgRef.current;if(!svg||!svg.contains(e.target))return;
          if(e.touches.length===2){
            const t=e.touches,rect=svg.getBoundingClientRect();
            dragNode.current=null;panRef.current.active=false;
            const cx=(t[0].clientX+t[1].clientX)/2-rect.left,cy=(t[0].clientY+t[1].clientY)/2-rect.top;
            const dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;
            const v=vtRef.current;
            pinchRef.current={active:true,startDist:Math.sqrt(dx*dx+dy*dy),startScale:v.scale,startVtX:v.x,startVtY:v.y,cx,cy};
            e.preventDefault();return;
          }
          if(e.touches.length===1){
            const t=e.touches[0],rect=svg.getBoundingClientRect();
            const nodeG=t.target&&t.target.closest?t.target.closest('[data-sid]'):null;
            if(nodeG){
              const id=nodeG.dataset.sid,cur=nodePosRef.current[id]||{x:200,y:200},v=vtRef.current;
              dragOffset.current={x:(t.clientX-rect.left-v.x)/v.scale-cur.x,y:(t.clientY-rect.top-v.y)/v.scale-cur.y};
              dragNode.current=id;didDrag.current=false;
            }else{
              panRef.current={active:true,startX:t.clientX,startY:t.clientY,startVtX:vtRef.current.x,startVtY:vtRef.current.y};
            }
            e.preventDefault();
          }
        }
        function onTouchMove(e){
          if(!dragNode.current&&!panRef.current.active&&!pinchRef.current.active)return;
          const rect=svgRef.current?.getBoundingClientRect();if(!rect)return;
          if(e.touches.length===2&&pinchRef.current.active){
            const t=e.touches,dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;
            const dist=Math.sqrt(dx*dx+dy*dy),{startDist,startScale,startVtX,startVtY,cx,cy}=pinchRef.current;
            const ns=Math.min(Math.max(startScale*(dist/startDist),0.12),4),ratio=ns/startScale;
            setVt({scale:ns,x:cx-(cx-startVtX)*ratio,y:cy-(cy-startVtY)*ratio});
            e.preventDefault();return;
          }
          if(e.touches.length>=1){
            const t=e.touches[0];
            if(dragNode.current){
              didDrag.current=true;
              const v=vtRef.current,cx=(t.clientX-rect.left-v.x)/v.scale,cy=(t.clientY-rect.top-v.y)/v.scale;
              setManualPos(p=>({...p,[dragNode.current]:{x:cx-dragOffset.current.x,y:cy-dragOffset.current.y}}));
            }else if(panRef.current.active){
              setVt({...vtRef.current,x:panRef.current.startVtX+(t.clientX-panRef.current.startX),y:panRef.current.startVtY+(t.clientY-panRef.current.startY)});
            }
            e.preventDefault();
          }
        }
        function onTouchEnd(){
          if(!didDrag.current&&dragNode.current){onOpenRef.current(dragNode.current);}
          pinchRef.current.active=false;
          dragNode.current=null;
          if(panRef.current.active){panRef.current.active=false;if(svgRef.current)svgRef.current.style.cursor=fillStateRef.current==="on"?"crosshair":"grab";}
          didDrag.current=false;
        }
        window.addEventListener("mousemove",onMove);window.addEventListener("mouseup",onUp);
        window.addEventListener("touchstart",onTouchStart,{passive:false});
        window.addEventListener("touchmove",onTouchMove,{passive:false});
        window.addEventListener("touchend",onTouchEnd);
        return()=>{
          window.removeEventListener("mousemove",onMove);window.removeEventListener("mouseup",onUp);
          window.removeEventListener("touchstart",onTouchStart);
          window.removeEventListener("touchmove",onTouchMove);
          window.removeEventListener("touchend",onTouchEnd);
        };
      },[setManualPos]);
      function onMouseDown(e,id){
        e.preventDefault();e.stopPropagation();
        const rect=svgRef.current.getBoundingClientRect(),cur=nodePos[id]||{x:200,y:200},v=vtRef.current;
        dragOffset.current={x:(e.clientX-rect.left-v.x)/v.scale-cur.x,y:(e.clientY-rect.top-v.y)/v.scale-cur.y};
        dragNode.current=id;didDrag.current=false;
      }
      function onMouseUp(e,id){
        e.stopPropagation();
        if (!didDrag.current){
          if (fillState==="on"&&fillColor){onFill(id,fillColor);}
          else if (fillState!=="on"){onOpen(id);}
        }
        didDrag.current=false;dragNode.current=null;
      }
      function onSvgMouseDown(e){
        setCtxMenu(null);
        if (fillState==="picking"){setFillState("off");return;}
        if (dragNode.current) return;
        panRef.current={active:true,startX:e.clientX,startY:e.clientY,startVtX:vtRef.current.x,startVtY:vtRef.current.y};
        if(svgRef.current)svgRef.current.style.cursor="grabbing";
      }
      function handleRearrange(){
        setManualPos(applyRepulsion(computeLayerLayout(storages,[0,240,460,680,900])));
      }
      function onFillIconClick(){
        clickCountRef.current++;
        if (clickCountRef.current===1){
          clickTimerRef.current=setTimeout(()=>{
            clickCountRef.current=0;
            setFillState(s=>s==="off"?"picking":"off");
          },280);
        } else {
          clearTimeout(clickTimerRef.current);
          clickCountRef.current=0;
          setFillState(s=>{
            if(s==="off"){return "on";}
            setFillColor(null);return "off";
          });
        }
      }
      const fillActive=fillState!=="off";
      const R=20;
      return (
        <div className="flex-1 relative overflow-hidden">
          {storages.length===0&&<div className="text-gray-600 text-center py-20 text-xs">No storages yet.</div>}
          <svg ref={svgRef} className="absolute inset-0 w-full h-full cursor-grab" style={{touchAction:"none"}} onMouseDown={onSvgMouseDown}>
            <defs><filter id="ts-arr-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="ts-arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="white" filter="url(#ts-arr-glow)"/></marker></defs>
            <g transform={`translate(${vt.x},${vt.y}) scale(${vt.scale})`}>
              {edges.map(([pid,cid])=>{
                const a=nodePos[pid],b=nodePos[cid];if (!a||!b) return null;
                const dx=b.x-a.x,dy=b.y-a.y,len=Math.sqrt(dx*dx+dy*dy)||1;
                return <line key={`${pid}-${cid}`} x1={a.x} y1={a.y} x2={b.x-dx/len*R} y2={b.y-dy/len*R} stroke="#374151" strokeWidth="1.5" markerEnd="url(#ts-arr)"/>;
              })}
              {storages.map(s=>{
                const p=nodePos[s.id]||{x:200,y:200},col=s.customColor||colorOf(s.id);
                const tagged=TS.tagsOf(s).length>0;
                return (
                  <g key={s.id} data-sid={s.id} transform={`translate(${p.x},${p.y})`} onMouseDown={e=>onMouseDown(e,s.id)} onMouseUp={e=>onMouseUp(e,s.id)} onContextMenu={e=>{e.preventDefault();e.stopPropagation();const rect=svgRef.current.getBoundingClientRect();setCtxMenu({id:s.id,x:e.clientX-rect.left,y:e.clientY-rect.top});}} style={{cursor:fillState==="on"?"crosshair":"pointer"}}>
                    {tagged&&<circle r={R+5} fill="none" stroke={col} strokeWidth="1" strokeOpacity="0.3"/>}
                    <circle r={R} fill="#0f172a" stroke={col} strokeWidth={s.customColor?3:2}/>

            <button onClick={()=>setVt(v=>({...v,scale:Math.max(v.scale*0.8,0.12)}))} className="w-6 h-6 rounded bg-gray-800 border border-gray-700 text-gray-400 hover:text-white flex items-center justify-center">−</button>

    // ── SRCH-format tree ─────────────────────────────────────────────────────
    // Ported from SrchMMNode / SrchView in sir-ks02.html: the same indent guide,
    // collapse toggle, ⇅ drag-to-arrange-among-siblings and focus scroll.

    function StorageNode({node, depth, colorOf, onOpen, onArrange, focusId, onClearFocus}) {
      const {storage, children} = node;
      const [open, setOpen] = React.useState(true);
      const [hov, setHov] = React.useState(false);
      const [arrangeDragOver, setArrangeDragOver] = React.useState(null);
      const nodeRef = React.useRef(null);
      const isFocused = storage.id === focusId;
      React.useEffect(()=>{
        if(isFocused&&nodeRef.current){
          nodeRef.current.scrollIntoView({behavior:'smooth',block:'center'});
          const t=setTimeout(()=>{if(onClearFocus)onClearFocus();},1500);
          return()=>clearTimeout(t);
        }
      },[isFocused]);
      const tagCount = TS.tagsOf(storage).length;
      return (
        <div className="relative">
          <div ref={isFocused?nodeRef:null} style={{paddingLeft: depth * 16}}
            className={`flex items-center gap-2 py-1.5 px-2 rounded hover:bg-gray-800 cursor-pointer${isFocused?" bg-indigo-900/40 outline outline-1 outline-indigo-700/50":""} ${arrangeDragOver==='before'?'border-t-2 border-green-500':arrangeDragOver==='after'?'border-b-2 border-green-500':''}`}
            data-storage-row={storage.id}
            onClick={() => onOpen(storage.id)}
            onMouseEnter={() => setHov(true)}
            onMouseLeave={() => setHov(false)}
            onDragOver={e => {
              if (e.dataTransfer.types.includes('application/truestorage-arrange-id')) {
                e.preventDefault(); e.stopPropagation();
                const rect = e.currentTarget.getBoundingClientRect();
                setArrangeDragOver(e.clientY < rect.top + rect.height / 2 ? 'before' : 'after');
              }
            }}
            onDragLeave={e => { if (!e.currentTarget.contains(e.relatedTarget)) setArrangeDragOver(null); }}
            onDrop={e => {
              const draggedId = e.dataTransfer.getData('application/truestorage-arrange-id');
              if (draggedId && draggedId !== storage.id) {
                e.preventDefault(); e.stopPropagation();
                const rect = e.currentTarget.getBoundingClientRect();
                onArrange(draggedId, storage.id, e.clientY < rect.top + rect.height / 2);
              }
              setArrangeDragOver(null);
            }}>
            <div className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor: colorOf(storage.id)}}/>
            <span className="text-sm">{storage.name}</span>
            {tagCount>0&&<span className="text-xs text-gray-600" title={`${tagCount} source dump tag${tagCount!==1?"s":""}`}>⛁{tagCount}</span>}
            {storage.link&&storage.link.url&&<span className="text-xs text-gray-600" title={storage.link.url}>🔗</span>}
            {children.length > 0 && (
              <span
                className="text-xs text-gray-500 ml-1 cursor-pointer hover:text-white"
                onClick={e => { e.stopPropagation(); setOpen(o => !o); }}>
                {open ? "▼" : "▶"} {children.length}
              </span>
            )}
            {hov && (
              <span
                draggable
                onDragStart={e => {
                  e.dataTransfer.setData('application/truestorage-arrange-id', String(storage.id));
                  e.dataTransfer.effectAllowed = 'move';
                  e.stopPropagation();
                }}
                onClick={e => e.stopPropagation()}
                title="Drag to arrange among siblings"
                className="text-gray-600 hover:text-green-400 text-xs px-1 py-0.5 rounded hover:bg-gray-700/60 cursor-grab select-none ml-auto">⇅</span>
            )}
          </div>
          {open && children.length > 0 && (
            <>
              <div style={{
                position: "absolute",
                left: depth * 16 + 12,
                top: 13,
                bottom: 4,
                width: 1,
                backgroundColor: "#374151",
                pointerEvents: "none"
              }}/>
              {children.map((child, i) => (
                <StorageNode key={`${child.storage.id}-${depth}-${i}`} node={child} depth={depth+1} colorOf={colorOf} onOpen={onOpen} onArrange={onArrange} focusId={focusId} onClearFocus={onClearFocus}/>
              ))}
            </>
          )}
        </div>
      );
    }

    function StorageTreeView({storages, colorOf, onOpen, onArrange, focusId, onClearFocus}) {
      const [q, setQ] = useState("");
      React.useEffect(()=>{ if(focusId) setQ(""); },[focusId]);

      function filterTree(nodes, lq) {
        return nodes.reduce((acc, n) => {
          const fc = filterTree(n.children, lq);
          if (!lq || (n.storage.name||"").toLowerCase().includes(lq) || fc.length > 0)
            acc.push({...n, children: fc});
          return acc;
        }, []);
      }

      const tree = filterTree(TS.buildTree(storages), q.toLowerCase());

      return (
        <div className="p-4 max-w-2xl mx-auto">
          <div className="text-xs text-gray-500 mb-3 tracking-widest">TRUE STORAGE — NESTED BY PARENT / CHILD</div>
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Filter storages..."
            className="w-full bg-gray-900 border border-gray-700 rounded px-3 py-2 mb-3 text-white placeholder-gray-600 text-xs focus:outline-none focus:border-indigo-500"/>
          {!storages.length ? (
            <div className="text-gray-600 text-xs text-center py-8">No storages yet.</div>
          ) : tree.length === 0 ? (
            <div className="text-gray-600 text-xs text-center py-4">No matches.</div>
          ) : (
            <div className="rounded border border-gray-800 bg-gray-900/30 px-2 py-1">
              {tree.map((n, i) => (
                <StorageNode key={`${n.storage.id}-${i}`} node={n} depth={0} colorOf={colorOf} onOpen={onOpen} onArrange={onArrange} focusId={focusId} onClearFocus={onClearFocus}/>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ── SOURCE DUMP — a documented TWIN of KS02's page ───────────────────────
    // TransferPicker, StorageTags and SourceDumpView below are COPIES of the
    // components of the same names in sir-ks02.html (KS03 → SOURCE DUMP), so
    // this tab looks and behaves exactly like that page. They are copies, not
    // one shared file, because each page is its own inline-Babel app with no
    // module system — and the app is supported opened straight from disk,
    // where a separately loaded JSX file cannot be fetched.
    //
    // What keeps the copy honest:
    //   - every EDIT goes through source-dump-core.js, the one definition both
    //     pages call, so the same click stores the same thing on either page;
    //   - tests/browser.test.js compares the controls both pages draw for the
    //     same data (the SOURCE DUMP parity case) and fails the moment they
    //     differ. A change to one copy is a change to both, made on purpose.
    //
    // The ONLY intended differences, each because this page is not KS02:
    //   1. The MM name is a LINK into KS02 — ks02MMHref, that MM's S&C tab —
    //      where KS02 opens the MM in place. onLeaveForMM first rewrites this
    //      page's history entry, so Back returns to the same dump.
    //   2. A storage chip opens that storage HERE (onOpenStorage) instead of
    //      reloading this page with ?storage=.
    //   3. Tag and untag act on this page's OWN trueStorages, through its state
    //      and autosave; KS02 has to reach that foreign key through
    //      _mutateSlotKey. The untag prompt is KS02's text, word for word.

    function TransferPicker({mms,mmColor,currentMmId,search,setSearch,onSelect,onCancel}){
      const options=mms.filter(m=>TrackSourceDump.canLinkMM(m,mms)&&m.id!==currentMmId&&m.name.toLowerCase().includes(search.toLowerCase()));
      return (
        <div className="mt-1 bg-gray-800 border border-indigo-800 rounded p-2 mb-2">
          <div className="text-xs text-gray-500 mb-1">Transfer to MM:</div>
          <input autoFocus value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search MMs..."
            className="w-full bg-gray-900 border border-gray-700 rounded px-2 py-1 text-xs outline-none mb-1"/>
          <div className="max-h-32 overflow-y-auto">
            {options.length===0&&<div className="text-gray-600 text-xs text-center py-2">No MMs found.</div>}
            {options.map(m=>(
              <div key={m.id} onClick={()=>onSelect(m.id)}
                className="flex items-center gap-2 px-2 py-1 rounded mb-0.5 cursor-pointer hover:bg-gray-700">
                <div className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor:m.type==="anchor"?"#6b7280":m.type==="1"?"#ef4444":mmColor(m.id)}}/>
                <span className="text-xs text-gray-200">{m.name}</span>
                <span className="text-xs text-gray-600 ml-auto">{m.type==="anchor"?"Anchor":`T${m.type}`}</span>
              </div>
            ))}
          </div>
          <button onClick={onCancel} className="text-xs text-gray-500 hover:text-gray-300 mt-1">cancel</button>
        </div>
      );
    }

    function StorageTags({dump, link, trueStorages, onTag, onUntag, onOpenStorage}) {
      const [picking,setPicking]=useState(false);
      const [q,setQ]=useState("");
      const list=trueStorages||[];
      const tagged=TrackTrueStorage.storagesForLink(list,dump.id,link.mmId);
      const options=list.filter(s=>
        !TrackTrueStorage.hasTag(list,s.id,dump.id,link.mmId)&&
        (s.name||"").toLowerCase().includes(q.toLowerCase()));
      return (
        <div className="mt-2" data-storage-tags={`${dump.id}:${link.mmId}`}>
          <div className="flex items-center gap-1 flex-wrap">
            <span className="text-[10px] tracking-widest text-gray-600 mr-1">STORAGE</span>
            {tagged.map(s=>(
              <span key={s.id} className="inline-flex items-center gap-1 bg-gray-800 border border-gray-700 rounded pl-2 pr-1 py-0.5">
                {/* TWIN DIFFERENCE 2: opens the storage here, in place. */}
                <a href={`true-storage.html?storage=${encodeURIComponent(s.id)}`}
                  data-storage-chip={s.id}
                  onClick={e=>{if(onOpenStorage){e.preventDefault();onOpenStorage(s.id);}}}
                  className="text-xs text-amber-300 hover:text-amber-100 max-w-[12rem] truncate">⛁ {s.name}</a>
                <button onClick={()=>onUntag&&onUntag(s.id,dump.id,link.mmId)}
                  data-storage-untag={s.id}
                  title="Remove this storage tag" className="text-gray-600 hover:text-red-400 text-xs px-0.5">×</button>
              </span>
            ))}
            {!tagged.length&&<span className="text-[10px] text-gray-700 italic">none</span>}
            <button onClick={()=>{setPicking(p=>!p);setQ("");}}
              data-storage-add={`${dump.id}:${link.mmId}`}
              className="text-xs text-gray-600 hover:text-gray-300 ml-1">+ storage</button>
          </div>
          {picking&&(
            <div className="mt-1 bg-gray-900 border border-amber-900 rounded p-2">
              {!list.length?(
                <div className="text-xs text-gray-600 text-center py-2">
                  No storages yet. Create them in <a href="true-storage.html" className="text-amber-300 underline">True Storage</a>.
                </div>
              ):(
                <>
                  <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="search storages..."
                    className="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs outline-none mb-1"/>
                  <div className="max-h-40 overflow-y-auto">
                    {!options.length&&<div className="text-xs text-gray-600 text-center py-2">Nothing left to tag.</div>}
                    {options.map(s=>(
                      <div key={s.id} data-storage-option={s.id}
                        onClick={()=>{onTag&&onTag(s.id,dump.id,link.mmId);setPicking(false);setQ("");}}
                        className="px-2 py-1 text-xs text-gray-200 rounded cursor-pointer hover:bg-gray-800 truncate">⛁ {s.name}</div>
                    ))}
                  </div>
                </>
              )}
              <button onClick={()=>setPicking(false)} className="text-xs text-gray-500 hover:text-gray-300 mt-1">cancel</button>
            </div>
          )}
        </div>
      );
    }

    function SourceDumpView({sourceDumps,mms,mmColor,dumpPath,setDumpPath,onAddEntry,onDeleteEntry,onRename,onAddMMLink,onRemoveMMLink,onAddURLLink,onRemoveURLLink,onAddTextBlock,onRemoveTextBlock,onTransferTextBlock,onTransferURLLink,onLeaveForMM,trueStorages,onTagStorage,onUntagStorage,onOpenStorage,focusMmId}) {
      const [showCreate,setShowCreate]=useState(false);
      const [createTitle,setCreateTitle]=useState("");
      const [mmPickerFor,setMmPickerFor]=useState(null);
      const [mmSearch,setMmSearch]=useState("");
      const [showLinkFormFor,setShowLinkFormFor]=useState(null);
      const [newLinkForm,setNewLinkForm]=useState({label:"",url:""});
      const [showTextBlockForm,setShowTextBlockForm]=useState(null);
      const [textBlockDraft,setTextBlockDraft]=useState({title:"",explanation:""});
      const [editingTitleId,setEditingTitleId]=useState(null);
      const [editingTitleVal,setEditingTitleVal]=useState("");
      const [hoveredBadgeId,setHoveredBadgeId]=useState(null);
      const [transferPickerFor,setTransferPickerFor]=useState(null);
      const [transferMmSearch,setTransferMmSearch]=useState("");
      const [confirmDelete,setConfirmDelete]=useState(null);

      const currentParentId=dumpPath.length>0?dumpPath[dumpPath.length-1]:null;
      const currentEntry=currentParentId!=null?sourceDumps.find(d=>d.id===currentParentId):null;
      const currentChildren=sourceDumps.filter(d=>d.parentId===currentParentId);

      function handleCreate(){
        if(!createTitle.trim())return;
        onAddEntry(createTitle,currentParentId);
        setCreateTitle("");setShowCreate(false);
      }
      const requestConfirmDelete=(title,message,onConfirm)=>setConfirmDelete({title,message,onConfirm});

      const filteredMMs=mms.filter(m=>TrackSourceDump.canLinkMM(m,mms)&&m.name.toLowerCase().includes(mmSearch.toLowerCase()));
      const alreadyLinked=mmPickerFor!=null?(sourceDumps.find(d=>d.id===mmPickerFor)?.mmLinks||[]).map(l=>l.mmId):[];

      return (
        <div className="overflow-y-auto flex-1 p-4 max-w-2xl mx-auto w-full" data-source-dump-view>
          <ConfirmDialog
            open={!!confirmDelete}
            title={confirmDelete?.title}
            message={confirmDelete?.message}
            onConfirm={()=>{confirmDelete?.onConfirm&&confirmDelete.onConfirm();setConfirmDelete(null);}}
            onCancel={()=>setConfirmDelete(null)}
          />
          {/* Breadcrumb */}
          <div className="flex items-center gap-1 mb-4 flex-wrap">
            <button data-dump-crumb="home" onClick={()=>setDumpPath([])} className={`text-xs px-2 py-1 rounded ${dumpPath.length===0?"text-white font-bold":"text-gray-400 hover:text-white"}`}>Home</button>
            {dumpPath.map((id,i)=>{

              return (
                <React.Fragment key={id}>
                  <span className="text-gray-600 text-xs">›</span>
                  <button data-dump-crumb={id} onClick={()=>setDumpPath(dumpPath.slice(0,i+1))}
                    className={`text-xs px-2 py-1 rounded truncate max-w-[160px] ${i===dumpPath.length-1?"text-white font-bold":"text-gray-400 hover:text-white"}`}>
                    {e?.title||"?"}
                  </button>
                </React.Fragment>
              );
            })}
            <button onClick={()=>{setShowCreate(true);setCreateTitle("");}} className="ml-auto text-xs bg-indigo-800 hover:bg-indigo-700 text-white px-2 py-1 rounded font-bold">+ title</button>
          </div>

          {/* Create title form */}
          {showCreate&&(
            <div className="flex gap-2 mb-4">
              <input autoFocus value={createTitle} onChange={e=>setCreateTitle(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter")handleCreate();if(e.key==="Escape")setShowCreate(false);}}
                placeholder="New title..." className="flex-1 bg-gray-900 border border-indigo-700 rounded px-3 py-1.5 text-xs text-white outline-none"/>
              <button onClick={handleCreate} className="bg-indigo-700 hover:bg-indigo-600 text-white px-3 py-1.5 rounded text-xs font-bold">add</button>
              <button onClick={()=>setShowCreate(false)} className="bg-gray-800 text-gray-400 px-3 py-1.5 rounded text-xs">cancel</button>
            </div>
          )}

          {/* Current entry's MM links (source&cite sections) */}
          {currentEntry&&currentChildren.length===0&&(
            <div className="mb-5">
              <div className="text-xs text-gray-500 tracking-widest mb-2">SOURCE & CITE</div>
              {(currentEntry.mmLinks||[]).length===0&&<div className="text-gray-600 text-xs italic mb-2">No MMs linked yet.</div>}
              {(currentEntry.mmLinks||[]).map(link=>{
                const mm=mms.find(m=>m.id===link.mmId);
                const isPickingLink=showLinkFormFor&&showLinkFormFor.dumpId===currentEntry.id&&showLinkFormFor.linkId===link.id;
                const isAddingText=showTextBlockForm&&showTextBlockForm.dumpId===currentEntry.id&&showTextBlockForm.linkId===link.id;
                const tbs=getSCTextBlocks(link);
                return (
                  <div key={link.id} data-dump-mm={link.mmId}
                    className={`bg-gray-900 border rounded mb-3 p-3 ${focusMmId===link.mmId?"border-amber-600 ring-1 ring-amber-700/50":"border-gray-800"}`}>
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-2">
                        <div className="w-2 h-2 rounded-full shrink-0" style={{backgroundColor:mm?(mm.type==="anchor"?"#6b7280":mm.type==="1"?"#ef4444":mmColor(mm.id)):"#6b7280"}}/>
                        {/* TWIN DIFFERENCE 1: a link into KS02, not an in-page open. */}
                        <a data-dump-mm-name={link.mmId} href={mm?ks02MMHref(mm.id):undefined}
                          onClick={()=>mm&&onLeaveForMM&&onLeaveForMM(currentEntry.id,mm.id)}

                        onSelect={toMmId=>{onTransferTextBlock(currentEntry.id,link.id,transferPickerFor.itemId,toMmId);setTransferPickerFor(null);setTransferMmSearch("");}}
                        onCancel={()=>{setTransferPickerFor(null);setTransferMmSearch("");}}/>
                    )}

                          <button onClick={()=>{setTransferPickerFor({dumpId:currentEntry.id,linkId:link.id,itemType:"url",itemId:u.id,currentMmId:link.mmId});setTransferMmSearch("");}} className="text-indigo-600 hover:text-indigo-400 text-xs px-1">-&gt;</button>
                          <button onClick={()=>requestConfirmDelete(

                        <input value={newLinkForm.url} onChange={e=>setNewLinkForm(p=>({...p,url:e.target.value}))} placeholder="url" className="flex-1 bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs outline-none"/>
                        <button onClick={()=>{if(newLinkForm.url.trim()){onAddURLLink(currentEntry.id,link.id,newLinkForm);setNewLinkForm({label:"",url:""});setShowLinkFormFor(null);}}} className="bg-indigo-700 hover:bg-indigo-600 text-white px-2 py-1 rounded text-xs">add</button>
                        <button onClick={()=>setShowLinkFormFor(null)} className="bg-gray-700 text-gray-300 px-2 py-1 rounded text-xs">cancel</button>
                      </div>
                    ):(
                      <button onClick={()=>{setShowLinkFormFor({dumpId:currentEntry.id,linkId:link.id});setNewLinkForm({label:"",url:""}); }} className="text-xs text-gray-600 hover:text-gray-400 mt-1">+ citation link</button>
                    )}
                    <StorageTags dump={currentEntry} link={link} trueStorages={trueStorages}
                      onTag={onTagStorage} onUntag={onUntagStorage} onOpenStorage={onOpenStorage}/>

                );

              {/* Add MM button / picker */}
              {mmPickerFor===currentEntry.id?(

                  <div className="max-h-48 overflow-y-auto">
                    {filteredMMs.length===0&&<div className="text-gray-600 text-xs text-center py-2">No MMs found.</div>}
                    {filteredMMs.map(m=>{
                      const already=alreadyLinked.includes(m.id);
                      return (
                        <div key={m.id} onClick={()=>{if(!already){onAddMMLink(currentEntry.id,m.id);setMmPickerFor(null);setMmSearch("");}}}

                  {editingTitleId===child.id?(

                      onBlur={()=>{onRename(child.id,editingTitleVal);setEditingTitleId(null);}}

                    <span className="flex-1 font-bold text-sm cursor-pointer" onClick={e=>e.stopPropagation()} onDoubleClick={()=>{setEditingTitleId(child.id);setEditingTitleVal(child.title);}}>{child.title}</span>
                  )}
                  {(()=>{
                    const childSubs=sourceDumps.filter(d=>d.parentId===child.id);

                    const open=e=>{e.stopPropagation();setHoveredBadgeId(child.id);};
                    const close=()=>setHoveredBadgeId(null);

                          {isOpen&&mmCount>0&&(
