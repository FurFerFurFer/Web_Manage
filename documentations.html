<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Documentations</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%232e6349%22/%3E%3Cg fill=%22none%22 stroke=%22white%22 stroke-width=%221.7%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2211%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227.6%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%224.4%22/%3E%3C/g%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%221.7%22 fill=%22white%22/%3E%3C/svg%3E">
  <script src="theme.js?v=1"></script>
  <script src="storage-guard.js?v=2"></script>
  <script src="schema.js?v=6"></script>
  <script src="calendar-core.js?v=6"></script>
  <script src="doc-table-core.js?v=2"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase-sync.js?v=2"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

    tailwind.config = {

</head>
<body class="app-page docs-page">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ── unified DB helpers (same contract as progress.html) ──────────────────

    // One parse-and-validate boundary for every page — storage-guard.js. This used to
    // be a bare JSON.parse whose catch never fired for 'null', '42' or '[…]'.
    function _getTrackDB() { return TrackStorage.loadDB(); }
    function _activeSlot() {
      const db=_getTrackDB(), slots=db.slots||[], id=db.activeSlotId;
      return slots.find(s=>s.id===id) || slots[0] || null;
    }
    function _readP(key, fallback) {
      const s=_activeSlot(); return (s && s[key]!==undefined) ? s[key] : fallback;
    }
    // Every write here touches exactly ONE slot key and is a fresh
    // read-modify-write, so a field another page owns is never rebuilt from
    // this page's stale state.
    function _writeSlotKey(key, val) {
      const db=_getTrackDB(), slots=db.slots||[];
      if (!slots.length) return;
      const id=(slots.find(s=>s.id===db.activeSlotId)||slots[0]).id;
      db.slots=slots.map(s=>s.id===id?{...s,[key]:val}:s);
      TrackStorage.saveDB(db);
    }
    // calendarNotes and deadlines are owned by progress.html. Holding them in
    // React state and writing the array back would clobber anything that page
    // (or another tab) added since this one mounted, so every edit derives the
    // next array from what is stored RIGHT NOW and returns it for rendering.
    function _mutateSlotKey(key, fn) {
      const db=_getTrackDB(), slots=db.slots||[];
      if (!slots.length) return [];
      const id=(slots.find(s=>s.id===db.activeSlotId)||slots[0]).id;
      const cur=slots.find(s=>s.id===id);
      const next=fn((cur && cur[key]) || []);
      db.slots=slots.map(s=>s.id===id?{...s,[key]:next}:s);
      TrackStorage.saveDB(db);
      return next;
    }

    // ── local calendar dates (never toISOString — that is a UTC day) ─────────

    function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    const localToday = () => toDateStr(new Date());

    // One id shape across the project — TrackStorage.newId in storage-guard.js,
    // shared with progress.html's uid() because both write into calendarNotes
    // and deadlines. String ids can never collide with the numeric nid()
    // counters in sir-ks02. The fallback keeps this page working if the guard
    // ever fails to load.
    const genId = () => window.TrackStorage && window.TrackStorage.newId
      ? window.TrackStorage.newId()
      : Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7);

    // ?page=<id> deep link, the counterpart of progress.html's ?date=<ds>.
    // Day notes and deadlines authored here point back at their source page,
    // so the Schedule can link straight to it.
    function _deepLinkPageId() {
      try {
        const id = new URLSearchParams(location.search).get('page');
        return id && _readP('docPages', []).some(p => p.id === id) ? id : null;
      } catch { return null; }
    }

    // every page at or under `id`, walked as a fixed point over the flat parentId
    // links (a subtree is not contiguous in the array, so adjacency proves nothing).
    // used both for cascade delete and as the drag cycle guard.
    function docDescendantIds(pages, id) {
      const set = new Set([id]);
      let grew = true;
      while (grew) {
        grew = false;
        for (const p of pages) if (!set.has(p.id) && set.has(p.parentId)) { set.add(p.id); grew = true; }
      }
      return set;
    }

    // ── DB size readout ──────────────────────────────────────────────────────
    // Firebase no longer uploads the DB as one ≤1 MiB document: firebase-sync.js
    // gzips it and splits it across users/{uid}/blob/{0..n-1}, so there is no
    // per-document ceiling to warn about. The remaining limit is this browser's
    // localStorage quota (~5-10 MB), which is what DB_ADVISORY_BYTES tracks.

    const DB_ADVISORY_BYTES = 4000000;
    function dbSizeBytes() {
      try { return new Blob([localStorage.getItem('track_db')||'']).size; } catch { return 0; }
    }

    // ── slot bootstrap ───────────────────────────────────────────────────────
    // Only auto-create a slot on a genuinely empty install. If legacy Progress/
    // KS02 data exists, creating db.slots here would make their migration IIFEs
    // (guarded by `if (db.slots) return`) skip it and orphan that data.

    function _hasLegacyData() {
      const db=_getTrackDB();
      if (db.ks02 || db.progress) return true;
      return ['ks02_slots','progress_goals','progress_sa_actions','progress_sa_entries']
        .some(k => { try { return !!localStorage.getItem(k); } catch { return false; } });
    }
    function _bootstrapSlotIfSafe() {
      // An unreadable track_db reads as {} here, which is indistinguishable from a fresh
      // install — and this page auto-creates on a fresh install, so it is one of the two
      // that used to overwrite damaged data outright. TrackStorage.saveDB refuses the
      // write regardless; returning false is what stops the page then claiming a
      // workspace that was never stored.
      if (TrackStorage.dbBlocked()) return false;
      const db=_getTrackDB();
      if ((db.slots||[]).length) return true;
      if (_hasLegacyData()) return false;
      const s=TrackSchema.createEmptySlot({name:'Default'});
      return TrackStorage.saveDB({slots:[s],activeSlotId:s.id});
    }

    // ── small shared UI pieces ───────────────────────────────────────────────

    function AutoTextarea({value, onChange, onFocus, onClick, placeholder, className}) {
      const ref = useRef(null);
      const fit = () => {
        const el = ref.current; if (!el) return;
        el.style.height='auto'; el.style.height=el.scrollHeight+'px';
      };
      useEffect(fit, [value]);
      // Width, not only value. A table column being dragged, a sidebar thrown
      // full-screen or the window resizing all change where the text wraps
      // without changing a character of it, and the [value] effect alone would
      // leave every row at the wrong height.
      //
      // WIDTH ONLY, and that gate is load-bearing rather than an optimisation.
      // fit() sets this element's height, which changes its parent's height,
      // which is a resize — so an ungated observer re-fits forever and React
      // dies on "Maximum update depth exceeded", taking the whole page with it.
      // Observing the textarea instead of the parent has the identical loop.
      const lastW = useRef(-1);
      useEffect(() => {
        const el = ref.current;
        const box = el && el.parentElement;
        if (!box || typeof ResizeObserver !== 'function') return;
        const ro = new ResizeObserver(() => {
          const w = box.clientWidth;
          if (w === lastW.current) return;
          lastW.current = w;
          fit();
        });
        ro.observe(box);
        return () => ro.disconnect();
      }, []);
      return (
        <textarea ref={ref} rows={1} value={value} placeholder={placeholder}
          onChange={onChange} onFocus={onFocus} onClick={onClick}
          className={"w-full bg-transparent resize-none outline-none overflow-hidden break-words placeholder-gray-600 "+(className||'')} />
      );
    }

    // Cloud sync state plus a plain workspace-size readout. Degrades to the size
    // alone when window.TrackSync is absent (offline-only, or a page that does not
    // load firebase-sync.js).

    const SYNC_LABELS = {
      synced:       {text:'✓ synced',      cls:'text-emerald-400'},
      syncing:      {text:'↻ syncing…',    cls:'text-sky-400'},
      pending:      {text:'↻ syncing…',    cls:'text-sky-400'},
      error:        {text:'⚠ sync failed', cls:'text-red-400'},
      conflict:     {text:'⚠ conflict',    cls:'text-amber-300'},
      'signed-out': {text:'· local only',  cls:'text-gray-500'},
      idle:         {text:'· local only',  cls:'text-gray-500'}
    };

    function SyncChip({dbSize}) {
      const [sync, setSync] = useState(() => window.TrackSync ? window.TrackSync.getStatus() : null);
      useEffect(() => window.TrackSync ? window.TrackSync.subscribe(setSync) : undefined, []);

      const label = sync ? (SYNC_LABELS[sync.state] || SYNC_LABELS.idle) : null;
      const big = dbSize > DB_ADVISORY_BYTES;
      const cloudKb = sync && sync.cloudBytes ? Math.round(sync.cloudBytes/1024) : null;

      return (
        <span className="flex items-center gap-1.5 text-[10px]">
          <span className={"rounded px-1.5 py-0.5 "+(big ? "bg-amber-900/50 text-amber-300" : "text-gray-500")}
            title={"Workspace size in this browser's local storage"
              + (cloudKb ? " — sync compresses it to about "+cloudKb+" KB in the cloud" : "")
              + ". Cloud sync splits the workspace across documents, so there is no 1 MB document limit."}>
            {Math.round(dbSize/1024)} KB
          </span>
          {label && (
            <span className={"rounded px-1.5 py-0.5 "+label.cls}
              title={sync.lastError ? 'Last sync error: '+sync.lastError : 'Cloud sync status'}>
              {label.text}
            </span>
          )}
        </span>
      );
    }

    const EMOJI_CHOICES = ["📄","📝","📰","📚","📖","🗂️","📁","🗓️","📌","📎","💡","🎯","🏆","🏅","🎓","🔬","🧪","🧠","🌱","🌍","⚡","🔥","⭐","❤️","✅","❗","❓","💬","📷","🎵","🧮","🖥️","🌐","✈️","🏫","🏥","💼","🧾","🔑","🎉"];

    function EmojiPicker({onPick, onClose}) {
      const [custom, setCustom] = useState('');
      useEffect(() => {
        const onKey = e => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      return (
        <div className="absolute z-30 mt-1 w-64 rounded border border-gray-700 bg-gray-900 p-2 shadow-xl">
          <div className="grid grid-cols-8 gap-1">
            {EMOJI_CHOICES.map(e => (
              <button key={e} onClick={()=>onPick(e)} className="rounded p-1 text-lg hover:bg-gray-700">{e}</button>
            ))}
          </div>
          <div className="mt-2 flex gap-1">
            <input value={custom} onChange={e=>setCustom(e.target.value)} placeholder="type any emoji…"
              className="flex-1 rounded bg-gray-800 px-2 py-1 text-xs outline-none border border-gray-700" />
            <button onClick={()=>{ if(custom.trim()) onPick(custom.trim()); }}
              className="rounded bg-gray-700 px-2 py-1 text-xs hover:bg-gray-600">Set</button>
            <button onClick={()=>onPick('')} className="rounded px-2 py-1 text-xs text-gray-500 hover:text-gray-300">Clear</button>
          </div>
        </div>
      );
    }

    // ── image pipeline: downscale to ≤1000px JPEG data-URI ───────────────────

    function readImageDownscaled(file, cb) {
      const reader = new FileReader();
      reader.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const MAX = 1000;
          let w = img.width, h = img.height;
          if (w > MAX || h > MAX) { const k = MAX / Math.max(w, h); w = Math.round(w*k); h = Math.round(h*k); }
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
          ctx.drawImage(img, 0, 0, w, h);
          cb(c.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = () => alert('Could not read that file as an image.');
        img.src = ev.target.result;
      };
      reader.onerror = () => alert('Could not read that file.');
      reader.readAsDataURL(file);
    }

    // ── source dump reference modal (tree fully expanded, all leaf links) ────

    function SourceDumpModal({dumps, mms, onPick, onClose}) {
      useEffect(() => {
        const onKey = e => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);
      const childrenOf = id => dumps.filter(d => (d.parentId||null) === id);
      const isLeaf = d => !dumps.some(o => o.parentId === d.id);
      const mmName = id => { const m = mms.find(m => m.id === id); return m ? m.name : 'Unknown MM'; };
      const roots = childrenOf(null);
      const anyLinks = dumps.some(d => isLeaf(d) && (d.mmLinks||[]).some(l => (l.links||[]).length));

      const renderEntry = (d, depth) => (
        <div key={d.id} style={{marginLeft: depth ? 14 : 0}} className="border-l border-gray-800 pl-2 mt-1">
          <div className="flex items-center gap-1 text-xs text-gray-300">
            <span>{isLeaf(d) ? '📄' : '📁'}</span>
            <span className="font-bold">{d.title || 'Untitled'}</span>
          </div>
          {isLeaf(d) && (d.mmLinks||[]).map(l => (
            <div key={l.id} className="ml-4 mt-1">
              <div className="text-[10px] uppercase tracking-wider text-gray-500">MM · {mmName(l.mmId)}</div>
              {(l.links||[]).length === 0 && (
                <div className="text-[10px] text-gray-600 italic">no links</div>
              )}
              {(l.links||[]).map(u => (
                <button key={u.id}
                  onClick={()=>onPick({label:u.label, url:u.url, dumpRef:{dumpId:d.id, linkId:l.id, urlId:u.id}})}
                  className="block w-full truncate rounded px-1 py-0.5 text-left text-xs text-cyan-300 hover:bg-gray-800"
                  title={u.url}>
                  🔗 {u.label || u.url} <span className="text-gray-600">· {u.url}</span>
                </button>
              ))}
            </div>
          ))}
          {childrenOf(d.id).map(c => renderEntry(c, depth+1))}
        </div>
      );

      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60" onClick={onClose}>
          <div className="max-h-[80vh] w-[520px] max-w-[92vw] overflow-y-auto rounded-lg border border-gray-700 bg-gray-900 p-4"
            onClick={e=>e.stopPropagation()}>
            <div className="mb-2 flex items-center justify-between">
              <span className="text-xs font-bold tracking-widest text-gray-300">REFERENCE FROM SOURCE DUMP</span>
              <button onClick={onClose} className="text-gray-500 hover:text-gray-200">✕</button>
            </div>
            {roots.length === 0 && (
              <div className="py-6 text-center text-xs text-gray-500">
                No source dumps yet. Add them in KS02 → KS03 → SOURCE DUMP.
              </div>
            )}
            {roots.length > 0 && !anyLinks && (
              <div className="pb-2 text-[10px] text-gray-500 italic">
                Dumps exist but no leaf entry has links yet — add label/url links in KS02 first.
              </div>
            )}
            {roots.map(d => renderEntry(d, 0))}
          </div>
        </div>
      );
    }

    // ── block editors ────────────────────────────────────────────────────────

    const TEXT_STYLES = {
      h1: 'text-3xl font-bold text-gray-100',
      h2: 'text-2xl font-bold text-gray-100',
      h3: 'text-lg font-bold text-gray-200',
      p:  'text-sm text-gray-300'
    };

    function BlockShell({block, onMove, onDelete, onSetType, children}) {
      const isText = ['h1','h2','h3','p'].includes(block.type);
      return (
        <div className="doc-block group relative rounded px-1 py-0.5 hover:bg-gray-900/60">
          <div className="doc-chrome absolute -left-1 top-0 z-10 flex -translate-x-full items-center gap-0.5 pr-1 opacity-0 transition-opacity group-hover:opacity-100">
            {isText && (
              <select value={block.type} onChange={e=>onSetType(e.target.value)}
                className="rounded border border-gray-700 bg-gray-900 px-0.5 py-0.5 text-[10px] text-gray-400">
                <option value="h1">H1</option><option value="h2">H2</option>
                <option value="h3">H3</option><option value="p">Text</option>
              </select>
            )}
            <button onClick={()=>onMove(-1)} title="Move up"   className="rounded bg-gray-800 px-1 text-[10px] text-gray-400 hover:text-white">↑</button>
            <button onClick={()=>onMove(1)}  title="Move down" className="rounded bg-gray-800 px-1 text-[10px] text-gray-400 hover:text-white">↓</button>
            <button onClick={onDelete}       title="Delete"    className="rounded bg-gray-800 px-1 text-[10px] text-red-400 hover:text-red-300">✕</button>
          </div>
          {children}
        </div>
      );
    }

    /* Read-only render of a table's cells, shared by the editor below and the
       paste modal's preview. Both go through TrackDocTable.mergeMap — the ONE
       definition of which cells are drawn and how far they span — so the
       preview cannot disagree with what lands on the page. */
    function TableGrid({block, cell, widths, resize}) {
      const DT = window.TrackDocTable;
      const rows = DT.rowsOf(block);
      const map = DT.mergeMap(block);
      const cols = DT.gridSize(block).cols;
      // The in-flight drag wins over the stored list, so the columns follow the
      // finger without a write per pointermove. Column count comes from
      // gridSize, never rows[0].length — a ragged stored row would otherwise
      // desynchronise the colgroup from the widest row.
      const w = (widths && widths.length === cols) ? widths : DT.colWidthsOf(block);
      return (
        <table className="doc-table w-full table-fixed border-collapse text-sm">
          {/* table-layout: fixed ALWAYS, so a <col> width is authoritative
              rather than a suggestion the content can override. With nothing
              stored the columns carry no width and fixed layout draws them
              equally — which is exactly what resizeColumn seeds from, so the
              first drag moves one boundary instead of snapping the table. */}
          <colgroup>
            {Array.from({length: cols}, (_, ci) => (
              <col key={ci} data-col={ci}
                style={w.length ? {width: w[ci] + '%'} : undefined} />
            ))}
          </colgroup>
          <tbody>
            {rows.map((row, ri) => (
              <tr key={ri}>
                {row.map((text, ci) => {
                  const span = map[ri] && map[ri][ci];
                  if (!span) return null;   // covered by a merge — draw nothing
                  // The boundary this cell's handle moves. A colSpan cell
                  // resizes the LAST column it covers, so every unmerged cell
                  // anywhere in the table offers a handle for its own edge and
                  // no boundary is left unreachable behind a merge.
                  const edge = ci + span.cs - 1;
                  return (
                    <td key={ci} className="relative border border-gray-700 p-0 align-top"
                      colSpan={span.cs} rowSpan={span.rs}
                      data-cell={ri + ',' + ci}
                      data-span={span.rs + 'x' + span.cs}>
                      {cell(text, ri, ci, span)}
                      {resize && edge + 1 < cols && (
                        <span data-col-handle={edge} title="Drag to resize this column"
                          onPointerDown={e => resize.start(e, edge)}
                          onPointerMove={resize.move}
                          onPointerUp={resize.end}
                          onPointerCancel={resize.end}
                          onLostPointerCapture={resize.end}
                          className="doc-chrome absolute right-0 top-0 z-10 h-full w-1.5 cursor-col-resize touch-none bg-gray-600/60 opacity-0 transition-opacity group-hover:opacity-100 hover:bg-sky-500" />
                      )}
                    </td>
                  );
                })}
              </tr>
            ))}
          </tbody>
        </table>
      );
    }

    function TableBlock({block, onChange, onFocus}) {
      const DT = window.TrackDocTable;
      // Which cell the merge buttons act on. Nothing is persisted — it is the
      // caret, not data.
      const [sel, setSel] = useState(null);

      // The in-flight column drag. Held here rather than written per move: a
      // pointermove-per-write would put hundreds of whole-database writes
      // through TrackStorage.saveDB and arm the sync debounce on every one of
      // them. It commits once, on pointerup — the same draft-then-Save shape
      // the Documentations caution picker already uses.
      const [drag, setDrag] = useState(null);
      // A ref beside the state, and it is load-bearing rather than a shortcut.
      // React runs a functional setState updater during the RENDER phase, so
      // reading the in-flight drag out of one — and worse, calling the parent's
      // onChange from inside one — is a side effect during render: React
      // re-runs it, the parent updates, and the page dies on "Maximum update
      // depth exceeded". The ref is read synchronously in the handler instead.
      const dragRef = useRef(null);
      const putDrag = d => { dragRef.current = d; setDrag(d); };

      const setCell = (ri, ci, v) =>
        onChange({...block, rows: block.rows.map((r,i)=>i===ri?r.map((c,j)=>j===ci?v:c):r)});

      const resize = {
        start: (e, index) => {
          const table = e.currentTarget.closest('table');
          if (!table) return;
          // Stop the pointer reaching the cell behind the handle, and stop the
          // mouse drag turning into a text selection.
          e.preventDefault();
          e.stopPropagation();
          // Capture, so the pointer stays ours once it leaves the 6px strip.
          try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
          const cols = DT.gridSize(block).cols;
          let base = DT.colWidthsOf(block);
          if (!base.length) base = Array.from({length: cols}, () => 100 / cols);
          putDrag({index, startX: e.clientX, tableW: table.getBoundingClientRect().width || 1,
            base, widths: base});
        },
        move: e => {
          const d = dragRef.current;
          if (!d) return;
          // Recomputed from the ORIGINAL widths every time, never applied
          // cumulatively, so a move that arrives out of order cannot drift.
          const pct = d.base[d.index] + (e.clientX - d.startX) / d.tableW * 100;
          const probe = DT.resizeColumn(DT.withColWidths(block, d.base), d.index, pct);
          putDrag({...d, widths: DT.colWidthsOf(probe)});
        },
        end: () => {
          // pointerup releases the capture, so lostpointercapture follows it —
          // this runs twice for one drag and the second must do nothing.
          const d = dragRef.current;
          if (!d) return;
          putDrag(null);
          onChange(DT.withColWidths(block, d.widths));
        }
      };

      const hasWidths = DT.colWidthsOf(block).length > 0;

      const size = DT.gridSize(block);
      const selValid = sel && sel.r < size.rows && sel.c < size.cols;
      const canRight = selValid ? DT.canMerge(block, sel.r, sel.c, 'right') : {ok:false, reason:'Click a cell first.'};
      const canDown  = selValid ? DT.canMerge(block, sel.r, sel.c, 'down')  : {ok:false, reason:'Click a cell first.'};
      const merged   = selValid ? DT.mergeAt(block, sel.r, sel.c) : null;

      // A chrome button that can be disabled with its reason as the tooltip,
      // rather than discovered by clicking and having nothing happen. Merging
      // hides the covered text and never clears it, so unmerge is a restore
      // rather than a guess — which is exactly why neither of those asks first.
      // The row/column removals and the width reset below still do: those DO
      // drop text or clear a stored field.
      const chromeBtn = (label, title, enabled, onClick) => (
        <button onClick={onClick} disabled={!enabled} title={title}
          className={"rounded px-1.5 py-0.5 " + (enabled
            ? "bg-gray-800 text-gray-400 hover:text-white"
            : "bg-gray-900 text-gray-700 cursor-not-allowed")}>{label}</button>
      );

      return (
        <div onFocus={onFocus}>
          <div className="overflow-x-auto">
            {/* AutoTextarea, not an <input>: an input is single-line by
                construction, so anything longer than its column was clipped —
                on screen AND in the printed PDF, since this page has no
                separate print DOM. A textarea wraps and the row grows. */}
            <TableGrid block={block} resize={resize}
              widths={drag ? drag.widths : null}
              cell={(text, ri, ci) => (
                <AutoTextarea value={text}
                  onChange={e=>setCell(ri,ci,e.target.value)}
                  // Click as well as focus: tabbing into a cell selects it, and so
                  // does clicking one that already had the caret.
                  onClick={()=>setSel({r:ri, c:ci})}
                  onFocus={()=>setSel({r:ri, c:ci})}
                  className={"px-2 py-1 "+(ri===0?'font-bold text-gray-100 bg-gray-800/60':'text-gray-300')} />
              )} />
          </div>
          <div className="doc-chrome mt-1 flex flex-wrap gap-1 text-[10px] opacity-0 transition-opacity group-hover:opacity-100">
            <button onClick={()=>onChange(DT.withRows(block, [...block.rows, block.rows[0].map(()=> '')]))} className="rounded bg-gray-800 px-1.5 py-0.5 text-gray-400 hover:text-white">+ row</button>
            <button onClick={()=>{
              // After the length guard, never before it — a no-op must not ask.
              if(block.rows.length<=1) return;
              if(!window.confirm('Delete the last row?\n\nAny text in its cells goes with it.')) return;
              onChange(DT.withRows(block, block.rows.slice(0,-1)));
            }} className="rounded bg-gray-800 px-1.5 py-0.5 text-gray-400 hover:text-white">− row</button>
            <button onClick={()=>onChange(DT.withRows(block, block.rows.map(r=>[...r,''])))} className="rounded bg-gray-800 px-1.5 py-0.5 text-gray-400 hover:text-white">+ col</button>
            <button onClick={()=>{
              if(block.rows[0].length<=1) return;
              if(!window.confirm('Delete the last column?\n\nAny text in its cells goes with it.')) return;
              onChange(DT.withRows(block, block.rows.map(r=>r.slice(0,-1))));
            }} className="rounded bg-gray-800 px-1.5 py-0.5 text-gray-400 hover:text-white">− col</button>
            {chromeBtn('⇔ auto width',
              hasWidths ? 'Give every column an equal share again'
                        : 'The columns are already at their default widths.',
              hasWidths, () => {
                // After the has-anything guard, never before it — a button that
                // does nothing must not still demand an answer.
                if (!window.confirm('Reset the column widths?\n\nEvery column goes back to an equal share. No cell text is touched.')) return;
                onChange(DT.withColWidths(block, []));
              })}
            <span className="mx-1 w-px bg-gray-800" />
            {chromeBtn('⇥ merge right', canRight.ok ? 'Merge the selected cell with the one to its right' : canRight.reason,
              canRight.ok, ()=>onChange(DT.mergeCells(block, sel.r, sel.c, 'right')))}
            {chromeBtn('⇩ merge down', canDown.ok ? 'Merge the selected cell with the one below it' : canDown.reason,
              canDown.ok, ()=>onChange(DT.mergeCells(block, sel.r, sel.c, 'down')))}
            {chromeBtn('⤫ unmerge', merged ? 'Split this cell back apart — the hidden text comes back' : 'The selected cell is not merged.',
              !!merged, ()=>onChange(DT.unmergeCell(block, sel.r, sel.c)))}
          </div>
        </div>
      );
    }

    /* The short brief a person hands to an AI along with the picture. The full
       version, with worked examples, is TABLE-PASTE.md at the repository root
       — this is the copy that has to be reachable without leaving the page. */
    const TABLE_AI_BRIEF = [
      'Read this image, separate any text outside the table, and reproduce the table EXACTLY in this format:',
      '',
      '::: track-table',
      '| Region     | Q1  | Q2  |',
      '| North      | 50  | 60  |',
      '| South      | 45  | ^^  |',
      '| Total: 155 | <<  | <<  |',
      ':::',
      '',
      'Separate surrounding text BEFORE building the grid:',
      '- The table begins and ends at its complete outside border.',
      '- Any heading, caption, note, or paragraph beyond that border is OUTSIDE TEXT, not a table cell.',
      '- Never turn outside text into a table row or merged cell.',
      '- Preserve each distinct outside-text item in reading order; join lines that are only visual wrapping.',
      '',
      'Determine the structure BEFORE transcribing the text:',
      '- Use a full-table image to count the smallest underlying columns and rows.',
      '- Trace every internal horizontal and vertical border segment.',
      '- Treat cells as merged only when their shared border is clearly absent along the entire edge: vertical for a column merge, horizontal for a row merge.',
      '- Never infer a merge from centered text, an empty cell, text wrapping, or row height.',
      '- A blank cell is still a real cell unless a missing border proves it is merged.',
      '- If close-up images are also supplied, use the full image for structure and the close-ups for text.',
      '',
      'Rules:',
      '- One line per row. Separate cells with | pipes.',
      '- EVERY row must have the same number of cells.',
      '- For a cell merged with the one to its LEFT, write <<',
      '- For a cell merged with the one ABOVE it, write ^^',
      '- A merged cell must fill a whole rectangle of rows and columns.',
      '- Write \\<< or \\^^ if a cell really contains those characters, and \\| for a pipe.',
      '- If any border, merge, or text is unclear, DO NOT GUESS. Ask for a higher-resolution full-table image plus overlapping close-up crops.',
      '- If outside text exists, write Outside text: before the block and list each distinct item with a dash. Then write Table paste: and the block.',
      '- If no outside text exists, output only the block.',
      '- Add no explanation beyond the outside-text list and the block.'
    ].join('\n');

    /* Paste a table in as text. A dedicated modal rather than a page-level
       paste handler, so there is no sniffing and no guessing about when a
       paste was meant to become a table — this textarea only ever holds one.

       The preview is rendered by TableGrid, the same component the editor
       uses, so what is shown here cannot drift from what gets inserted. */
    function PasteTableModal({onInsert, onClose}) {
      const DT = window.TrackDocTable;
      const [text, setText] = useState('');
      const [copied, setCopied] = useState(false);

      useEffect(() => {
        const onKey = e => { if (e.key === 'Escape') onClose(); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, []);

      const parsed = useMemo(() => DT.parseTableText(text), [text]);
      const touched = text.trim().length > 0;

      const copyBrief = () => {
        const done = () => { setCopied(true); setTimeout(()=>setCopied(false), 1500); };
        if (navigator.clipboard && navigator.clipboard.writeText)
          navigator.clipboard.writeText(TABLE_AI_BRIEF).then(done, ()=>{});
      };

      return (
        <div className="fixed inset-0 z-40 flex items-center justify-center bg-black/60" onClick={onClose}>
          <div data-paste-table className="max-h-[86vh] w-[680px] max-w-[94vw] overflow-y-auto rounded-lg border border-gray-700 bg-gray-900 p-4"
            onClick={e=>e.stopPropagation()}>
            <div className="mb-2 flex items-center justify-between">
              <span className="text-xs font-bold tracking-widest text-gray-300">PASTE A TABLE</span>
              <button onClick={onClose} className="text-gray-500 hover:text-gray-200">✕</button>
            </div>

            <details className="mb-3 rounded border border-gray-800 bg-gray-950/60 p-2">
              <summary className="cursor-pointer text-[11px] text-gray-400">
                Show a picture of a table to an AI — here is what to ask it for
              </summary>
              <pre className="mt-2 overflow-x-auto whitespace-pre-wrap break-words text-[10px] leading-relaxed text-gray-400">{TABLE_AI_BRIEF}</pre>
              <button onClick={copyBrief}
                className="mt-2 rounded bg-gray-800 px-2 py-1 text-[10px] text-gray-300 hover:text-white">
                {copied ? '✓ copied' : 'Copy these instructions'}
              </button>
            </details>

            <textarea value={text} onChange={e=>setText(e.target.value)} rows={8}
              data-paste-table-input
              placeholder={'Paste the block here, fence and all — or a plain markdown table.\n\n| Region | Q1 | Q2 |\n| North  | 50 | 60 |'}
              className="w-full rounded border border-gray-800 bg-gray-950 px-2 py-1 font-mono text-xs text-gray-200 outline-none focus:border-gray-600" />

            {touched && !parsed.ok && (
              <div data-paste-table-errors className="mt-2 rounded border border-red-900/70 bg-red-950/30 p-2 text-[11px] text-red-300">
                {parsed.errors.map((e, i) => (
                  <div key={i}>{e.line ? 'Line ' + e.line + ': ' : ''}{e.message}</div>
                ))}
              </div>
            )}

            {parsed.ok && (
              <div className="mt-3">
                <div className="mb-1 text-[10px] uppercase tracking-wider text-gray-500">
                  Preview · {parsed.rows.length} rows × {parsed.rows[0].length} columns
                  {parsed.merges.length ? ' · ' + parsed.merges.length + ' merged' : ''}
                </div>
                <div data-paste-table-preview className="overflow-x-auto rounded border border-gray-800 p-1">
                  <TableGrid block={{rows: parsed.rows, merges: parsed.merges}}
                    cell={(t, ri) => (
                      <div className={"px-2 py-1 " + (ri===0 ? 'font-bold text-gray-100 bg-gray-800/60' : 'text-gray-300')}>{t}</div>
                    )} />
                </div>
              </div>
            )}

            <div className="mt-3 flex justify-end gap-2">
              <button onClick={onClose} className="rounded bg-gray-800 px-3 py-1 text-xs text-gray-300 hover:text-white">Cancel</button>
              <button onClick={()=>parsed.ok && onInsert(parsed.rows, parsed.merges)}
                disabled={!parsed.ok}
                title={parsed.ok ? 'Insert this table' : 'Fix the errors above first'}
                className={"rounded px-3 py-1 text-xs " + (parsed.ok
                  ? "bg-cyan-700 text-white hover:bg-cyan-600"
                  : "bg-gray-900 text-gray-700 cursor-not-allowed")}>
                Insert table
              </button>
            </div>
          </div>
        </div>
      );
    }

    function LinkBlock({block, onChange, onFocus, dumpTitleFor}) {
      const refTitle = block.dumpRef ? dumpTitleFor(block.dumpRef) : null;
      return (
        <div onFocus={onFocus} className="flex flex-wrap items-center gap-2">
          <span className="text-gray-600">🔗</span>
          <input value={block.label} placeholder="label" onChange={e=>onChange({...block,label:e.target.value})}
            className="doc-link-input w-40 rounded border border-gray-800 bg-gray-900 px-2 py-1 text-xs outline-none focus:border-gray-600" />
          <input value={block.url} placeholder="url" onChange={e=>onChange({...block,url:e.target.value})}
            className="doc-link-input w-64 rounded border border-gray-800 bg-gray-900 px-2 py-1 text-xs outline-none focus:border-gray-600" />
          {block.url && (
            <a href={block.url} target="_blank" rel="noopener noreferrer"
              className="text-xs text-cyan-300 underline decoration-cyan-700 hover:text-cyan-200">
              {block.label || block.url}
            </a>
          )}
          {block.dumpRef && (
            <span className="rounded bg-gray-800 px-1.5 py-0.5 text-[10px] text-gray-500"
              title={`dump ${block.dumpRef.dumpId} · link ${block.dumpRef.linkId} · url ${block.dumpRef.urlId}`}>
              ⛁ {refTitle ? `from: ${refTitle}` : 'source removed'}
            </span>
          )}
        </div>
      );
    }

    function ImageBlock({block, onChange, onFocus}) {
      const fileRef = useRef(null);
      const pick = e => {
        const file = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!file) return;
        // No size gate: cloud sync compresses and chunks the workspace, so images
        // no longer threaten it. gzip recovers base64's 33% inflation, and even an
        // all-image megabyte still fits one chunk.
        readImageDownscaled(file, dataUri => onChange({...block, src: dataUri}));
      };
      return (
        <div onFocus={onFocus}>
          {block.src
            ? <img src={block.src} alt={block.alt||''} className="max-w-full rounded border border-gray-800" />
            : <button onClick={()=>fileRef.current && fileRef.current.click()}
                className="w-full rounded border border-dashed border-gray-700 py-6 text-xs text-gray-500 hover:border-gray-500 hover:text-gray-300">
                🖼️ Choose an image… (stored compressed inside this workspace)
              </button>}
          <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={pick} />
          <div className="doc-chrome mt-1 flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100">
            <input value={block.alt||''} placeholder="caption / alt text" onChange={e=>onChange({...block,alt:e.target.value})}
              className="w-60 rounded border border-gray-800 bg-gray-900 px-2 py-0.5 text-[10px] outline-none" />
            {block.src && <button onClick={()=>fileRef.current && fileRef.current.click()}
              className="rounded bg-gray-800 px-1.5 py-0.5 text-[10px] text-gray-400 hover:text-white">replace</button>}
          </div>
          {block.alt && block.src && <div className="mt-0.5 text-[10px] text-gray-500 italic">{block.alt}</div>}
        </div>
      );
    }

    // ── calendar block ───────────────────────────────────────────────────────
    // Shows the whole workspace by day using the same collectors as the
    // universal calendar on Home (calendar-core.js), and lets this page author
    // the two things a document can put on the schedule: day notes and
    // deadlines. Those are written into the shared slot arrays, so they appear
    // in the Schedule and on the Home calendar like any others — the only
    // difference is a docPageId pointing back at the page that added them.

    const CAL_DATE_FMT = {weekday:'long', year:'numeric', month:'long', day:'numeric'};

    // read-only day timeline; a JSX port of renderCalDaySchedule in index.html
    function CalDaySched({day}) {
      const TC = TrackCalendar;
      if (!day.blocks.length) return <div className="cal-empty-msg">Nothing scheduled.</div>;
      const totalH = (TC.SCHED_END_HOUR - TC.SCHED_START_HOUR) * TC.SCHED_PX_PER_HOUR;
      const laid = day.blocks.map(b => {
        const parts = String(b.time).split(':');
        const h = Number(parts[0]) || 0, mi = Number(parts[1]) || 0;
        return {...b,
          top: (h + mi/60 - TC.SCHED_START_HOUR) * TC.SCHED_PX_PER_HOUR,
          height: Math.max(16, (b.duration/60) * TC.SCHED_PX_PER_HOUR)};
      });
      const overlap = TC.overlapInfo(laid);
      const hours = [];
      for (let h = TC.SCHED_START_HOUR; h < TC.SCHED_END_HOUR; h++) hours.push(h);
      return (
        <div className="cal-sched-grid" style={{height: totalH+'px'}}>
          {hours.map(h => {
            const top = (h - TC.SCHED_START_HOUR) * TC.SCHED_PX_PER_HOUR;
            return (
              <React.Fragment key={h}>
                <div className="cal-sched-line" style={{top: top+'px'}} />
                <div className="cal-sched-hour" style={{top: top+'px'}}>{String(h).padStart(2,'0')}:00</div>
              </React.Fragment>
            );
          })}
          {/* blocks live in their own layer so their percentage widths are
              measured against the track area, not the hour-label gutter */}
          <div className="cal-sched-blocks">
            {laid.filter(b => b.top >= -b.height && b.top < totalH).map(b => {
              const group = overlap[b.id];
              const n = group ? group.length : 1;
              const idx = group ? group.indexOf(b.id) : 0;
              // metaLabel, when present, is what the block wants said about its
              // extent — a timed day note sets it so it is not captioned with a
              // duration the user never entered.
              const metaText = b.metaLabel || `${b.time} · ${TC.durLabel(b.duration)}`;
              return (
                <div key={b.id} className={"cal-sched-block"+(b.done?' done':'')}
                  title={`${b.kind} · ${b.title} · ${metaText}${b.done?' · done':''}`}
                  style={{top: b.top+'px', height: b.height+'px',
                    left: `calc(${idx*(100/n)}% + 1px)`, width: `calc(${100/n}% - 2px)`,
                    borderColor: b.color, background: b.color + (b.done ? '18' : '30')}}>
                  <div className="cal-sched-block-title">{(b.done?'✓ ':'')+b.title}</div>
                  <div className="cal-sched-block-meta">{metaText}</div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function CalOriginChip({origin, onOpenPage}) {
      if (origin.kind === 'schedule') return null;
      if (origin.kind === 'orphan') {
        return (
          <span className="cal-doc-origin missing"
            title="The documentation page that added this was deleted. The item was kept, and stays editable from the Schedule.">
            📄 source page removed
          </span>
        );
      }
      return (
        <button type="button" className={"cal-doc-origin"+(origin.kind==='own'?' own':'')}
          onClick={()=>onOpenPage(origin.page.id)}
          title={`Added from "${origin.page.title || 'Untitled'}" — click to open that page`}>
          📄 {origin.page.title || 'Untitled'}
        </button>
      );
    }

    function CalendarBlock({block, page, docPages, slot, onChange, onFocus, onOpenPage, onMutate}) {
      const TC = TrackCalendar;
      const [cur, setCur] = useState(() => { const d = new Date(); return {y: d.getFullYear(), m: d.getMonth()}; });
      const [selDs, setSelDs] = useState(null);
      const [showFilters, setShowFilters] = useState(false);
      const [composer, setComposer] = useState(null);            // null | 'note' | 'deadline'
      const [editing, setEditing] = useState(null);              // null | {kind, id}
      const [noteDraft, setNoteDraft] = useState({title:'', detail:''});
      // `cautionDates` is held in the DRAFT and written on Save, unlike
      // progress.html's picker which writes on every click. This form has a
      // Cancel, so a pick must be undoable by pressing it; and holding the
      // choice in the draft is what lets the composer and the edit form share
      // one picker — TC.dlStrandedBlockDays already takes a PROPOSED set.
      const [dlDraft, setDlDraft] = useState({title:'', detail:'', time:'', date:'', cautionDates:[]});
      // The caution picker's month, null meaning "follow the due day". Kept in
      // state rather than derived so paging back a month survives the re-render
      // each pick causes.
      const [cauMonth, setCauMonth] = useState(null);            // null | {y, m}

      const hidden = block.hidden || [];
      const hiddenKey = hidden.join(',');
      const opts = {hidden};

      const buckets = useMemo(() => TC.buildBuckets(slot, cur.y, cur.m, opts), [slot, cur.y, cur.m, hiddenKey]);
      const ms = useMemo(() => TC.buildMilestoneLanes(slot, cur.y, cur.m, opts), [slot, cur.y, cur.m, hiddenKey]);
      const day = selDs ? TC.buildDaySchedule(slot, selDs, opts) : null;

      // "Exclusively editable" scope: this page, or this page and everything
      // nested under it. Items from any other page stay visible but read-only.
      const owned = useMemo(
        () => block.scope === 'page' ? new Set([page.id]) : docDescendantIds(docPages, page.id),
        [block.scope, docPages, page.id]);

      // Days carrying an item this calendar owns, for the cell highlight, in two
      // strengths. A day note and a deadline's due day get the solid mark; a
      // deadline's chosen caution days get a softer one, because the Schedule
      // already renders those days as amber "!" chips and a three-week run-up
      // marked at full strength would read as twenty-one due dates.
      const ownedDates = useMemo(() => {
        const due = new Set(), caution = new Set();
        const mine = x => x.docPageId && owned.has(x.docPageId);
        (slot.calendarNotes||[]).forEach(n => { if (mine(n)) due.add(n.date); });
        (slot.deadlines||[]).forEach(d => {
          if (!mine(d)) return;
          due.add(d.date);            // a ticked deadline is still an owned day
          // ...but its run-up is not marked any more. This is the third and
          // last place the "should this day show a caution mark" rule is
          // spelled out — the other two are deadlinesCautionOn in
          // progress.html and deadlinesCaution in calendar-core.js — so the
          // tick has to be applied here too or the amber cell bars would
          // outlive the "!" rows they belong to.
          //
          // The due day cannot leak in here: TC.dlCautionDays drops it, which
          // is why this no longer carries a `ds !== d.date` test of its own.
          if (TC.dlDone(d)) return;
          TC.dlCautionDays(d).forEach(ds => caution.add(ds));
        });
        return {due, caution};
      }, [slot, owned]);

      function originOf(item) {
        if (!item.docPageId) return {kind:'schedule'};
        const p = docPages.find(x => x.id === item.docPageId);
        if (!p) return {kind:'orphan'};
        return {kind: owned.has(item.docPageId) ? 'own' : 'other', page: p};
      }
      // Only the owning page edits. An orphan — an item whose source page was
      // deleted — is NOT editable here: it is still visible, still carries its
      // data, and is still fully editable from the Progress Schedule, which is
      // the surface that owns these arrays. Letting any calendar edit it instead
      // would hand a stranger's item to whichever page happened to show it.
      const canEdit = o => o.kind === 'own';

      const shiftMonth = delta => {
        setSelDs(null); closeForms();
        setCur(c => {
          let y = c.y, m = c.m + delta;
          if (m < 0) { m = 11; y--; }
          if (m > 11) { m = 0; y++; }
          return {y, m};
        });
      };
      // Jump to a specific day, month included. `shiftMonth` clears the
      // selection on purpose; this one sets it, because a caution "!" row leads
      // to a due day that may well be in another month.
      const goToDay = ds => {
        const y = Number(ds.slice(0, 4)), m = Number(ds.slice(5, 7)) - 1;
        closeForms();
        setCur(c => (c.y === y && c.m === m) ? c : {y, m});
        setSelDs(ds);
      };
      function closeForms() {
        setComposer(null); setEditing(null);
        setNoteDraft({title:'', detail:'', time:''});
        setDlDraft({title:'', detail:'', time:'', date:'', cautionDates:[]});
        setCauMonth(null);
      }
      const toggleFilter = key => onChange({...block,
        hidden: hidden.includes(key) ? hidden.filter(k => k !== key) : [...hidden, key]});

      // ── authoring ──
      // `time` is optional and blank means "no time". The key is written only
      // when it has a value, so a note that never had one keeps exactly the
      // shape it always had. Clearing it is safe for blocks: an untimed note's
      // block simply falls back to TrackCalendar.DEFAULT_NOTE_TIME, so there is
      // nothing here that can strand one — this page still writes no block key
      // at all.
      const noteTime = () => TC.noteTimed(noteDraft) ? {time: noteDraft.time} : {};
      const addNote = () => {
        if (!noteDraft.title.trim() || !selDs) return;
        onMutate('calendarNotes', prev => [...prev, {
          id: genId(), date: selDs, title: noteDraft.title.trim(),
          detail: noteDraft.detail.trim(), createdAt: Date.now(), docPageId: page.id,
          ...noteTime()
        }]);
        closeForms();
      };
      const saveNote = id => {
        if (!noteDraft.title.trim()) return;
        onMutate('calendarNotes', prev => prev.map(n => {
          if (n.id !== id) return n;
          // clearing the field must actually clear it, so drop the key rather
          // than leaving a stale time behind
          const {time, ...rest} = n;
          return {...rest, title: noteDraft.title.trim(), detail: noteDraft.detail.trim(), ...noteTime()};
        }));
        closeForms();
      };
      // The due day comes from the DRAFT, not from the selected cell, so this
      // is a second writer of `date`; `dlDraftValid` format-checks it, because
      // a blank field would otherwise reach storage. The caution days come from
      // the draft too, and go in through TC.dlWithCautionDays — THE writer, so
      // the list is sanitised against `date` (no duplicate, no malformed day,
      // nothing on or after the due day) and `startDate` is deleted in the same
      // spread. A deadline being composed holds no prep, so no pick here can
      // strand anything; that is why the composer needs no refusal and the edit
      // form does.
      const addDeadline = () => {
        if (!TC.dlDraftValid(dlDraft)) return;
        const date = dlDraft.date;
        onMutate('deadlines', prev => [...prev, TC.dlWithCautionDays({
          id: genId(), date, time: dlDraft.time,
          title: dlDraft.title.trim(), detail: dlDraft.detail.trim(),
          createdAt: Date.now(), docPageId: page.id
        }, dlDraft.cautionDates)]);
        // Filed on another day it would land outside the open day panel, so
        // follow it there — the same move the origin chip and the caution rows
        // already make. goToDay closes the forms for us.
        if (date !== selDs) goToDay(date); else closeForms();
      };
      // The edit form changes the title, the detail, the due TIME and the
      // caution days — but NOT the due day. Moving an existing due day has to
      // refuse a move that orphans a chosen caution day, and that refusal lives
      // in the Progress popup's Edit form alone; if a due-date field ever comes
      // back to this form it needs that check in the same change.
      //
      // Un-picking a day CAN strand prep, so this refuses it — through
      // TC.dlStrandedBlockDays, the one definition, never a re-spelled
      // comparison. The picker below refuses at the click too; this is the gate
      // that makes it impossible to write a stranding set even so.
      //
      // TC.dlWithCautionDays spreads the STORED record first, so docPageId,
      // createdAt, done, date, id and every block key survive — and a legacy
      // `startDate` record is migrated by the act of being saved here, exactly
      // as progress.html's bulk migration does, through the same function.
      const saveDeadline = id => {
        const dl = (slot.deadlines || []).find(d => d.id === id);
        if (!dl || !TC.dlValid(dlDraft)) return;
        if (TC.dlStrandedBlockDays(dl, {cautionDates: dlDraft.cautionDates}).length) return;
        onMutate('deadlines', prev => prev.map(d => d.id === id
          ? {...TC.dlWithCautionDays(d, dlDraft.cautionDates),
             time: dlDraft.time,
             title: dlDraft.title.trim(), detail: dlDraft.detail.trim()}
          : d));
        closeForms();
      };
      // Writes `done` and nothing else, spreading the stored record so
      // docPageId, createdAt, cautionDates and any key a later version added
      // survive. No confirm: it is reversible by definition, unlike removeItem.
      const toggleDone = id => {
        onMutate('deadlines', prev => prev.map(d => d.id === id ? {...d, done: !d.done} : d));
      };
      const removeItem = (key, id, what) => {
        if (!window.confirm(`Delete this ${what}? It will disappear from the schedule too.`)) return;
        onMutate(key, prev => prev.filter(x => x.id !== id));
        closeForms();
      };

      const noteForm = (onSave, label) => (
        <div className="cal-doc-form doc-chrome">
          <input value={noteDraft.title} autoFocus placeholder="Note title"
            onChange={e=>setNoteDraft(d=>({...d, title: e.target.value}))} />
          <textarea rows={2} value={noteDraft.detail} placeholder="Detail (optional)"
            onChange={e=>setNoteDraft(d=>({...d, detail: e.target.value}))} />
          {/* blank = a chip in the day strip, as day notes have always been;
              a time puts the note on the hour grid instead */}
          <div className="cal-doc-form-row">
            <label>At (optional)<input type="time" value={noteDraft.time || ''}
              onChange={e=>setNoteDraft(d=>({...d, time: e.target.value}))} /></label>
          </div>
          <div className="cal-doc-form-acts">
            <button type="button" className="primary" disabled={!noteDraft.title.trim()} onClick={onSave}>{label}</button>
            <button type="button" onClick={closeForms}>Cancel</button>
          </div>
        </div>
      );
      // `dl` is the stored record when editing, and absent when composing.
      const dlForm = (onSave, label, dl) => {
        // Composing, the due day is TYPED and starts on the selected cell;
        // editing, there is no date field at all. Moving an EXISTING deadline
        // has to refuse a move that ORPHANS a chosen caution day, and the
        // Progress popup's Edit form is the one writer that does — so it stays
        // the only place an existing due day moves.
        //
        // The caution days ARE chosen here, in both modes. Every rule behind
        // them stays in calendar-core.js and is CALLED, never re-spelled:
        // dlWithCautionDays sanitises and writes, dlToggleCautionDay toggles,
        // and dlStrandedBlockDays decides what an un-pick would strand. That
        // last one is why this was once impossible here — holding the refusal
        // is one call, not a second copy of the rule.
        const composing = !dl;
        const due = composing ? dlDraft.date : dl.date;
        // THE resolver doubles as the draft sanitiser: a due day typed earlier
        // drops picks that are no longer before it, with no second rule saying
        // so, and the readout always matches what Save would store.
        const days = TC.dlWithCautionDays({date: due}, dlDraft.cautionDates).cautionDates;
        const chosen = new Set(days);
        // Days already holding this deadline's prep. A pick can never strand
        // work, but an UN-pick can, so those cells are marked and refuse.
        const held = new Set();
        if (dl && TC.blockOn(dl)) {
          const parts = TC.itemParts(dl);
          (parts.length ? parts.map(p => TC.partDay(p, dl)) : [TC.blockDay(dl)])
            .forEach(day => { if (day) held.add(day); });
        }
        // What un-picking EVERYTHING would strand — the same quantity the
        // Progress picker reports, and the gate on `clear all`. `stranded` is
        // the draft's own and is the backstop on Save: the click handler
        // already refuses, so it should never be non-empty. Both are [] while
        // composing, because dlStrandedBlockDays short-circuits on a falsy
        // record — a deadline that does not exist yet has no prep to strand,
        // which is what lets one picker serve both modes with no branch.
        const protectedDays = TC.dlStrandedBlockDays(dl, {cautionDates: []});
        const stranded = TC.dlStrandedBlockDays(dl, {cautionDates: days});
        const valid = (composing ? TC.dlDraftValid(dlDraft) : TC.dlValid(dlDraft)) && !stranded.length;
        const dueOk = /^\d{4}-\d{2}-\d{2}$/.test(due || '');
        const cauAnchor = cauMonth || (dueOk
          ? {y: Number(due.slice(0, 4)), m: Number(due.slice(5, 7)) - 1}
          : {y: cur.y, m: cur.m});
        const stepCau = n => {
          const t = new Date(cauAnchor.y, cauAnchor.m + n, 1);
          setCauMonth({y: t.getFullYear(), m: t.getMonth()});
        };
        const setCau = next => setDlDraft(d => ({...d, cautionDates: next}));
        const toggleCau = ds => {
          const next = TC.dlToggleCautionDay({date: due, cautionDates: days}, ds).cautionDates;
          // An un-pick that would strand placed prep is REFUSED, never
          // performed. Work the user put on the grid by hand is not ours to
          // drop or move, so the cell simply does not change and the line
          // below names the day.
          if (dl && TC.dlStrandedBlockDays(dl, {cautionDates: next}).length) return;
          setCau(next);
        };
        // Additive: UNIONS the n days before the due day into whatever is
        // already picked, so it can only ever add a mark and can never strand.
        const addRunUp = n => setCau(TC.dlWithCautionDays({date: due},
          days.concat(TC.daysBetween(TC.dayShift(due, -n), due))).cautionDates);
        // No window.confirm, unlike progress.html's clear: this writes nothing
        // to track_db, and Cancel puts every day back. The prep refusal still
        // applies, which is why the button reports it rather than asking a
        // question it would then ignore.
        const clearCau = () => { if (days.length && !protectedDays.length) setCau([]); };
        // Colour comes from the theme tokens, not from Tailwind's palette:
        // this page's chrome is token-styled and progress.html's is not, so the
        // hard-coded greys its picker uses would be unreadable here under Grit.
        const cellStyle = (isDue, locked, on, prep) => Object.assign({
          height: '1.4rem', fontSize: '0.625rem', lineHeight: 1,
          borderRadius: 'var(--radius-sm)', border: 0, cursor: locked ? 'default' : 'pointer',
          background: 'transparent', color: 'var(--color-text-muted)'
        },
          isDue ? {background: 'var(--color-danger-soft)', color: 'var(--color-danger)'}
            : locked ? {opacity: 0.35}
            : on ? {background: 'var(--color-warning)', color: 'var(--color-app-bg)', fontWeight: 700}
            : {},
          prep ? {textDecoration: 'underline', textDecorationColor: 'var(--color-primary-text)',
                  textUnderlineOffset: '2px'} : {});
        return (
        <div className="cal-doc-form doc-chrome">
          <input value={dlDraft.title} autoFocus placeholder="Deadline title"
            onChange={e=>setDlDraft(d=>({...d, title: e.target.value}))} />
          <div className="cal-doc-form-row">
            {composing && (
              <label>Due on<input type="date" value={dlDraft.date}
                onChange={e=>setDlDraft(d=>({...d, date: e.target.value}))} /></label>
            )}
            <label>Due at<input type="time" value={dlDraft.time}
              onChange={e=>setDlDraft(d=>({...d, time: e.target.value}))} /></label>
          </div>
          <textarea rows={2} value={dlDraft.detail} placeholder="Detail (optional)"
            onChange={e=>setDlDraft(d=>({...d, detail: e.target.value}))} />
          {/* The caution days. Every cell is a real <button>, so the grid is
              reachable by keyboard, and each carries data-dl-caution-day for
              the browser suite — the same hooks progress.html's picker uses,
              because this is the same feature on a second surface.

              Deliberately NOT .cal-cell / .cal-grid / .cal-doc-row: existing
              Documentations cases select those broadly across .doc-cal, and a
              picker reusing one would be counted as a month cell. For the same
              reason no tooltip here may begin "Due " — three cases count the
              "!" marks by that prefix. */}
          <div className="flex flex-col gap-1" style={{
            border: '1px solid var(--color-border-subtle)',
            borderRadius: 'var(--radius-sm)', padding: '0.35rem 0.4rem'}}>
            <div className="flex items-center justify-between gap-2">
              <span style={{fontSize: '0.625rem', color: 'var(--color-warning)'}}
                data-dl-caution-count={days.length}>
                ! {days.length} caution {days.length === 1 ? 'day' : 'days'}
                {dueOk ? ' · due ' + due : ' · pick a due date first'}
              </span>
              <span className="flex items-center gap-1">
                <button type="button" onClick={()=>stepCau(-1)} title="Previous month"
                  style={{fontSize: '0.6875rem', color: 'var(--color-text-muted)',
                    background: 'transparent', border: 0, cursor: 'pointer', padding: '0 0.25rem'}}>‹</button>
                <span data-dl-caution-month
                  style={{fontSize: '0.625rem', color: 'var(--color-text-muted)'}}>
                  {TC.MONTHS[cauAnchor.m]} {cauAnchor.y}
                </span>
                <button type="button" onClick={()=>stepCau(1)} title="Next month"
                  style={{fontSize: '0.6875rem', color: 'var(--color-text-muted)',
                    background: 'transparent', border: 0, cursor: 'pointer', padding: '0 0.25rem'}}>›</button>
              </span>
            </div>
            <div className="grid grid-cols-7 gap-px" data-dl-caution-cal>
              {TC.DOWS.map(w => (
                <div key={w} style={{fontSize: '0.5rem', lineHeight: 1, textAlign: 'center',
                  paddingBottom: '0.125rem', color: 'var(--color-text-muted)', opacity: 0.7}}>
                  {w.slice(0, 2)}
                </div>
              ))}
              {Array(TC.firstDay(cauAnchor.y, cauAnchor.m)).fill(null).map((_, i) => <div key={'b'+i} />)}
              {Array(TC.dim(cauAnchor.y, cauAnchor.m)).fill(null).map((_, i) => {
                const ds = TC.dStr(cauAnchor.y, cauAnchor.m, i + 1);
                const isDue = dueOk && ds === due;
                // Only the days BEFORE the due day are pickable. The due day is
                // drawn red on every surface and must never also be amber.
                const locked = !dueOk || ds >= due;
                const on = chosen.has(ds);
                const prep = held.has(ds);
                return (
                  <button key={ds} type="button"
                    data-dl-caution-day={ds}
                    data-dl-caution-on={on ? '1' : '0'}
                    disabled={locked}
                    onClick={()=>toggleCau(ds)}
                    title={isDue ? `${ds} — the deadline itself`
                      : !dueOk ? 'Pick a due date first'
                      : locked ? `${ds} is after the deadline`
                      : on && prep ? `${ds} holds this deadline's prep — move it before un-picking`
                      : on ? `Un-pick ${ds}` : `Mark ${ds} as a caution day`}
                    style={cellStyle(isDue, locked, on, prep)}>
                    {i + 1}
                  </button>
                );
              })}
            </div>
            <div className="flex items-center gap-1 flex-wrap">
              {[3, 7, 14].map(n => (
                <button key={n} type="button" disabled={!dueOk} onClick={()=>addRunUp(n)}
                  title={`Also mark the ${n} days before the deadline`}
                  style={{fontSize: '0.625rem', padding: '0.1rem 0.3rem', cursor: dueOk ? 'pointer' : 'default',
                    borderRadius: 'var(--radius-sm)', border: '1px solid var(--color-border-subtle)',
                    background: 'transparent', color: 'var(--color-warning)', opacity: dueOk ? 1 : 0.4}}>+{n}d</button>
              ))}
              <button type="button" data-dl-caution-clear onClick={clearCau}
                disabled={!days.length || protectedDays.length > 0}
                title={protectedDays.length > 0
                  ? 'Prep is scheduled on a caution day — move it first'
                  : 'No caution days — the due day only'}
                style={{fontSize: '0.625rem', padding: '0.1rem 0.3rem',
                  borderRadius: 'var(--radius-sm)', border: '1px solid var(--color-border-subtle)',
                  background: 'transparent', color: 'var(--color-text-muted)',
                  cursor: (!days.length || protectedDays.length) ? 'default' : 'pointer',
                  opacity: (!days.length || protectedDays.length) ? 0.4 : 1}}>clear all</button>
            </div>
            {/* The one place an un-pick explains itself. It is refused rather
                than performed, and the day is named, because nothing here moves
                work the user placed by hand. */}
            {protectedDays.length > 0 && (
              <p data-dl-caution-refused
                style={{fontSize: '0.5625rem', color: 'var(--color-primary-text)', margin: 0}}>
                Prep sits on {protectedDays.join(', ')} (underlined).
                Move it before un-picking those days.
              </p>
            )}
          </div>
          <div className="cal-doc-form-acts">
            <button type="button" className="primary" disabled={!valid} onClick={onSave}>{label}</button>
            <button type="button" onClick={closeForms}>Cancel</button>
            {!valid && dlDraft.title.trim() && (
              <span className="cal-doc-hint">
                {stranded.length
                  ? `Prep sits on ${stranded.join(', ')} — move it first.`
                  : composing && !dlDraft.date
                  ? 'Needs a due date and a time.'
                  : 'Needs a time.'}
              </span>
            )}
          </div>
        </div>
        );
      };

      const shownLanes = Math.min(ms.laneCount, TC.MS_MAX_LANES);
      const todayDs = TC.toDateStr(new Date());
      const firstCol = TC.firstDay(cur.y, cur.m);
      const dayCount = TC.dim(cur.y, cur.m);

      return (
        <div className="doc-cal" onFocus={onFocus} onClick={onFocus}>
          <div className="doc-cal-head doc-chrome">
            <div className="cal-month-nav">
              <button type="button" className="cal-nav-btn" onClick={()=>shiftMonth(-1)} aria-label="Previous month">‹</button>
              <span className="cal-month-label">{TC.MONTHS[cur.m]} {cur.y}</span>
              <button type="button" className="cal-nav-btn" onClick={()=>shiftMonth(1)} aria-label="Next month">›</button>
            </div>
            <div className="doc-cal-head-acts">
              <button type="button" className="doc-cal-btn"
                title="Which pages' items this calendar may edit"
                onClick={()=>onChange({...block, scope: block.scope === 'page' ? 'subtree' : 'page'})}>
                {block.scope === 'page' ? '⌾ This page' : '⌾ This page + sub-pages'}
              </button>
              <button type="button" className={"doc-cal-btn"+(hidden.length?' on':'')}
                aria-expanded={showFilters} onClick={()=>setShowFilters(v=>!v)}
                title="Choose which categories appear">
                ⚟ Filter{hidden.length ? ` (${TC.FILTERS.length - hidden.length}/${TC.FILTERS.length})` : ''}
              </button>
            </div>
          </div>

          {showFilters && (
            <div className="doc-cal-filters doc-chrome">
              {TC.FILTERS.map(f => {
                const on = !hidden.includes(f.key);
                return (
                  <button type="button" key={f.key} aria-pressed={on}
                    className={"doc-cal-filter"+(on?' on':'')} onClick={()=>toggleFilter(f.key)}>
                    <span className="cal-dot" style={{background: on ? f.color : 'transparent', borderColor: f.color}} />
                    {f.label}
                  </button>
                );
              })}
              <button type="button" className="doc-cal-filter reset" onClick={()=>onChange({...block, hidden: []})}>
                Show all
              </button>
            </div>
          )}

          <div className="cal-dow-row">
            {TC.DOWS.map(d => <div key={d} className="cal-dow">{d}</div>)}
          </div>
          <div className="cal-grid">
            {Array.from({length: firstCol}).map((_, i) => <div key={'e'+i} className="cal-cell empty" />)}
            {Array.from({length: dayCount}).map((_, i) => {
              const d = i + 1, ds = TC.dStr(cur.y, cur.m, d);
              const bucket = buckets[ds] || {};
              const dayLanes = ms.lanesByDate[ds] || [];
              const cats = TC.CATS.filter(c => bucket[c.key] && bucket[c.key].length);
              const byLane = {};
              dayLanes.forEach(seg => { byLane[seg.lane] = seg; });
              const overflow = dayLanes.filter(seg => seg.lane >= TC.MS_MAX_LANES);
              const col = (firstCol + d - 1) % 7;
              return (
                <div key={ds} title={cats.map(c => c.label+': '+bucket[c.key].length).join('\n')}
                  className={"cal-cell"+(ds===todayDs?' today':'')+(dayLanes.length?' milestone':'')
                    +(ds===selDs?' selected':'')
                    +(ownedDates.due.has(ds)?' cal-doc-own-day'
                      :ownedDates.caution.has(ds)?' cal-doc-caution-day':'')}
                  onClick={()=>{ setSelDs(ds===selDs?null:ds); closeForms(); }}>
                  <div className="cal-day-num">{d}</div>
                  {shownLanes > 0 && (
                    <div className="cal-ms-lanes">
                      {Array.from({length: shownLanes}).map((__, l) => {
                        const seg = byLane[l];
                        return (
                          <div key={l} className="cal-ms-lane">
                            {seg && (
                              /* bridge into the neighbouring cell so a period reads as
                                 one line; never bridge across a week wrap */
                              <span className={"cal-ms-line"
                                  +(seg.isStart ? ' cap-start' : (col !== 0 ? ' bridge-left' : ''))
                                  +(seg.isEnd ? ' cap-end' : (col !== 6 ? ' bridge-right' : ''))}
                                style={{background: seg.color}}
                                title={`${seg.title}${seg.owner ? ' — '+seg.owner : ''} · ${seg.startDate} → ${seg.endDate}`} />
                            )}
                          </div>
                        );
                      })}
                      {overflow.length > 0 && (
                        <span className="cal-ms-more" title={overflow.map(s=>s.title).join('\n')}>+{overflow.length}</span>
                      )}
                    </div>
                  )}
                  {cats.length > 0 && (
                    <div className="cal-dots">
                      {cats.map(c => <span key={c.key} className="cal-dot" style={{background: c.color}} />)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {day && (
            <div className="cal-detail doc-cal-detail">
              <div className="cal-detail-head">
                <span className="cal-detail-date">
                  {new Date(selDs + 'T12:00:00').toLocaleDateString(undefined, CAL_DATE_FMT)}
                </span>
                <div className="cal-detail-acts doc-chrome">
                  <a className="cal-detail-link" href={'progress.html?date='+selDs+'#schedule'}
                    title="Open this day in the Schedule" aria-label={'Open '+selDs+' in the Schedule'}>→</a>
                  <button type="button" className="cal-detail-link cal-detail-close"
                    title="Close day detail" aria-label="Close day detail"
                    onClick={()=>{ setSelDs(null); closeForms(); }}>×</button>
                </div>
              </div>

              <div className="cal-sched">
                {(day.mgs.length > 0 || day.sir.length > 0) && (
                  <div className="cal-sched-strip">
                    {day.mgs.length > 0 && (
                      <div className="cal-sched-mg">
                        <span className="cal-sched-strip-lbl">{day.mgCarried ? 'MG focus ↑ carried' : 'MG focus'}</span>
                        {day.mgs.map((name, i) => <span key={i} className="cal-sched-mg-item">• {name}</span>)}
                      </div>
                    )}
                    {day.sir.length > 0 && (
                      <div className="cal-sched-sirs">
                        <span className="cal-sched-strip-lbl">SIR</span>
                        {day.sir.map((s, i) => (
                          <span key={i} className={"cal-sched-sir"+(s.done?' done':'')}>{s.label}{s.done?' ✓':''}</span>
                        ))}
                      </div>
                    )}
                  </div>
                )}
                <CalDaySched day={day} />
              </div>

              {/* Day notes — this page may add them, and may edit the ones in its scope */}
              <div className="cal-detail-group">
                <div className="cal-detail-cat">
                  <span className="cal-dot" style={{background:'#e879f9'}} />
                  Day notes ({day.calNotesAll.length})
                  <button type="button" className="doc-cal-add doc-chrome"
                    onClick={()=>{ closeForms(); setComposer('note'); }}>+ note</button>
                </div>
                {day.calNotesAll.map(n => {
                  const o = originOf(n);
                  if (editing && editing.kind === 'note' && editing.id === n.id) {
                    return <React.Fragment key={n.id}>{noteForm(()=>saveNote(n.id), 'Save')}</React.Fragment>;
                  }
                  return (
                    <div key={n.id} className={"cal-doc-row"+(o.kind==='own'?' cal-doc-own':'')}>
                      <span className="cal-doc-row-main">
                        📌 {TC.noteTimed(n) && <span className="cal-item-time">{n.time}</span>} {n.title || 'Note'}
                        {n.detail && <span className="cal-item-meta"> · {n.detail}</span>}
                      </span>
                      <CalOriginChip origin={o} onOpenPage={onOpenPage} />
                      {canEdit(o) && (
                        <span className="cal-doc-row-acts doc-chrome">
                          <button type="button" title="Edit" onClick={()=>{
                            closeForms(); setEditing({kind:'note', id:n.id});
                            setNoteDraft({title: n.title||'', detail: n.detail||'', time: n.time||''});
                          }}>✎</button>
                          <button type="button" title="Delete" className="danger"
                            onClick={()=>removeItem('calendarNotes', n.id, 'day note')}>✕</button>
                        </span>
                      )}
                    </div>
                  );
                })}
                {composer === 'note' && noteForm(addNote, 'Add note')}
                {!day.calNotesAll.length && composer !== 'note' && <div className="cal-empty-msg">No day notes.</div>}
              </div>

              {/* Deadlines — due today, then the run-up of anything still pending */}
              <div className="cal-detail-group">
                <div className="cal-detail-cat">
                  <span className="cal-dot" style={{background:'#f87171'}} />
                  Deadlines ({day.deadlines.length})
                  <button type="button" className="doc-cal-add doc-chrome"
                    onClick={()=>{ closeForms(); setComposer('deadline');
                      /* the selected cell is only the DEFAULT due day now — the
                         form lets it be typed, so both dates start there */
                      setDlDraft({title:'', detail:'', time:'', date: selDs, cautionDates: []}); }}>+ deadline</button>
                </div>
                {day.deadlines.map(dl => {
                  const o = originOf(dl);
                  if (editing && editing.kind === 'deadline' && editing.id === dl.id) {
                    return <React.Fragment key={dl.id}>{dlForm(()=>saveDeadline(dl.id), 'Save', dl)}</React.Fragment>;
                  }
                  const done = TC.dlDone(dl);
                  return (
                    <div key={dl.id} className={"cal-doc-row"+(o.kind==='own'?' cal-doc-own':'')+(done?' done':'')}>
                      <span className="cal-doc-row-main">
                        {done ? '✓' : '⏰'} {dl.time} {dl.title || 'Deadline'}
                        <span className="cal-item-meta"> · {TC.dlCautionCount(dl)} caution {TC.dlCautionCount(dl) === 1 ? 'day' : 'days'}{done && ', hidden while ticked'}</span>
                        {dl.detail && <span className="cal-item-meta"> · {dl.detail}</span>}
                      </span>
                      <CalOriginChip origin={o} onOpenPage={onOpenPage} />
                      {canEdit(o) && (
                        <span className="cal-doc-row-acts doc-chrome">
                          {/* Same ownership gate as ✎ and ✕: a tick is an edit,
                              so only the page that authored the deadline may
                              make it. Everyone else sees the state, read-only. */}
                          <button type="button" title={done ? 'Untick' : 'Tick'}
                            onClick={()=>toggleDone(dl.id)}>{done ? '↺' : '✓'}</button>
                          <button type="button" title="Edit" onClick={()=>{
                            closeForms(); setEditing({kind:'deadline', id:dl.id});
