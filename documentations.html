      const favorites = docPages.filter(p => p.favorite);
      const roots = docPages.filter(p => !p.parentId || !docPages.some(x => x.id === p.parentId));

      if (!slotReady) {
        // Two different reasons land here and the advice is opposite. "Open Progress once
        // to migrate it" is right for un-migrated legacy data and actively wrong for a
        // damaged database, where the one thing that matters is not writing to it. The
        // storage-guard banner carries the detail; this panel must not contradict it.
        const blocked = window.TrackStorage && TrackStorage.dbBlocked();
        return (
          <div className="flex h-screen items-center justify-center bg-gray-950 font-mono text-sm text-gray-400">
            <div className="max-w-md rounded border border-gray-800 bg-gray-900 p-6 text-center">
              <div className="mb-2 text-gray-200">
                {blocked ? 'Saved data could not be read' : 'No workspace loaded yet'}
              </div>
              {blocked ? (
                <p className="text-xs leading-relaxed">
                  Your data has not been changed or deleted, and this page will not write
                  over it. Use “Download a copy” in the banner to save the stored data
                  before changing anything.
                </p>
              ) : (
                <p className="text-xs leading-relaxed">
                  Older Track data was found that has not been migrated. Open
                  <a href="progress.html" className="mx-1 text-cyan-300 underline">Progress</a>or
                  <a href="sir-ks02.html" className="mx-1 text-cyan-300 underline">KS02</a>
                  once to migrate it, or create a workspace on the
                  <a href="index.html" className="mx-1 text-cyan-300 underline">Home</a>page.
                </p>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen flex-col bg-gray-950 font-mono text-gray-300">
          {/* Header */}
          <header className="docs-header sticky top-0 z-10 flex items-center gap-3 border-b border-gray-800 bg-gray-900/90 px-3 py-2 backdrop-blur-sm">
            <a href="index.html" className="text-xs text-gray-600 transition-colors hover:text-gray-300">← TRACK</a>
            <span className="text-xs font-bold tracking-widest text-gray-300">DOCUMENTATIONS</span>
            {slotName && <span className="rounded bg-gray-800 px-1.5 py-0.5 text-[10px] text-gray-500">{slotName}</span>}
            <SyncChip dbSize={dbSize} />
            <div className="flex-1"></div>
            <div className="theme-toggle-host" data-theme-toggle-host></div>
          </header>

          <div className="flex min-h-0 flex-1">
            {/* Sidebar */}
            <aside ref={asideRef}
              className={"docs-sidebar flex w-60 shrink-0 flex-col overflow-y-auto border-r border-gray-800 bg-gray-900/60 p-2"
                +(sidebarFull?' docs-sidebar-full':'')}>
              <div className="docs-sidebar-top mb-2 flex items-center justify-between gap-2">
                <span className="doc-side-label text-[10px] font-bold uppercase tracking-widest text-gray-600">
                  {sidebarFull ? 'All pages' : ''}
                </span>
                <button data-doc-fullscreen onClick={()=>setSidebarFull(f=>!f)}
                  title={sidebarFull ? 'Exit full screen (Esc)' : 'Expand to full screen'}
                  aria-label={sidebarFull ? 'Exit full screen' : 'Expand to full screen'}
                  className="doc-side-full rounded px-2 py-1 text-xs text-gray-500 hover:bg-gray-800 hover:text-white">
                  {sidebarFull ? '✕' : '⛶'}
                </button>
              </div>
              {favorites.length > 0 && (
                <div className="mb-3">
                  <div className="doc-side-label mb-1 px-1 text-[10px] font-bold uppercase tracking-widest text-gray-600">Favorites</div>
                  {favorites.map(p => (
                    <div key={p.id}
                      className={"doc-fav-row flex cursor-pointer items-center gap-1 rounded px-2 py-0.5 text-xs "+(p.id===activePageId?'bg-gray-800 text-gray-100':'text-gray-400 hover:bg-gray-800/60 hover:text-gray-200')}
                      onClick={()=>{setActivePageId(p.id); setSidebarFull(false);}}>
                      <span>{p.icon || '📄'}</span>
                      <span className="truncate">{p.title || 'Untitled'}</span>
                    </div>
                  ))}
                </div>
              )}
              <div className={"mb-1 flex items-center justify-between rounded border px-1 "+((rootDragOver||(touchDrop&&touchDrop.root))?'border-violet-500 bg-violet-950/20':'border-transparent')}
                data-doc-root-drop
                onDragOver={e=>{ if (e.dataTransfer.types.includes('application/docpage-nest-id')) { e.preventDefault(); setRootDragOver(true); } }}
                onDragLeave={e=>{ if (!e.currentTarget.contains(e.relatedTarget)) setRootDragOver(false); }}
                onDrop={e=>{
                  const id = e.dataTransfer.getData('application/docpage-nest-id');
                  if (id) { e.preventDefault(); promotePageToRoot(id); }
                  setRootDragOver(false);
                }}>
                <span className="doc-side-label text-[10px] font-bold uppercase tracking-widest text-gray-600">Pages</span>
                {(rootDragOver || (touchDrop && touchDrop.root)) ? (
                  <span className="doc-drop-hint text-[9px] text-violet-300">↑ drop to move to top level</span>
                ) : (
                  <button onClick={()=>addPage(null)} title="Add page"
                    className="doc-side-add rounded px-1 text-xs text-gray-500 hover:bg-gray-800 hover:text-white">＋</button>
                )}
              </div>
              {roots.length === 0 && (
                <button onClick={()=>addPage(null)}
                  className="mx-1 rounded border border-dashed border-gray-700 py-3 text-xs text-gray-500 hover:border-gray-500 hover:text-gray-300">
                  Create your first page
                </button>
              )}
              {roots.map(p => (
                <PageTreeItem key={p.id} page={p} pages={docPages} depth={0}
                  activePageId={activePageId} collapsed={collapsed}
                  onToggleCollapse={id=>setCollapsed(c=>({...c,[id]:!c[id]}))}
                  onSelect={id=>{setActivePageId(id); setSidebarFull(false);}} onAddChild={addPage}
                  onToggleFav={toggleFav} onDelete={deletePage}
                  onNest={nestPage} onArrange={arrangePage}
                  onTouchDragStart={startTouchDrag} touchDrop={touchDrop} />
              ))}
              <button onClick={()=>addPage(null)}
                className="doc-side-addrow mt-2 rounded px-2 py-1 text-left text-xs text-gray-600 hover:bg-gray-800 hover:text-gray-300">
                ＋ Add page
              </button>
            </aside>
            {/* follows the finger; moved imperatively so a drag costs no render */}
            {dragging && (
              <div ref={ghostRef} className="doc-drag-ghost"
                style={{transform: 'translate(' + (dragging.x + 14) + 'px,' + (dragging.y + 14) + 'px)'}}>
                <span className="doc-drag-ghost-mode">{dragging.mode === 'nest' ? '⠿' : '⇅'}</span>
                {dragging.label}
              </div>
            )}

            {/* Editor */}
            <main className="docs-editor min-w-0 flex-1 overflow-y-auto">
              {!activePage ? (
                <div className="flex h-full items-center justify-center text-xs text-gray-600">
                  Select or create a page from the sidebar.
                </div>
              ) : (
                <div className="mx-auto max-w-3xl px-10 py-10 font-sans">
                  {/* breadcrumb */}
                  {ancestors.length > 0 && (
                    <div className="docs-toolbar mb-2 flex flex-wrap items-center gap-1 text-[11px] text-gray-500">
                      {ancestors.map(a => (
                        <React.Fragment key={a.id}>
                          <button onClick={()=>setActivePageId(a.id)} className="hover:text-gray-200">
                            {a.icon || '📄'} {a.title || 'Untitled'}
                          </button>
                          <span>/</span>
                        </React.Fragment>
                      ))}
                      <span className="text-gray-400">{activePage.icon || '📄'} {activePage.title || 'Untitled'}</span>
                    </div>
                  )}

                  {/* toolbar */}
                  <div className="docs-toolbar mb-4 flex flex-wrap items-center gap-2">
                    <button onClick={exportPDF}
                      className="rounded border border-gray-700 bg-gray-900 px-2 py-1 text-[11px] text-gray-300 hover:border-gray-500"
                      title="Opens the print dialog — choose 'Save as PDF' to share this page">
                      ⤓ Export / PDF
                    </button>
                    <span className="text-[10px] text-gray-600">created {activePage.createdAt}</span>
                    <button onClick={()=>toggleFav(activePage.id)}
                      title={activePage.favorite ? 'Remove from favorites' : 'Add to favorites'}
                      aria-label={activePage.favorite ? 'Remove from favorites' : 'Add to favorites'}
                      aria-pressed={!!activePage.favorite}
                      className={"ml-auto flex min-h-[2.75rem] min-w-[2.75rem] items-center justify-center rounded-lg border text-2xl leading-none "
                        +(activePage.favorite
                          ? 'border-amber-500/60 bg-amber-500/10 text-amber-300 hover:border-amber-400'
                          : 'border-gray-700 bg-gray-900 text-gray-500 hover:border-gray-500 hover:text-amber-300')}>
                      {activePage.favorite ? '★' : '☆'}
                    </button>
                  </div>

                  {/* icon + title */}
                  <div className="relative mb-1">
                    <button onClick={()=>setShowEmoji(v=>!v)} title="Change page icon"
                      className="rounded p-1 text-4xl hover:bg-gray-800/60">
                      {activePage.icon || '📄'}
                    </button>
                    {showEmoji && (
                      <EmojiPicker
                        onPick={e=>{ patchPage(activePage.id, {icon: e}); setShowEmoji(false); }}
                        onClose={()=>setShowEmoji(false)} />
                    )}
                  </div>
                  <input value={activePage.title} placeholder="Untitled"
                    onChange={e=>patchPage(activePage.id, {title: e.target.value})}
                    className="mb-6 w-full bg-transparent text-4xl font-bold text-gray-100 outline-none placeholder-gray-700" />

                  {/* blocks */}
                  <div className="space-y-1 pl-2">
                    {(activePage.blocks||[]).map(b => (
                      <BlockShell key={b.id} block={b}
                        onMove={dir=>moveBlock(b.id, dir)}
                        onDelete={()=>deleteBlock(b.id)}
                        onSetType={t=>updateBlock({...b, type: t})}>
                        {['h1','h2','h3','p'].includes(b.type) && (
                          <AutoTextarea value={b.text||''} className={TEXT_STYLES[b.type]}
                            placeholder={b.type==='p' ? "Type something…" : "Heading"}
                            onFocus={()=>setActiveBlockId(b.id)}
                            onChange={e=>updateBlock({...b, text: e.target.value})} />
                        )}
                        {b.type === 'divider' && <hr className="my-2 border-gray-800" onClick={()=>setActiveBlockId(b.id)} />}
                        {b.type === 'table' && <TableBlock block={b} onChange={updateBlock} onFocus={()=>setActiveBlockId(b.id)} />}
                        {b.type === 'link' && <LinkBlock block={b} onChange={updateBlock} onFocus={()=>setActiveBlockId(b.id)} dumpTitleFor={dumpTitleFor} />}
                        {b.type === 'image' && <ImageBlock block={b} onChange={updateBlock} onFocus={()=>setActiveBlockId(b.id)} />}
                        {b.type === 'calendar' && (
                          <CalendarBlock block={b} page={activePage} docPages={docPages} slot={slot}
                            onChange={updateBlock} onFocus={()=>setActiveBlockId(b.id)}
                            onOpenPage={setActivePageId} onMutate={mutateSlotArray} />
                        )}
                      </BlockShell>
                    ))}
                  </div>

                  {/* add-block menu */}
                  <div className="docs-addmenu mt-4 flex flex-wrap gap-1 border-t border-gray-800/70 pt-3 text-[11px]">
                    {[['h1','H1'],['h2','H2'],['h3','H3'],['p','Text'],['dump','⛁ Reference source dump'],['link','🔗 Link'],['table','▦ Table'],['image','🖼 Image'],['divider','― Divider'],['calendar','🗓 Calendar']].map(([t,l]) => (
                      <button key={t} onClick={()=> t==='dump' ? openDumpModal() : addBlock(t)}
                        className="rounded border border-gray-800 bg-gray-900 px-2 py-1 text-gray-400 hover:border-gray-600 hover:text-gray-200">
                        {l}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {showDumpModal && (
            <SourceDumpModal dumps={dumpsSnapshot.dumps} mms={dumpsSnapshot.mms}
              onPick={({label, url, dumpRef}) => {
                addBlock('link', {label, url, dumpRef, addedAt: Date.now()});
                setShowDumpModal(false);
              }}
              onClose={()=>setShowDumpModal(false)} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script src="notes-widget.js?v=2"></script>
</body>
</html>
