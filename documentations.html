                            /* seeded THROUGH the resolver, so a legacy startDate
                               record arrives as the explicit list it expands to
                               and saving migrates it */
                            setDlDraft({title: dl.title||'', detail: dl.detail||'', time: dl.time||'',
                              date: dl.date, cautionDates: TC.dlCautionDays(dl)});
                          }}>✎</button>
                          <button type="button" title="Delete" className="danger"
                            onClick={()=>removeItem('deadlines', dl.id, 'deadline')}>✕</button>
                        </span>
                      )}
                    </div>
                  );
                })}
                {composer === 'deadline' && dlForm(addDeadline, 'Add deadline')}
                {/* Read-only here — the ownership rule still applies — but the
                    row leads to the deadline's own day, where the page that
                    authored it does get its edit controls. */}
                {day.deadlinesCaution.map(dl => (
                  <div key={dl.id} className="cal-doc-row caution">
                    {/* A real button rather than a clickable row: the origin
                        chip beside it is already a button, and a click on it
                        must open that page without also moving the calendar. */}
                    <button type="button" className="cal-doc-row-main cal-doc-row-link"
                      title={'Go to the due day, ' + dl.date}
                      onClick={()=>goToDay(dl.date)}>
                      <span className="cal-doc-bang">!</span> {dl.title || 'Deadline'}
                      <span className="cal-item-meta"> · due {dl.date} at {dl.time}</span>
                    </button>
                    <CalOriginChip origin={originOf(dl)} onOpenPage={onOpenPage} />
                  </div>
                ))}
                {!day.deadlines.length && !day.deadlinesCaution.length && composer !== 'deadline' && (
                  <div className="cal-empty-msg">No deadlines.</div>
                )}
              </div>

              {/* everything else the workspace recorded on this day, read-only */}
              {TC.CATS.filter(c => (buckets[selDs]||{})[c.key] && buckets[selDs][c.key].length).map(c => (
                <div key={c.key} className="cal-detail-group">
                  <div className="cal-detail-cat">
                    <span className="cal-dot" style={{background: c.color}} />
                    {c.label} ({buckets[selDs][c.key].length})
                  </div>
                  {buckets[selDs][c.key].map((item, i) => (
                    <div key={i} className="cal-detail-item">
                      {item.label}
                      {item.meta && <span className="cal-item-meta"> · {item.meta}</span>}
                    </div>
                  ))}
                </div>
              ))}
            </div>
          )}

          {!day && <div className="doc-cal-hint doc-chrome">Pick a day to see what is on it, or to add a day note or deadline.</div>}
        </div>
      );
    }

    // ── sidebar ──────────────────────────────────────────────────────────────

    function PageTreeItem({page, pages, depth, activePageId, collapsed, onToggleCollapse, onSelect, onAddChild, onToggleFav, onDelete, onNest, onArrange, onTouchDragStart, touchDrop}) {
      const children = pages.filter(p => p.parentId === page.id);
      const isCollapsed = !!collapsed[page.id];
      // mouse drag-over feedback stays local to the row; never lifted to App
      const [nestDragOver, setNestDragOver] = useState(false);
      const [arrangeDragOver, setArrangeDragOver] = useState(null); // null | 'before' | 'after'
      /* The touch drop target is App-level — one finger crosses many rows, so
         a row cannot know from its own events that it stopped being the
         target. The two sources are ORed so both pointer kinds light up the
         same way and neither has to know the other exists. */
      const tDrop = touchDrop && touchDrop.targetId === page.id ? touchDrop : null;
      const nestOn = nestDragOver || (tDrop && tDrop.mode === 'nest');
      const arrangeOn = arrangeDragOver
        || (tDrop && tDrop.mode === 'arrange' ? (tDrop.before ? 'before' : 'after') : null);
      return (
        <div>
          <div className={"group flex items-center gap-1 rounded px-1 py-0.5 text-xs cursor-pointer "
              +(page.id===activePageId?'bg-gray-800 text-gray-100':'text-gray-400 hover:bg-gray-800/60 hover:text-gray-200')
              +(nestOn?' ring-1 ring-indigo-500 bg-indigo-950/30':'')
              +(arrangeOn==='before'?' border-t-2 border-green-500':arrangeOn==='after'?' border-b-2 border-green-500':'')}
            style={{paddingLeft: 'calc(4px + ' + depth + ' * var(--doc-indent, 14px))'}}
            data-doc-row={page.id}
            onClick={()=>onSelect(page.id)}
            onDragOver={e=>{
              // the payload is unreadable during dragover, so sniff types, never getData.
              // stopPropagation is what makes the innermost row win over its ancestors.
              const types = e.dataTransfer.types;
              if (types.includes('application/docpage-arrange-id')) {
                e.preventDefault(); e.stopPropagation();
                const rect = e.currentTarget.getBoundingClientRect();
                setArrangeDragOver(e.clientY < rect.top + rect.height/2 ? 'before' : 'after');
              } else if (types.includes('application/docpage-nest-id')) {
                e.preventDefault(); e.stopPropagation(); setNestDragOver(true);
              }
            }}
            onDragLeave={e=>{ if (!e.currentTarget.contains(e.relatedTarget)) { setNestDragOver(false); setArrangeDragOver(null); } }}
            onDrop={e=>{
              const arrangeId = e.dataTransfer.getData('application/docpage-arrange-id');
              if (arrangeId && arrangeId !== page.id) {
                e.preventDefault(); e.stopPropagation();
                const rect = e.currentTarget.getBoundingClientRect();
                onArrange(arrangeId, page.id, e.clientY < rect.top + rect.height/2);
              } else {
                const nestId = e.dataTransfer.getData('application/docpage-nest-id');
                if (nestId && nestId !== page.id) { e.preventDefault(); e.stopPropagation(); onNest(nestId, page.id); }
              }
              setNestDragOver(false); setArrangeDragOver(null);
            }}>
            <button onClick={e=>{e.stopPropagation(); onToggleCollapse(page.id);}}
              className={"doc-row-caret w-3 text-[9px] "+(children.length?'text-gray-500 hover:text-gray-200':'invisible')}>
              {isCollapsed ? '▸' : '▾'}
            </button>
            <span>{page.icon || '📄'}</span>
            <span className="flex-1 truncate">{page.title || 'Untitled'}</span>
            <span className="doc-row-acts hidden shrink-0 gap-0.5 group-hover:flex">
              <span draggable onClick={e=>e.stopPropagation()} data-doc-handle="nest"
                onDragStart={e=>{e.dataTransfer.setData('application/docpage-nest-id', page.id); e.dataTransfer.effectAllowed='move'; e.stopPropagation();}}
                onTouchStart={e=>onTouchDragStart(e, 'nest', page)}
                title="Drag to nest into another page"
                className="doc-row-handle cursor-grab select-none rounded px-1 text-gray-500 hover:text-indigo-400">⠿</span>
              <span draggable onClick={e=>e.stopPropagation()} data-doc-handle="arrange"
                onDragStart={e=>{e.dataTransfer.setData('application/docpage-arrange-id', page.id); e.dataTransfer.effectAllowed='move'; e.stopPropagation();}}
                onTouchStart={e=>onTouchDragStart(e, 'arrange', page)}
                title="Drag to arrange among pages"
                className="doc-row-handle cursor-grab select-none rounded px-1 text-gray-500 hover:text-green-400">⇅</span>
              <button title="Add sub-page" onClick={e=>{e.stopPropagation(); onAddChild(page.id);}} className="rounded px-1 text-gray-500 hover:text-white">+</button>
              <button title={page.favorite?'Unfavorite':'Favorite'} onClick={e=>{e.stopPropagation(); onToggleFav(page.id);}} className="rounded px-1 text-gray-500 hover:text-amber-300">{page.favorite?'★':'☆'}</button>
              <button title="Delete page" onClick={e=>{e.stopPropagation(); onDelete(page.id);}} className="rounded px-1 text-gray-500 hover:text-red-400">✕</button>
            </span>
            {page.favorite && <span className="doc-fav-badge text-[9px] text-amber-400 group-hover:hidden">★</span>}
          </div>
          {!isCollapsed && children.map(c => (
            <PageTreeItem key={c.id} page={c} pages={pages} depth={depth+1}
              activePageId={activePageId} collapsed={collapsed}
              onToggleCollapse={onToggleCollapse} onSelect={onSelect}
              onAddChild={onAddChild} onToggleFav={onToggleFav} onDelete={onDelete}
              onNest={onNest} onArrange={onArrange}
              onTouchDragStart={onTouchDragStart} touchDrop={touchDrop} />
          ))}
        </div>
      );
    }

    // ── main app ─────────────────────────────────────────────────────────────

    function App() {
      const [slotReady] = useState(() => _bootstrapSlotIfSafe());
      const [docPages, setDocPages] = useState(() => slotReady ? _readP('docPages', []) : []);
      // seeded from ?page= so the deep link wins over the "keep something
      // selected" effect below, which only fills in when nothing is selected
      const [activePageId, setActivePageId] = useState(() => slotReady ? _deepLinkPageId() : null);
      const [activeBlockId, setActiveBlockId] = useState(null);
      // read-only mirror of the whole slot, for calendar blocks. docPages is
      // NOT read from here — that stays owned by the docPages state above.
      const [slot, setSlot] = useState(() => _activeSlot() || {});
      const [collapsed, setCollapsed] = useState({});
      const [showDumpModal, setShowDumpModal] = useState(false);
      const [showPasteTable, setShowPasteTable] = useState(false);
      const [rootDragOver, setRootDragOver] = useState(false);
      // the sidebar filling the viewport. Ephemeral: never written to track_db.
      const [sidebarFull, setSidebarFull] = useState(false);
      // touch drag: `dragging` is set once at touchstart (it renders the ghost),
      // `touchDrop` only when the row under the finger CHANGES, and the live
      // coordinates live in a ref so following the finger costs no re-render.
      const [dragging, setDragging] = useState(null);
      const [touchDrop, setTouchDrop] = useState(null);
      const touchRef = useRef(null);
      const ghostRef = useRef(null);
      const asideRef = useRef(null);
      const [showEmoji, setShowEmoji] = useState(false);
      const [dbSize, setDbSize] = useState(() => dbSizeBytes());
      const [dumpsSnapshot, setDumpsSnapshot] = useState(() => ({
        dumps: _readP('sourceDumps', []).filter(d => d.parentId !== d.id),
        mms: _readP('mms', [])
      }));
      const firstRun = useRef(true);

      const slotName = (_activeSlot() || {}).name || '';

      // save: only the docPages key, only when it actually changed
      useEffect(() => {
        if (firstRun.current) { firstRun.current = false; return; }
        if (!slotReady) return;
        const stored = JSON.stringify(_readP('docPages', []));
        const next = JSON.stringify(docPages);
        if (stored !== next) _writeSlotKey('docPages', docPages);
        setDbSize(dbSizeBytes());
      }, [docPages]);

      // Escape is the second way out of full screen; the ✕ is the first.
      useEffect(() => {
        if (!sidebarFull) return;
        const onKey = e => { if (e.key === 'Escape') setSidebarFull(false); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [sidebarFull]);

      // a drag live at unmount would leave three document listeners behind
      useEffect(() => () => {
        const d = touchRef.current;
        if (d && d.raf) cancelAnimationFrame(d.raf);
        touchRef.current = null;
      }, []);

      // cross-tab / remote freshness
      useEffect(() => {
        const refresh = () => {
          const fresh = _readP('docPages', []);
          setDocPages(prev => JSON.stringify(prev) === JSON.stringify(fresh) ? prev : fresh);
          setDumpsSnapshot({
            dumps: _readP('sourceDumps', []).filter(d => d.parentId !== d.id),
            mms: _readP('mms', [])
          });
          setSlot(_activeSlot() || {});
          setDbSize(dbSizeBytes());
        };
        const onStorage = e => { if (!e.key || e.key === 'track_db') refresh(); };
        const onVis = () => { if (!document.hidden) refresh(); };
        window.addEventListener('storage', onStorage);
        document.addEventListener('visibilitychange', onVis);
        return () => {
          window.removeEventListener('storage', onStorage);
          document.removeEventListener('visibilitychange', onVis);
        };
      }, []);

      // keep an active page selected: first favorite, else first root, else first
      useEffect(() => {
        if (activePageId && docPages.some(p => p.id === activePageId)) return;
        const fav = docPages.find(p => p.favorite);
        const root = docPages.find(p => !p.parentId);
        setActivePageId((fav || root || docPages[0] || {}).id || null);
      }, [docPages, activePageId]);

      const activePage = docPages.find(p => p.id === activePageId) || null;

      // ── page mutations ──
      const touch = p => ({...p, updatedAt: Date.now()});
      const patchPage = (id, patch) => setDocPages(prev => prev.map(p => p.id===id ? touch({...p, ...patch}) : p));
      const patchBlocks = (id, fn) => setDocPages(prev => prev.map(p => p.id===id ? touch({...p, blocks: fn(p.blocks||[])}) : p));

      function addPage(parentId) {
        const p = {id: genId(), title: '', icon: '', parentId: parentId||null, favorite: false,
                   createdAt: localToday(), updatedAt: Date.now(),
                   blocks: [{id: genId(), type: 'p', text: ''}]};
        setDocPages(prev => [...prev, p]);
        setActivePageId(p.id);
        if (parentId) setCollapsed(c => ({...c, [parentId]: false}));
      }
      function toggleFav(id) { patchPage(id, {favorite: !(docPages.find(p=>p.id===id)||{}).favorite}); }
      function deletePage(id) {
        const toDel = docDescendantIds(docPages, id);
        const page = docPages.find(p => p.id === id);
        const n = toDel.size - 1;
        // Day notes and deadlines these pages authored live on the shared
        // schedule and are NOT deleted with the page — losing scheduled work
        // to a page delete would be data loss. They keep their docPageId and
        // read as "source page removed" wherever provenance is shown.
        const stranded = [...(_readP('calendarNotes', [])), ...(_readP('deadlines', []))]
          .filter(x => toDel.has(x.docPageId)).length;
        const msg = `Delete "${(page&&page.title)||'Untitled'}"${n ? ` and ${n} sub-page${n>1?'s':''}` : ''}? This cannot be undone.`
          + (stranded ? `\n\n${stranded} scheduled item${stranded>1?'s':''} added from ${n?'these pages':'this page'} will stay on the schedule and lose ${stranded>1?'their':'its'} source page. ${stranded>1?'They':'It'} can then only be edited from the Schedule.` : '');
        if (!window.confirm(msg)) return;
        setDocPages(prev => prev.filter(p => !toDel.has(p.id)));
        if (toDel.has(activePageId)) setActivePageId(null);
      }

      // ── drag to nest / drag to arrange ──
      // sibling order is implicit array order (roots and children are both filters),
      // so every move is one splice of one page — no order field, no schema change.
      // dropping a page into its own subtree would orphan both from every root, so
      // each mutation refuses that outright rather than repairing it later.

      // nest: dragged becomes the LAST child of target
      function nestPage(draggedId, targetId) {
        if (draggedId === targetId) return;
        setDocPages(prev => {
          if (docDescendantIds(prev, draggedId).has(targetId)) return prev;
          const di = prev.findIndex(p => p.id === draggedId);
          if (di < 0 || !prev.some(p => p.id === targetId)) return prev;
          const arr = [...prev];
          const [moved] = arr.splice(di, 1);
          const ti = arr.findIndex(p => p.id === targetId);   // re-find AFTER the removal
          let at = ti;
          for (let i = ti + 1; i < arr.length; i++) if (arr[i].parentId === targetId) at = i;
          arr.splice(at + 1, 0, {...moved, parentId: targetId, updatedAt: Date.now()});
          return arr;
        });
        setCollapsed(c => ({...c, [targetId]: false}));
      }

      // arrange: dragged adopts the target's parent and lands immediately before/after it
      function arrangePage(draggedId, targetId, insertBefore) {
        if (draggedId === targetId) return;
        setDocPages(prev => {
          if (docDescendantIds(prev, draggedId).has(targetId)) return prev;
          const di = prev.findIndex(p => p.id === draggedId);
          const target = prev.find(p => p.id === targetId);
          if (di < 0 || !target) return prev;
          const arr = [...prev];
          const [moved] = arr.splice(di, 1);
          const ti = arr.findIndex(p => p.id === targetId);   // re-find AFTER the removal
          arr.splice(insertBefore ? ti : ti + 1, 0,
            {...moved, parentId: target.parentId || null, updatedAt: Date.now()});
          return arr;
        });
      }

      /* ── the same three moves, by finger ──
         HTML5 drag-and-drop never fires from a touch, so the handles were dead
         on a phone and iPad. This is a second, parallel event family driving
         the SAME three mutators above — nestPage / arrangePage /
         promotePageToRoot — so the cycle refusal and the splice logic have one
         definition and cannot drift between pointer kinds.

         The listeners are bound imperatively at touchstart rather than from a
         useEffect on `dragging`: an effect does not run until after React has
         re-rendered, so a fast flick (and a synchronous test) would lose every
         touchmove that arrived first. */

      function touchDropAt(x, y) {
        const d = touchRef.current;
        if (!d) return null;
        const el = document.elementFromPoint(x, y);
        if (!el) return null;
        // only ⠿ promotes to root; ⇅ has no meaning on the section header
        if (d.mode === 'nest' && el.closest('[data-doc-root-drop]')) return { mode: 'nest', root: true };
        const row = el.closest('[data-doc-row]');
        if (!row) return null;
        const targetId = row.getAttribute('data-doc-row');
        if (targetId === d.pageId) return null;   // onto itself is not a move
        if (d.mode === 'nest') return { mode: 'nest', targetId };
        const rect = row.getBoundingClientRect();
        return { mode: 'arrange', targetId, before: y < rect.top + rect.height / 2 };
      }

      function sameDrop(a, b) {
        if (!a || !b) return a === b;
        return a.mode === b.mode && a.root === b.root
          && a.targetId === b.targetId && a.before === b.before;
      }

      function startTouchDrag(e, mode, page) {
        const t = e.touches[0];
        if (!t) return;
        /* No preventDefault here, deliberately: React 18 registers touchstart
           at its root as PASSIVE, so the call would be ignored and only log an
           intervention warning. `touch-action: none` on .doc-row-handle is what
           actually stops the browser panning — declarative, and it applies
           before the first event. Everywhere ELSE in the row a finger still
           scrolls the sidebar, which is the point of putting it on the handle
           alone. The touchmove listener below IS registered non-passive by
           hand, so preventDefault genuinely works there. */
        e.stopPropagation();

        const moveGhost = (x, y) => {
          if (ghostRef.current) ghostRef.current.style.transform = 'translate(' + (x + 14) + 'px,' + (y + 14) + 'px)';
        };

        const applyHit = hit => {
          touchRef.current.drop = hit;
          setTouchDrop(prev => sameDrop(prev, hit) ? prev : hit);
        };

        const onMove = ev => {
          const p = ev.touches[0];
          if (!p || !touchRef.current) return;
          ev.preventDefault();                       // and never scroll the list
          touchRef.current.x = p.clientX;
          touchRef.current.y = p.clientY;
          moveGhost(p.clientX, p.clientY);
          // near-edge auto-scroll is armed here but STEPPED by rAF below: a
          // finger held still at the edge fires no further touchmove, so
          // scrolling from this handler alone would stall after one nudge.
          const aside = asideRef.current;
          if (aside) {
            const r = aside.getBoundingClientRect();
            touchRef.current.edge = p.clientY < r.top + 48 ? -1
              : p.clientY > r.bottom - 48 ? 1 : 0;
          }
          applyHit(touchDropAt(p.clientX, p.clientY));
        };

        const step = () => {
          const d = touchRef.current;
          if (!d) return;
          const aside = asideRef.current;
          if (d.edge && aside) {
            aside.scrollTop += d.edge * 8;
            // rows moved under a stationary finger, so the target may differ
            applyHit(touchDropAt(d.x, d.y));
          }
          d.raf = requestAnimationFrame(step);
        };

        const detach = () => {
          const d = touchRef.current;
          if (d && d.raf) cancelAnimationFrame(d.raf);
          touchRef.current = null;
          document.removeEventListener('touchmove', onMove);
          document.removeEventListener('touchend', onEnd);
          document.removeEventListener('touchcancel', onCancel);
          setDragging(null);
          setTouchDrop(null);
        };

        const onEnd = () => {
          const d = touchRef.current;
          const drop = d && d.drop;
          const mode = d && d.mode;
          const pageId = d && d.pageId;
          detach();
          if (!drop) return;                          // released over nothing
          if (drop.root) promotePageToRoot(pageId);
          else if (mode === 'nest') nestPage(pageId, drop.targetId);
          else arrangePage(pageId, drop.targetId, drop.before);
        };

        /* iPadOS fires touchcancel instead of touchend whenever the system
           takes the gesture over — an edge swipe, a notification. Committing
           there would move a page the finger was only passing across. */
        const onCancel = () => detach();

        touchRef.current = { mode, pageId: page.id, x: t.clientX, y: t.clientY, drop: null, edge: 0, raf: 0 };
        setDragging({ mode, pageId: page.id, x: t.clientX, y: t.clientY,
          label: (page.icon || '📄') + '  ' + (page.title || 'Untitled') });
        setTouchDrop(null);

        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
        document.addEventListener('touchcancel', onCancel);
        touchRef.current.raf = requestAnimationFrame(step);
      }

      // promote: dragged leaves its parent and becomes the last root page
      function promotePageToRoot(id) {
        setDocPages(prev => {
          const i = prev.findIndex(p => p.id === id);
          if (i < 0 || !prev[i].parentId) return prev;
          const arr = [...prev];
          const [moved] = arr.splice(i, 1);
          arr.push({...moved, parentId: null, updatedAt: Date.now()});
          return arr;
        });
      }

      // ── block mutations (on the active page) ──
      function newBlock(type, extra) {
        const base = {id: genId(), type};
        if (['h1','h2','h3','p'].includes(type)) base.text = '';
        if (type === 'image') { base.src = ''; base.alt = ''; }
        if (type === 'table') base.rows = [['',''],['','']];
        if (type === 'link') { base.label=''; base.url=''; base.dumpRef=null; base.addedAt=Date.now(); }
        // hidden holds the switched-OFF categories, so a new calendar shows
        // everything and any category added to calendar-core.js later is on by
        // default for calendars that already exist
        if (type === 'calendar') { base.hidden = []; base.scope = 'subtree'; }
        return {...base, ...(extra||{})};
      }
      function addBlock(type, extra) {
        if (!activePage) return;
        const b = newBlock(type, extra);
        patchBlocks(activePage.id, blocks => {
          const i = blocks.findIndex(x => x.id === activeBlockId);
          if (i < 0) return [...blocks, b];
          return [...blocks.slice(0, i+1), b, ...blocks.slice(i+1)];
        });
        setActiveBlockId(b.id);
      }
      const updateBlock = b => patchBlocks(activePage.id, blocks => blocks.map(x => x.id===b.id ? b : x));
      // The ✕ sits in hover chrome right beside Move up / Move down, and a table
      // or an embedded image can carry a lot of work. Name the kind so the
      // prompt says what is actually at stake.
      const deleteBlock = id => {
        const KIND = { p:'text', h1:'heading', h2:'heading', h3:'heading', divider:'divider',
          image:'image', link:'link', table:'table', calendar:'calendar' };
        const b = ((activePage && activePage.blocks) || []).find(x => x.id === id);
        const kind = (b && KIND[b.type]) || 'block';
        if (!window.confirm(`Delete this ${kind} block?\n\nThis cannot be undone.`)) return;
        patchBlocks(activePage.id, blocks => blocks.filter(x => x.id!==id));
      };
      const moveBlock = (id, dir) => patchBlocks(activePage.id, blocks => {
        const i = blocks.findIndex(x => x.id===id), j = i + dir;
        if (i < 0 || j < 0 || j >= blocks.length) return blocks;
        const next = [...blocks]; [next[i], next[j]] = [next[j], next[i]];
        return next;
      });

      // Calendar blocks author into calendarNotes / deadlines, which
      // progress.html owns. Each edit re-reads the stored array, applies fn to
      // it and writes only that key, so nothing another page or tab wrote in
      // the meantime is rebuilt from this page's snapshot.
      function mutateSlotArray(key, fn) {
        const next = _mutateSlotKey(key, fn);
        setSlot(s => ({...s, [key]: next}));
        setDbSize(dbSizeBytes());
      }

      const dumpTitleFor = ref => {
        const d = dumpsSnapshot.dumps.find(d => d.id === ref.dumpId);
        if (!d) return null;
        const l = (d.mmLinks||[]).find(l => l.id === ref.linkId);
        return (l && (l.links||[]).some(u => u.id === ref.urlId)) ? d.title : null;
      };

      function openDumpModal() {
        setDumpsSnapshot({
          dumps: _readP('sourceDumps', []).filter(d => d.parentId !== d.id),
          mms: _readP('mms', [])
        });
        setShowDumpModal(true);
      }

      function exportPDF() {
        if (!activePage) return;
        const prev = document.title;
        const restore = () => { document.title = prev; window.removeEventListener('afterprint', restore); };
        window.addEventListener('afterprint', restore);
        document.title = ((activePage.icon ? activePage.icon+' ' : '') + (activePage.title || 'Untitled'));
        window.print();
        setTimeout(restore, 1500);
      }

      const ancestors = useMemo(() => {
        const out = [];
        let cur = activePage, guard = 0;
        while (cur && cur.parentId && guard++ < 50) {
          const parent = docPages.find(p => p.id === cur.parentId);
          if (!parent) break;
          out.unshift(parent); cur = parent;
        }
        return out;
      }, [docPages, activePageId]);

      const favorites = docPages.filter(p => p.favorite);
      const roots = docPages.filter(p => !p.parentId || !docPages.some(x => x.id === p.parentId));

      if (!slotReady) {
        // Two different reasons land here and the advice is opposite. "Open Progress once
        // to migrate it" is right for un-migrated legacy data and actively wrong for a
        // damaged database, where the one thing that matters is not writing to it. The
        // storage-guard banner carries the detail; this panel must not contradict it.
        const blocked = window.TrackStorage && TrackStorage.dbBlocked();
        return (
          <div className="flex h-screen items-center justify-center bg-gray-950 font-mono text-sm text-gray-400">
            <div className="max-w-md rounded border border-gray-800 bg-gray-900 p-6 text-center">
              <div className="mb-2 text-gray-200">
                {blocked ? 'Saved data could not be read' : 'No workspace loaded yet'}
              </div>
              {blocked ? (
                <p className="text-xs leading-relaxed">
                  Your data has not been changed or deleted, and this page will not write
                  over it. Use “Download a copy” in the banner to save the stored data
                  before changing anything.
                </p>
              ) : (
                <p className="text-xs leading-relaxed">
                  Older Track data was found that has not been migrated. Open
                  <a href="progress.html" className="mx-1 text-cyan-300 underline">Progress</a>or
                  <a href="sir-ks02.html" className="mx-1 text-cyan-300 underline">KS02</a>
                  once to migrate it, or create a workspace on the
                  <a href="index.html" className="mx-1 text-cyan-300 underline">Home</a>page.
                </p>
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="flex h-screen flex-col bg-gray-950 font-mono text-gray-300">
          {/* Header */}
          <header className="docs-header sticky top-0 z-10 flex items-center gap-3 border-b border-gray-800 bg-gray-900/90 px-3 py-2 backdrop-blur-sm">
            <a href="index.html" className="text-xs text-gray-600 transition-colors hover:text-gray-300">← TRACK</a>
            <span className="text-xs font-bold tracking-widest text-gray-300">DOCUMENTATIONS</span>
            {slotName && <span className="rounded bg-gray-800 px-1.5 py-0.5 text-[10px] text-gray-500">{slotName}</span>}
            <SyncChip dbSize={dbSize} />
            <div className="flex-1"></div>
            <div className="theme-toggle-host" data-theme-toggle-host></div>
          </header>

          <div className="flex min-h-0 flex-1">
            {/* Sidebar */}
            <aside ref={asideRef}
              className={"docs-sidebar flex w-60 shrink-0 flex-col overflow-y-auto border-r border-gray-800 bg-gray-900/60 p-2"
                +(sidebarFull?' docs-sidebar-full':'')}>
              <div className="docs-sidebar-top mb-2 flex items-center justify-between gap-2">
                <span className="doc-side-label text-[10px] font-bold uppercase tracking-widest text-gray-600">
                  {sidebarFull ? 'All pages' : ''}
                </span>
                <button data-doc-fullscreen onClick={()=>setSidebarFull(f=>!f)}
                  title={sidebarFull ? 'Exit full screen (Esc)' : 'Expand to full screen'}
                  aria-label={sidebarFull ? 'Exit full screen' : 'Expand to full screen'}
                  className="doc-side-full rounded px-2 py-1 text-xs text-gray-500 hover:bg-gray-800 hover:text-white">
                  {sidebarFull ? '✕' : '⛶'}
                </button>
              </div>
              {favorites.length > 0 && (
                <div className="mb-3">
                  <div className="doc-side-label mb-1 px-1 text-[10px] font-bold uppercase tracking-widest text-gray-600">Favorites</div>
                  {favorites.map(p => (
                    <div key={p.id}
                      className={"doc-fav-row flex cursor-pointer items-center gap-1 rounded px-2 py-0.5 text-xs "+(p.id===activePageId?'bg-gray-800 text-gray-100':'text-gray-400 hover:bg-gray-800/60 hover:text-gray-200')}
                      onClick={()=>{setActivePageId(p.id); setSidebarFull(false);}}>
                      <span>{p.icon || '📄'}</span>
                      <span className="truncate">{p.title || 'Untitled'}</span>
                    </div>
                  ))}
                </div>
              )}
              <div className={"mb-1 flex items-center justify-between rounded border px-1 "+((rootDragOver||(touchDrop&&touchDrop.root))?'border-violet-500 bg-violet-950/20':'border-transparent')}
                data-doc-root-drop
                onDragOver={e=>{ if (e.dataTransfer.types.includes('application/docpage-nest-id')) { e.preventDefault(); setRootDragOver(true); } }}
                onDragLeave={e=>{ if (!e.currentTarget.contains(e.relatedTarget)) setRootDragOver(false); }}
                onDrop={e=>{
                  const id = e.dataTransfer.getData('application/docpage-nest-id');
                  if (id) { e.preventDefault(); promotePageToRoot(id); }
                  setRootDragOver(false);
                }}>
                <span className="doc-side-label text-[10px] font-bold uppercase tracking-widest text-gray-600">Pages</span>
                {(rootDragOver || (touchDrop && touchDrop.root)) ? (
                  <span className="doc-drop-hint text-[9px] text-violet-300">↑ drop to move to top level</span>
                ) : (
                  <button onClick={()=>addPage(null)} title="Add page"
                    className="doc-side-add rounded px-1 text-xs text-gray-500 hover:bg-gray-800 hover:text-white">＋</button>
                )}
              </div>
              {roots.length === 0 && (
                <button onClick={()=>addPage(null)}
                  className="mx-1 rounded border border-dashed border-gray-700 py-3 text-xs text-gray-500 hover:border-gray-500 hover:text-gray-300">
                  Create your first page
                </button>
              )}
              {roots.map(p => (
                <PageTreeItem key={p.id} page={p} pages={docPages} depth={0}
                  activePageId={activePageId} collapsed={collapsed}
                  onToggleCollapse={id=>setCollapsed(c=>({...c,[id]:!c[id]}))}
                  onSelect={id=>{setActivePageId(id); setSidebarFull(false);}} onAddChild={addPage}
                  onToggleFav={toggleFav} onDelete={deletePage}
                  onNest={nestPage} onArrange={arrangePage}
                  onTouchDragStart={startTouchDrag} touchDrop={touchDrop} />
              ))}
              <button onClick={()=>addPage(null)}
                className="doc-side-addrow mt-2 rounded px-2 py-1 text-left text-xs text-gray-600 hover:bg-gray-800 hover:text-gray-300">
                ＋ Add page
              </button>
            </aside>
            {/* follows the finger; moved imperatively so a drag costs no render */}
            {dragging && (
              <div ref={ghostRef} className="doc-drag-ghost"
                style={{transform: 'translate(' + (dragging.x + 14) + 'px,' + (dragging.y + 14) + 'px)'}}>
                <span className="doc-drag-ghost-mode">{dragging.mode === 'nest' ? '⠿' : '⇅'}</span>
                {dragging.label}
              </div>
            )}

            {/* Editor */}
            <main className="docs-editor min-w-0 flex-1 overflow-y-auto">
              {!activePage ? (
                <div className="flex h-full items-center justify-center text-xs text-gray-600">
                  Select or create a page from the sidebar.
                </div>
              ) : (
                <div className="mx-auto max-w-3xl px-10 py-10 font-sans">
                  {/* breadcrumb */}
                  {ancestors.length > 0 && (
                    <div className="docs-toolbar mb-2 flex flex-wrap items-center gap-1 text-[11px] text-gray-500">
                      {ancestors.map(a => (
                        <React.Fragment key={a.id}>
                          <button onClick={()=>setActivePageId(a.id)} className="hover:text-gray-200">
                            {a.icon || '📄'} {a.title || 'Untitled'}
                          </button>
                          <span>/</span>
                        </React.Fragment>
                      ))}
                      <span className="text-gray-400">{activePage.icon || '📄'} {activePage.title || 'Untitled'}</span>
                    </div>
                  )}

                  {/* toolbar */}
                  <div className="docs-toolbar mb-4 flex flex-wrap items-center gap-2">
                    <button onClick={exportPDF}
                      className="rounded border border-gray-700 bg-gray-900 px-2 py-1 text-[11px] text-gray-300 hover:border-gray-500"
                      title="Opens the print dialog — choose 'Save as PDF' to share this page">
                      ⤓ Export / PDF
                    </button>
                    <span className="text-[10px] text-gray-600">created {activePage.createdAt}</span>
                    <button onClick={()=>toggleFav(activePage.id)}
                      title={activePage.favorite ? 'Remove from favorites' : 'Add to favorites'}
                      aria-label={activePage.favorite ? 'Remove from favorites' : 'Add to favorites'}
                      aria-pressed={!!activePage.favorite}
                      className={"ml-auto flex min-h-[2.75rem] min-w-[2.75rem] items-center justify-center rounded-lg border text-2xl leading-none "
                        +(activePage.favorite
                          ? 'border-amber-500/60 bg-amber-500/10 text-amber-300 hover:border-amber-400'
                          : 'border-gray-700 bg-gray-900 text-gray-500 hover:border-gray-500 hover:text-amber-300')}>
                      {activePage.favorite ? '★' : '☆'}
                    </button>
                  </div>

                  {/* icon + title */}
                  <div className="relative mb-1">
                    <button onClick={()=>setShowEmoji(v=>!v)} title="Change page icon"
                      className="rounded p-1 text-4xl hover:bg-gray-800/60">
                      {activePage.icon || '📄'}
                    </button>
                    {showEmoji && (
                      <EmojiPicker
                        onPick={e=>{ patchPage(activePage.id, {icon: e}); setShowEmoji(false); }}
                        onClose={()=>setShowEmoji(false)} />
                    )}
                  </div>
                  <input value={activePage.title} placeholder="Untitled"
                    onChange={e=>patchPage(activePage.id, {title: e.target.value})}
                    className="mb-6 w-full bg-transparent text-4xl font-bold text-gray-100 outline-none placeholder-gray-700" />

                  {/* blocks */}
                  <div className="space-y-1 pl-2">
                    {(activePage.blocks||[]).map(b => (
                      <BlockShell key={b.id} block={b}
                        onMove={dir=>moveBlock(b.id, dir)}
                        onDelete={()=>deleteBlock(b.id)}
                        onSetType={t=>updateBlock({...b, type: t})}>
                        {['h1','h2','h3','p'].includes(b.type) && (
                          <AutoTextarea value={b.text||''} className={TEXT_STYLES[b.type]}
                            placeholder={b.type==='p' ? "Type something…" : "Heading"}
                            onFocus={()=>setActiveBlockId(b.id)}
                            onChange={e=>updateBlock({...b, text: e.target.value})} />
                        )}
                        {b.type === 'divider' && <hr className="my-2 border-gray-800" onClick={()=>setActiveBlockId(b.id)} />}
                        {b.type === 'table' && <TableBlock block={b} onChange={updateBlock} onFocus={()=>setActiveBlockId(b.id)} />}
                        {b.type === 'link' && <LinkBlock block={b} onChange={updateBlock} onFocus={()=>setActiveBlockId(b.id)} dumpTitleFor={dumpTitleFor} />}
                        {b.type === 'image' && <ImageBlock block={b} onChange={updateBlock} onFocus={()=>setActiveBlockId(b.id)} />}
                        {b.type === 'calendar' && (
                          <CalendarBlock block={b} page={activePage} docPages={docPages} slot={slot}
                            onChange={updateBlock} onFocus={()=>setActiveBlockId(b.id)}
                            onOpenPage={setActivePageId} onMutate={mutateSlotArray} />
                        )}
                      </BlockShell>
                    ))}
                  </div>

                  {/* add-block menu */}
                  <div className="docs-addmenu mt-4 flex flex-wrap gap-1 border-t border-gray-800/70 pt-3 text-[11px]">
                    {/* 'dump' and 'tablepaste' are pseudo-types: neither is a block
                        kind, each opens a modal that ends in an ordinary addBlock. */}
                    {[['h1','H1'],['h2','H2'],['h3','H3'],['p','Text'],['dump','⛁ Reference source dump'],['link','🔗 Link'],['table','▦ Table'],['tablepaste','▦ Paste table'],['image','🖼 Image'],['divider','― Divider'],['calendar','🗓 Calendar']].map(([t,l]) => (
                      <button key={t} onClick={()=> t==='dump' ? openDumpModal() : t==='tablepaste' ? setShowPasteTable(true) : addBlock(t)}
                        className="rounded border border-gray-800 bg-gray-900 px-2 py-1 text-gray-400 hover:border-gray-600 hover:text-gray-200">
                        {l}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </main>
          </div>

          {showDumpModal && (
            <SourceDumpModal dumps={dumpsSnapshot.dumps} mms={dumpsSnapshot.mms}
              onPick={({label, url, dumpRef}) => {
                addBlock('link', {label, url, dumpRef, addedAt: Date.now()});
                setShowDumpModal(false);
              }}
              onClose={()=>setShowDumpModal(false)} />
          )}

          {showPasteTable && (
            <PasteTableModal
              onInsert={(rows, merges) => {
                // withMerges, not a literal — it is what deletes the key when
                // the pasted table has no merged cells, so an ordinary table
                // is stored in exactly the shape it always was.
                addBlock('table', window.TrackDocTable.withMerges({rows}, merges));
                setShowPasteTable(false);
              }}
              onClose={()=>setShowPasteTable(false)} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script src="notes-widget.js?v=2"></script>
</body>
</html>
